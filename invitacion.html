<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Invitación Premium 🎉</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#ff9a00,#ff3c38);
color:white;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
overflow:hidden;
text-align:center;
}

.card{
background:rgba(0,0,0,0.65);
padding:30px;
border-radius:20px;
max-width:420px;
width:90%;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
animation:fadeIn 1s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:scale(0.9);}
to{opacity:1;transform:scale(1);}
}

h1{margin:10px 0;}
h2{margin:5px 0;font-weight:400;}

.countdown{
font-size:1.2em;
margin:15px 0;
font-weight:bold;
}

.btn{
background:#25D366;
padding:15px 20px;
border-radius:10px;
color:white;
text-decoration:none;
display:inline-block;
margin-top:10px;
font-weight:bold;
}

.small{
font-size:0.9em;
opacity:0.8;
}

.confetti {
position:absolute;
width:8px;
height:8px;
background:white;
top:-10px;
animation:fall 4s linear infinite;
}

@keyframes fall{
to{transform:translateY(110vh) rotate(360deg);}
}
</style>
</head>

<body>

<div class="card">

<h2>🎉 Estás invitado al cumpleaños de</h2>

<h1 id="nombre">🎂 NOMBRE AQUÍ</h1>

<p>📍 Go Pollos Rhosse</p>

<p>📅 Fecha: <strong id="fechaTexto">FECHA AQUÍ</strong></p>

<div class="countdown" id="countdown">⏳ Cargando cuenta regresiva...</div>

<a class="btn" href="https://wa.me/591XXXXXXXX">
Confirmar asistencia 📲
</a>

<p class="small">¡Te esperamos para celebrar juntos! 🥳</p>

</div>

<script>

// ====== FECHA DEL EVENTO ======
// FORMATO: "2026-05-01T18:00:00"
const evento = new Date("2026-05-01T18:00:00").getTime();

function actualizar(){
const ahora = new Date().getTime();
const diferencia = evento - ahora;

const dias = Math.floor(diferencia / (1000*60*60*24));
const horas = Math.floor((diferencia % (1000*60*60*24))/(1000*60*60));
const minutos = Math.floor((diferencia % (1000*60*60))/(1000*60));
const segundos = Math.floor((diferencia % (1000*60))/1000);

document.getElementById("countdown").innerHTML =
`⏳ ${dias}d ${horas}h ${minutos}m ${segundos}s`;

if(diferencia < 0){
document.getElementById("countdown").innerHTML = "🎉 ¡ES HOY LA FIESTA!";
}
}

setInterval(actualizar,1000);

// ===== CONFETTI SIMPLE =====
for(let i=0;i<30;i++){
let c=document.createElement("div");
c.classList.add("confetti");
c.style.left=Math.random()*100+"vw";
c.style.animationDuration=(2+Math.random()*3)+"s";
c.style.background=["#fff","#ff0","#0ff","#f0f"][Math.floor(Math.random()*4)];
document.body.appendChild(c);
}

</script>

</body>
</html>
