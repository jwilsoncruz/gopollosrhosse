<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Pollos Rhosse</title>

<style>

/* ===== ESTILO GENERAL ===== */
body{
font-family:Arial;
margin:0;
background:linear-gradient(180deg,#2b0b00,#5d1f00);
color:white;
overflow-x:hidden;
transition:background 1s;
}

*{transition: all 0.3s ease;}

header{
text-align:center;
padding:20px;
}

.logo{
width:150px;
animation: flotar 3s infinite;
}

@keyframes flotar{
0%{transform:translateY(0);}
50%{transform:translateY(-8px);}
100%{transform:translateY(0);}
}

.marquesina{
background:#ff6f00;
padding:10px;
font-weight:bold;
text-align:center;
animation: brillo 2s infinite alternate;
}

@keyframes brillo{
from{filter:brightness(1);}
to{filter:brightness(1.2);}
}

.container{
background:white;
color:black;
border-radius:20px 20px 0 0;
padding:15px;
animation: subir 0.8s;
}

@keyframes subir{
from{opacity:0; transform:translateY(30px);}
to{opacity:1; transform:translateY(0);}
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:10px;
}

.card{
background:white;
border-radius:10px;
padding:10px;
text-align:center;
transform:translateY(20px);
opacity:0;
animation: aparecer 0.5s forwards;
}

@keyframes aparecer{
to{opacity:1; transform:translateY(0);}
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
height:100px;
object-fit:cover;
border-radius:10px;
}

.boton{
background:#ff6f00;
color:white;
padding:8px;
border:none;
border-radius:8px;
cursor:pointer;
}

.boton:hover{transform:scale(1.1);}
.boton:active{transform:scale(0.9);}

.carrito{
position:fixed;
bottom:0;
width:100%;
background:#fff;
color:black;
padding:10px;
}

#barraPollos{
height:10px;
background:red;
transition:0.5s;
}

@keyframes parpadeo{
0%{opacity:1;}
50%{opacity:0.5;}
100%{opacity:1;}
}

</style>
</head>

<body>

<div class="marquesina" id="textoMarquesina">Cargando...</div>

<header>
<img src="logo.png" class="logo">
<h2>Go Pollos Rhosse</h2>
<div id="estadoLocal"></div>

<div id="contadorPollos">
<div id="estadoLenia"></div>
<div id="tiempoApertura"></div>
</div>

<div style="background:#ddd;border-radius:10px;">
<div id="barraPollos"></div>
</div>

<div id="textoEscasez"></div>

</header>

<div class="container">

<h3 id="categoria-almuerzo">Almuerzo</h3>
<div id="almuerzo" class="grid"></div>

<h3 id="categoria-cena">Cena</h3>
<div id="cena" class="grid"></div>

</div>

<div class="carrito">
<div id="resumen"></div>
<div id="total"></div>
<button class="boton" onclick="enviarPedido()">Enviar Pedido</button>
</div>

<script>

// ===== CONFIG CENTRAL =====
const CONFIG = {
apertura:{h:16,m:0},
cierre:{h:22,m:30},
prender:{h:15,m:0},

almuerzo:{inicio:{h:11,m:0},fin:{h:13,m:30}},
cena:{inicio:{h:16,m:0},fin:{h:22,m:30}}
};

function ahoraMin(){
let d=new Date();
return d.getHours()*60+d.getMinutes();
}

function enRango(a,b){
let t=ahoraMin();
return t>=a.h*60+a.m && t<=b.h*60+b.m;
}

// ===== ESTADO =====
let pollosDisponibles=5;
let totalPollos=5;

function getEstado(){

if(pollosDisponibles<=0) return "AGOTADO";

if(enRango(CONFIG.apertura,CONFIG.cierre)) return "ABIERTO";

return "CERRADO";
}

// ===== UI =====
function actualizarEstado(){

let estado=getEstado();
let el=document.getElementById("estadoLocal");

if(estado==="ABIERTO"){
el.innerHTML="🟢 Abierto";
}else if(estado==="AGOTADO"){
el.innerHTML="🍗 Agotado";
}else{
el.innerHTML="🔴 Cerrado";
}

document.querySelectorAll(".boton").forEach(b=>{
b.disabled = estado!=="ABIERTO";
});

}

function actualizarMarquesina(){

let estado=getEstado();
let m=document.getElementById("textoMarquesina");

if(estado==="ABIERTO"){
m.innerHTML="🔥 Pollos disponibles ahora";
}
else if(estado==="AGOTADO"){
m.innerHTML="🍗 Agotado por hoy";
}
else{
m.innerHTML="⏳ Abrimos pronto";
}

}

function contadorLenia(){

let estado=getEstado();
let e=document.getElementById("estadoLenia");
let t=document.getElementById("tiempoApertura");

if(estado==="ABIERTO"){
e.innerHTML="🔥 Producción";
t.innerHTML="Pollos saliendo";
return;
}

let apertura=new Date();
apertura.setHours(CONFIG.apertura.h,CONFIG.apertura.m,0,0);

let diff=apertura-new Date();

let h=Math.floor(diff/3600000);
let m=Math.floor(diff%3600000/60000);
let s=Math.floor(diff%60000/1000);

e.innerHTML="⏳ Abrimos en";
t.innerHTML=h+":"+m+":"+s;

}

// ===== PRODUCTOS =====
const productos=[
{cat:"almuerzo",n:"Pollo Entero",p:100,img:"entero.jpg"},
{cat:"cena",n:"Medio Pollo",p:50,img:"medio.jpg"}
];

let carrito=[];

function cargar(){

productos.forEach(p=>{
let d=document.createElement("div");
d.className="card";

d.innerHTML=`
<img src="${p.img}">
<h4>${p.n}</h4>
<div>Bs ${p.p}</div>
<button class="boton" onclick="agregar('${p.n}',${p.p})">Agregar</button>
`;

document.getElementById(p.cat).appendChild(d);
});

}

function agregar(n,p){

carrito.push({n,p});

pollosDisponibles--;
if(pollosDisponibles<0)pollosDisponibles=0;

document.querySelector(".carrito").style.transform="scale(1.1)";
setTimeout(()=>{document.querySelector(".carrito").style.transform="scale(1)";},200);

actualizar();

}

function actualizar(){

let html="";
let total=0;

carrito.forEach((p,i)=>{
total+=p.p;
html+=`${p.n} Bs ${p.p}<br>`;
});

document.getElementById("resumen").innerHTML=html;
document.getElementById("total").innerHTML="Total Bs "+total;

let barra=document.getElementById("barraPollos");
let txt=document.getElementById("textoEscasez");

let porcentaje=(pollosDisponibles/totalPollos)*100;
barra.style.width=porcentaje+"%";

if(pollosDisponibles<=2){
barra.style.animation="parpadeo 1s infinite";
txt.innerHTML="⚠️ Pocos pollos!";
}else{
barra.style.animation="none";
}

}

// ===== TURNOS =====
function turnos(){

let a=document.getElementById("almuerzo");
let ta=document.getElementById("categoria-almuerzo");

let c=document.getElementById("cena");
let tc=document.getElementById("categoria-cena");

a.style.display="none";
c.style.display="none";

if(enRango(CONFIG.almuerzo.inicio,CONFIG.almuerzo.fin)){
a.style.display="grid";
ta.style.display="block";
}

if(enRango(CONFIG.cena.inicio,CONFIG.cena.fin)){
c.style.display="grid";
tc.style.display="block";
}

}

// ===== PEDIDO =====
function enviarPedido(){

if(getEstado()!=="ABIERTO"){
alert("Cerrado");
return;
}

alert("Pedido enviado");

}

// ===== LOOP =====
setInterval(()=>{
actualizarEstado();
actualizarMarquesina();
contadorLenia();
turnos();
},1000);

// ===== INIT =====
cargar();
actualizar();

</script>

</body>
</html>
