<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Go Pollos Rhosse | Pollos a la Leña en Trinidad</title>
<meta name="description" content="Pollos a la leña en Trinidad Beni Bolivia. Delivery rápido y económico.">

<link rel="icon" href="favicon.ico">

<script type="application/ld+json">
{
 "@context":"https://schema.org",
 "@type":"Restaurant",
 "name":"Go Pollos Rhosse",
 "address":{"@type":"PostalAddress","addressLocality":"Trinidad","addressRegion":"Beni","addressCountry":"BO"},
 "servesCuisine":"Pollo a la leña"
}
</script>

<style>
body{margin:0;font-family:Arial;background:#2b0b00;color:white}
header{text-align:center;padding:20px}
.logo{max-width:180px}
.marquesina{background:#ff9800;color:#000;padding:10px;font-weight:bold;text-align:center}
.container{background:white;color:black;border-radius:20px 20px 0 0;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.card{background:white;padding:10px;border-radius:10px;text-align:center}
.card img{width:100%;height:120px;object-fit:cover}
.boton{background:#ff6f00;color:white;border:none;padding:8px;border-radius:6px}
.carrito{position:fixed;bottom:0;left:0;right:0;background:white;color:black;padding:10px}
button{margin-top:5px}
</style>
</head>

<body>

<div class="marquesina" id="marquesina"></div>

<header>
<img src="logo.png" class="logo" id="logo">
<h1>Go Pollos Rhosse</h1>
<div id="estado"></div>
</header>

<div class="container">
<h2>🍗 Menú</h2>
<div id="menu" class="grid"></div>
</div>

<div class="carrito">
<div id="carrito">Vacío</div>
<div id="total">Total Bs 0</div>

<button onclick="enviar()">📲 WhatsApp</button>
<button onclick="llamarMesero()">🛎 Llamar Mesero</button>

</div>

<!-- SONIDO -->
<audio id="sonidoPedido">
<source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg">
</audio>

<script>

// ===== CONFIG =====
const WA="59172685867";
const API_CONFIG="TU_API_SHEETS_AQUI";

// ===== HORARIO =====
const HORARIO={apertura:16,cierre:22};

// ===== STOCK =====
let totalPollos=5;
let pollosDisponibles=5;

// ===== PRODUCTOS =====
const productos=[
{n:"Pollo Entero",p:100,img:"entero.jpg"},
{n:"Medio Pollo",p:50,img:"medio.jpg"},
{n:"Cuarto Pollo",p:25,img:"cuarto.jpg"},
{n:"Gaseosa",p:6,img:"gaseosa.jpg"}
];

let carrito=[];

// ===== MENU =====
function cargar(){
const cont=document.getElementById("menu");
productos.forEach(p=>{
let d=document.createElement("div");
d.className="card";
d.innerHTML=`
<img src="${p.img}">
<h3>${p.n}</h3>
<p>Bs ${p.p}</p>
<button class="boton" onclick="add('${p.n}',${p.p})">Agregar</button>
`;
cont.appendChild(d);
});
}

// ===== CARRITO =====
function add(n,p){
carrito.push({n,p});
if(n.includes("Pollo")){
pollosDisponibles--;
if(pollosDisponibles<0) pollosDisponibles=0;
}
render();
}

function render(){
let html="",total=0;
carrito.forEach((i,idx)=>{
total+=i.p;
html+=`${i.n} Bs ${i.p} <button onclick="del(${idx})">❌</button><br>`;
});
document.getElementById("carrito").innerHTML=html||"Vacío";
document.getElementById("total").innerHTML="Total Bs "+total;
}

function del(i){
carrito.splice(i,1);
render();
}

// ===== ESTADO =====
function abierto(){
let h=new Date().getHours();
return h>=HORARIO.apertura && h<=HORARIO.cierre;
}

function estado(){
let e=document.getElementById("estado");
if(abierto()){
e.innerHTML="🟢 Abierto";
}else{
e.innerHTML="🔴 Cerrado";
}
}

// ===== MARKETING PRO (URGENTE) =====
function marketing(){
let m=document.getElementById("marquesina");

if(pollosDisponibles<=0){
m.innerHTML="❌ HOY SE AGOTÓ TODO — Vuelve mañana 🔥";
return;
}

if(pollosDisponibles==1){
m.innerHTML="🚨 ÚLTIMO POLLO DISPONIBLE — PÍDELO YA 🔥";
return;
}

if(pollosDisponibles<=2){
m.innerHTML="⚠️ QUEDAN SOLO "+pollosDisponibles+" POLLOS — ALTA DEMANDA 🔥";
return;
}

if(abierto()){
m.innerHTML="🔥 POLLOS SALIENDO DE LA LEÑA — PIDE AHORA 🚀";
}else{
m.innerHTML="⏳ ABRIMOS 16:00 — PUEDES RESERVAR";
}
}

// ===== WHATSAPP =====
function enviar(){

if(carrito.length===0){
alert("Agrega productos");
return;
}

let txt="🍗 Pedido Go Pollos Rhosse\n\n";
let total=0;

carrito.forEach(i=>{
txt+=`${i.n} Bs ${i.p}\n`;
total+=i.p;
});

txt+="\nTotal Bs "+total;

window.open(`https://wa.me/${WA}?text=`+encodeURIComponent(txt));

// 🔊 SONIDO
document.getElementById("sonidoPedido").play();

// ✅ CONFIRMACIÓN
setTimeout(()=>{
alert("✅ Pedido enviado. Te confirmamos por WhatsApp.");
},500);

carrito=[];
render();
}

// ===== LLAMAR MESERO =====
function llamarMesero(){
alert("🛎 Mesero en camino...");
}

// ===== GOOGLE SHEETS =====
async function controlRemoto(){
if(!API_CONFIG.includes("http")) return;

try{
let r=await fetch(API_CONFIG);
let d=await r.json();

if(d.pollos) pollosDisponibles=parseInt(d.pollos);

if(d.mensaje){
document.getElementById("marquesina").innerHTML=d.mensaje;
}

}catch(e){
console.log("Sheets offline");
}
}

// ===== ADMIN =====
let clicks=0;
document.getElementById("logo").onclick=()=>{
clicks++;
if(clicks>=5){
pollosDisponibles=totalPollos;
alert("ADMIN: Stock reiniciado");
clicks=0;
}
setTimeout(()=>clicks=0,2000);
};

// ===== RETENCIÓN CLIENTE =====
setTimeout(()=>{
if(carrito.length===0){
alert("🔥 PROMO: Hoy papas GRATIS en tu pedido 🍟");
}
},15000);

// ===== INIT =====
cargar();
estado();
marketing();

setInterval(()=>{
estado();
marketing();
controlRemoto();
},5000);

</script>

</body>
</html>
