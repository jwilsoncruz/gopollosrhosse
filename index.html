<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Pollos Rhosse - Trinidad</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body{ font-family: Arial, sans-serif; margin:0; background:#610000; padding-bottom:240px; color: white; }
        header{ text-align:center; padding:30px 20px; background:#d50000; color:white; }
        .logo{ max-width:180px; display:block; margin:0 auto 10px auto; }
        .container{ padding:20px; }
        .categoria{ margin-top:25px; font-size:22px; color:#FFFF00; border-bottom: 2px solid #FFFF00; padding-bottom: 5px; }
        .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:15px; margin-top: 15px; }
        .card{ background:white; padding:15px; border-radius:14px; color: #333; text-align:center; box-shadow:0 4px 10px rgba(0,0,0,0.3); }
        .card img{ width:100%; height:110px; object-fit:cover; border-radius:10px; }
        .precio{ font-weight:bold; margin:8px 0; color: #d50000; font-size: 1.2em; }
        .boton{ background:#25D366; color:white; padding:10px; border:none; border-radius:8px; cursor:pointer; font-weight:bold; width: 100%; }
        .carrito{ position:fixed; bottom:0; left:0; right:0; background:white; color: #333; padding:15px; box-shadow:0 -3px 10px rgba(0,0,0,0.5); z-index:1000; }
        .cocina-card{ background:white; color:#333; margin:15px; padding:15px; border-left:8px solid #d50000; border-radius:10px; }
    </style>
</head>
<body>

<div id="app"></div>

<script>
const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxXnNPSV2OTURsEO94cg3HwKjzFMIUJcytuyXyuWsKJ7VJOy80kSHneT6W9sGyEOpDRoQ/exec";
const params = new URLSearchParams(window.location.search);
const modo = params.get("modo");

// PRODUCTOS ORIGINALES RECUPERADOS
const productos = [
    {categoria:"pollos", nombre:"Pollo Económico", precio:15, img:"menu.jpg"},
    {categoria:"pollos", nombre:"Cuarto Pollo", precio:25, img:"medio.jpg"},
    {categoria:"pollos", nombre:"Medio Pollo", precio:50, img:"cuarto.jpg"},
    {categoria:"pollos", nombre:"Pollo Entero", precio:100, img:"entero.jpg"},
    {categoria:"bebidas", nombre:"Gaseosa 2L", precio:13, img:"gaseosa2l.jpg"},
    {categoria:"bebidas", nombre:"Gaseosa Personal", precio:6, img:"gaseosa.jpg"},
    {categoria:"bebidas", nombre:"Limonada Jarra media", precio:5, img:"limonada_mediana.jpg"},
    {categoria:"bebidas", nombre:"Limonada Jarra Grande", precio:10, img:"limonada_grande.jpg"},
    {categoria:"bebidas", nombre:"Limonada Vaso", precio:3, img:"limonada_vaso.jpg"},
    {categoria:"extras", nombre:"Extra Platano", precio:5, img:"extra_platano.jpg"},
    {categoria:"extras", nombre:"Extra Papas", precio:5, img:"extra_papas.jpeg"},
    {categoria:"extras", nombre:"Extra Arroz", precio:5, img:"extra_arroz.jpg"}
];

// MODO COCINA
if(modo === "cocina"){
    document.getElementById("app").innerHTML = `
        <header><h1>🍗 PANTALLA COCINA</h1><button onclick="location.reload()" style="padding:5px 15px;">🔄 Refrescar</button></header>
        <div id="listaPedidos"></div>
        <audio id="alerta" preload="auto"><source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" type="audio/ogg"></audio>
    `;

    function cargarPedidosCocina() {
        fetch(URL_SCRIPT).then(r => r.json()).then(pedidos => {
            const pendientes = pedidos.filter(p => p.estado !== "Listo");
            let html = "";
            pendientes.reverse().forEach(p => {
                html += `
                <div class="cocina-card">
                    <strong>${p.tipo} - Mesa: ${p.mesa}</strong><br>
                    <p style="font-size:1.2em;">${p.detalle.replace(/\n/g, "<br>")}</p>
                    <button onclick="marcarListo('${p.fecha}')" style="background:#d50000;color:white;padding:10px;width:100%;border:none;border-radius:5px;font-weight:bold;">✅ TERMINAR PEDIDO</button>
                </div>`;
            });
            document.getElementById("listaPedidos").innerHTML = html || "<h2 style='text-align:center;'>No hay pedidos pendientes</h2>";
        });
    }

    window.marcarListo = function(f) {
        fetch(URL_SCRIPT, { method: "POST", mode: "no-cors", body: JSON.stringify({ actualizar: true, fecha: f }) });
        setTimeout(cargarPedidosCocina, 800);
    };

    setInterval(cargarPedidosCocina, 5000);
    cargarPedidosCocina();
} 

// MODO CLIENTE
else {
    document.getElementById("app").innerHTML = `
        <header><img src="logo.png" class="logo"><h1>Go Pollos Rhosse</h1><p>Trinidad, Beni</p></header>
        <div class="container">
            <h2 class="categoria">🍗 Pollos a la leña</h2><div id="pollos" class="grid"></div>
            <h2 class="categoria">🥤 Bebidas</h2><div id="bebidas" class="grid"></div>
            <h2 class="categoria">🍔 Extras</h2><div id="extras" class="grid"></div>
        </div>
        <div class="carrito">
            <div id="resumen">Sin productos</div>
            <div style="font-weight:bold;font-size:20px;" id="total">Total: Bs 0</div>
            <div style="margin:10px 0;">
                <input type="radio" name="tipoPedido" value="Mesa" checked> Mesa
                <input type="radio" name="tipoPedido" value="Recoger"> Recoger
                <input type="radio" name="tipoPedido" value="Delivery"> Delivery
            </div>
            <button class="boton" onclick="enviarPedido()">🚀 ENVIAR PEDIDO</button>
        </div>
    `;

    let carrito = [];
    productos.forEach(p => {
        const div = document.createElement("div"); div.className="card";
        div.innerHTML = `<img src="${p.img}"><h3>${p.nombre}</h3><div class="precio">Bs ${p.precio}</div><button class="boton" onclick="agregar('${p.nombre}',${p.precio})">Agregar</button>`;
        document.getElementById(p.categoria).appendChild(div);
    });

    window.agregar = function(n, p) { carrito.push({nombre:n, precio:p}); actualizarCarrito(); };

    function actualizarCarrito() {
        let h = "", t = 0;
        carrito.forEach((item, i) => { t += item.precio; h += `${item.nombre} - Bs ${item.precio} <br>`; });
        document.getElementById("resumen").innerHTML = h || "Sin productos";
        document.getElementById("total").innerHTML = "Total: Bs " + t;
    }

    window.enviarPedido = function() {
        if(carrito.length === 0) return alert("Carrito vacío");
        const tipo = document.querySelector('input[name="tipoPedido"]:checked').value;
        const mesa = new URLSearchParams(window.location.search).get("mesa") || "General";
        const detalle = carrito.map(i => i.nombre).join("\n");
        const total = carrito.reduce((s, i) => s + i.precio, 0);

        // Graba en Excel
        fetch(URL_SCRIPT, { method: "POST", mode: "no-cors", body: JSON.stringify({ tipo, mesa, detalle, total }) });

        // WhatsApp
        const msg = `🍗 *PEDIDO GO POLLOS*\n*Mesa:* ${mesa}\n*Tipo:* ${tipo}\n\n${detalle}\n\n*Total:* Bs ${total}`;
        window.open("https://wa.me/59172685867?text=" + encodeURIComponent(msg), "_blank");
        carrito = []; actualizarCarrito();
    };
}
</script>
</body>
</html>
