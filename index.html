<style>
body{
 font-family: Arial, sans-serif;

.card{

 border-radius:10px;

.boton{
 background:#25D366;
 color:white;
 padding:8px;
 border:none;
 border-radius:8px;
 cursor:pointer;
 font-weight:bold;
}

.boton:disabled{
 background:gray;
 cursor:not-allowed;
}

.carrito{
 position:fixed;
 bottom:0;
 left:0;
 right:0;

 background:rgba(255,255,255,0.55);

 backdrop-filter:blur(6px);
 -webkit-backdrop-filter:blur(6px);

 border-top-left-radius:20px;
 border-top-right-radius:20px;

 border:1px solid rgba(255,255,255,0.35);

 box-shadow:0 -4px 15px rgba(0,0,0,0.25);

}

.total{ font-weight:bold; font-size:18px; }

.cocina-card{
 background:white;
 margin:15px;
 padding:15px;

 box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.estado-btn{
 margin-top:8px;
 background:#d50000;
 color:white;
 border:none;
 padding:6px 10px;
 border-radius:6px;
 cursor:pointer;
}

<body>

<div class="marquesina">
<span>Atencion : atencion
atencion : 
🚨​ POLLOS A LA LEÑA  >>> AGOTADO POR HOY - 😢​ 🔥🚚🍽️Go Pollos Rhosse pronto en una NUEVA UBICACIÓN🍗</span>
</div>

<div id="app"></div>

<script>

// ================= CONTROL DEL LOCAL =================
let cerradoManual = localStorage.getItem("cerradoManual") === "true";

const diasCerrados = [0];

const fechasCerrado = [
 "2026-12-25"
];

const params = new URLSearchParams(window.location.search);
const modo = params.get("modo");

// ================= HORARIO =================
const aperturaHora = 18;
const aperturaMin = 30;
const cierreHora = 22;
const cierreMin = 30;

const totalPollos = 6;
let pollosDisponibles =4;

// ================= MODO COCINA =================
if(modo === "cocina"){

document.getElementById("app").innerHTML = `
<header>
<img src="logo.png" class="logo">
<h1>🍗 PANTALLA COCINA</h1>
</header>
<div id="listaPedidos"></div>

<audio id="alerta" preload="auto">
<source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg">
</audio>
`;

let sonidoActivado=true;
let ultimoTotal=0;

function cargarPedidos(){
 let pedidos=JSON.parse(localStorage.getItem("pedidos"))||[];
 let html="";
 pedidos.forEach((p,i)=>{
   if(p.estado!=="Entregado"){
     html+=`
     <div class="cocina-card">
       <h3>Mesa ${p.mesa}</h3>
       <p>${p.detalle}</p>
       <strong>Total: Bs ${p.total}</strong><br>
       Estado: ${p.estado}<br>
       <button class="estado-btn" onclick="cambiarEstado(${i})">
       Cambiar Estado
       </button>
     </div>`;
   }
 });
 document.getElementById("listaPedidos").innerHTML=html;
}

function cambiarEstado(i){
 let pedidos=JSON.parse(localStorage.getItem("pedidos"))||[];
 let p=pedidos[i];

 if(p.estado==="Nuevo") p.estado="En preparación";
 else if(p.estado==="En preparación") p.estado="Listo";
 else p.estado="Entregado";

 pedidos[i]=p;
 localStorage.setItem("pedidos",JSON.stringify(pedidos));
 cargarPedidos();
}

setInterval(()=>{
 let pedidos=JSON.parse(localStorage.getItem("pedidos"))||[];
 if(pedidos.length>ultimoTotal){
   if(sonidoActivado) document.getElementById("alerta").play();
   ultimoTotal=pedidos.length;
 }
 cargarPedidos();
},1000);

}

// ================= MODO CLIENTE =================
else{

document.getElementById("app").innerHTML = `
<header>
<img src="logo.png" class="logo" id="logoLocal">
<h1>Pollos a la Leña<br>Go Pollos Rhosse</h1>
<p>Av. Moxos - Zona Mercado Pompeya<br> en Trinidad-Beni-Bolivia</p>

<div id="estadoLocal"></div>

<div id="contadorPollos"
style="background:#b30000;color:white;padding:15px;border-radius:12px;margin-top:15px;text-align:center;font-weight:bold;">
<div id="estadoLenia">🔥 Preparando la leña</div>
<div id="tiempoApertura">--:--:--</div>
</div>

<div style="background:white;padding:15px;border-radius:14px;margin-top:15px;">
<div style="background:#f5f5f5;border-radius:20px;overflow:hidden;height:20px;">
<div id="barraPollos" style="height:100%;width:100%;background:red;"></div>
</div>
<div id="textoEscasez"></div>
</div>

</header>

<div class="container">
<h2 class="categoria">🍗 Pollos a la leña</h2>
<div id="pollos" class="grid"></div>

<h2 class="categoria">🥤 Bebidas</h2>
<div id="bebidas" class="grid"></div>

<h2 class="categoria">🍔 Extras</h2>
<div id="extras" class="grid"></div>
</div>

<div class="carrito">
<div id="resumen">Sin productos</div>
<div class="total" id="total">Total: Bs 0</div>

<div style="margin:10px 0;">
<strong>Tipo de pedido:</strong><br>
<label><input type="radio" name="tipoPedido" value="Mesa" checked> 🍽 En mesa</label>
<label><input type="radio" name="tipoPedido" value="Recoger"> 🛍 Recoger</label><br>
<label><input type="radio" name="tipoPedido" value="Delivery"> 🚗 Delivery</label>
</div>

<button class="boton" onclick="enviarPedido()">Enviar pedido por WhatsApp</button>
</div>
`;

const productos=[

{categoria:"pollos", nombre:"Pollo Entero", precio:100, img:"entero.jpg"},
{categoria:"pollos", nombre:"Medio Pollo", precio:50, img:"medio.jpg"},
{categoria:"pollos", nombre:"Cuarto Pollo", precio:25, img:"cuarto.jpg"},
{categoria:"pollos", nombre:"Pollo Económico", precio:15, img:"menu.jpg"},

{categoria:"bebidas", nombre:"Gaseosa 2L", precio:13, img:"gaseosa2l.jpg"},
{categoria:"bebidas", nombre:"Gaseosa Personal", precio:6, img:"gaseosa.jpg"},

{categoria:"extras", nombre:"Extra Platano", precio:5, img:"extra_platano.jpg"},
{categoria:"extras", nombre:"Extra Papas", precio:5, img:"extra_papas.jpeg"},
{categoria:"extras", nombre:"Extra Arroz", precio:5, img:"extra_arroz.jpg"}

];

let carrito=[];

function crearProducto(p){
const div=document.createElement("div");
div.className="card";

div.innerHTML=`
<img src="${p.img}">
<h3>${p.nombre}</h3>
<div class="precio">Bs ${p.precio}</div>
<button class="boton" onclick="agregar('${p.nombre}',${p.precio})">Agregar</button>
`;

return div;
}

function cargarProductos(){
productos.forEach(p=>{
let cont=document.getElementById(p.categoria);
if(cont) cont.appendChild(crearProducto(p));
});
}

function agregar(nombre,precio){
carrito.push({nombre,precio});
actualizarCarrito();
}

function eliminarProducto(i){
carrito.splice(i,1);
actualizarCarrito();
}

function actualizarCarrito(){

let total=0;
let html="";

carrito.forEach((p,i)=>{
total+=p.precio;

html+=`
${p.nombre} Bs ${p.precio}
<button onclick="eliminarProducto(${i})">❌</button><br>
`;
});

document.getElementById("resumen").innerHTML=html||"Sin productos";
document.getElementById("total").innerHTML="Total: Bs "+total;
}
function localAbierto() {

if (cerradoManual) return false;

const ahora = new Date();
const dia = ahora.getDay();
const hora = ahora.getHours();
const min = ahora.getMinutes();
const fechaHoy = ahora.toISOString().split("T")[0];

if (diasCerrados.includes(dia)) return false;
if (fechasCerrado.includes(fechaHoy)) return false;

const tiempoActual = hora * 60 + min;
const tiempoApertura = aperturaHora * 60 + aperturaMin;
const tiempoCierre = cierreHora * 60 + cierreMin;

return (tiempoActual >= tiempoApertura && tiempoActual <= tiempoCierre);

}

function actualizarEstado(){

const estado=document.getElementById("estadoLocal");
const logo=document.getElementById("logoLocal");

if(!estado) return;

if(localAbierto()){
estado.innerHTML="🟢 Estamos atendiendo";
estado.style.color="lightgreen";
if(logo) logo.style.filter="none";
}
else{
estado.innerHTML="🔴 Cerrado";
estado.style.color="yellow";
if(logo) logo.style.filter="grayscale(100%)";
}

document.querySelectorAll(".boton").forEach(b=>{
b.disabled=!localAbierto();
});

}
function contadorLenia(){

const estado=document.getElementById("estadoLenia");
const tiempo=document.getElementById("tiempoApertura");

if(!estado || !tiempo) return;

const ahora=new Date();

let prender=new Date();
prender.setHours(16,0,0,0);

let abrir=new Date();
abrir.setHours(18,30,0,0);

let cerrar=new Date();
cerrar.setHours(22,30,0,0);

if(localAbierto()){
estado.innerHTML="🟢 Estamos atendiendo";
tiempo.innerHTML="🍗 Pollos saliendo de la leña";
return;
}

if(ahora >= cerrar){
estado.innerHTML="🔴 Restaurante cerrado";
tiempo.innerHTML="Abrimos mañana 🔥";
return;
}

if(ahora < prender){

let diff=prender-ahora;

let h=Math.floor(diff/3600000);
let m=Math.floor((diff%3600000)/60000);
let s=Math.floor((diff%60000)/1000);

estado.innerHTML="⏳ Prendemos la leña en";

tiempo.innerHTML=
String(h).padStart(2,"0")+":"+
String(m).padStart(2,"0")+":"+
String(s).padStart(2,"0");

return;
}

if(ahora >= prender && ahora < abrir){

let diff=abrir-ahora;

let h=Math.floor(diff/3600000);
let m=Math.floor((diff%3600000)/60000);
let s=Math.floor((diff%60000)/1000);

estado.innerHTML="🔥 Leña encendida";

tiempo.innerHTML=
"Abrimos en "+
String(h).padStart(2,"0")+":"+
String(m).padStart(2,"0")+":"+
String(s).padStart(2,"0");

return;
}

}
function enviarPedido(){

if(!localAbierto()){
alert("🔴 El restaurante está cerrado");
return;
}

if(carrito.length===0){
alert("Agrega al menos un producto");
return;
}

let tipoPedido=document.querySelector('input[name="tipoPedido"]:checked').value;

let texto="🍗 Pedido Go Pollos Rhosse\n\n";
texto+="Tipo: "+tipoPedido+"\n\n";

let total=0;

carrito.forEach(p=>{
texto+=p.nombre+" Bs "+p.precio+"\n";
total+=p.precio;
});

texto+="\nTotal Bs "+total;

 // window.open("https://wa.me/59168972863?text="+encodeURIComponent(texto)); //Wil
window.open("https://wa.me/59172685867?text="+encodeURIComponent(texto));

}

cargarProductos();
actualizarEstado();

setInterval(actualizarEstado,60000);
setInterval(contadorLenia,1000);

contadorLenia();

}

</script>
