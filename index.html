<style>
body{margin:0;font-family:Arial;background:#2b0b00;color:white}

<body>

<div class="marquesina" id="marquesina"></div>

<header>
<img src="logo.png" class="logo">
<h1>🍗 Go Pollos Rhosse</h1>
<div id="estado"></div>
</header>

<div class="container">
<h2>Menú</h2>
<div id="menu" class="grid"></div>
</div>

<div class="carrito">
<div id="carrito">Vacío</div>
<div id="total">Total Bs 0</div>

<hr>

<label><input type="radio" name="tipo" value="Mesa" checked> Mesa</label>
<label><input type="radio" name="tipo" value="Recoger"> Recoger</label>
<label><input type="radio" name="tipo" value="Delivery"> Delivery</label>

<div id="extra"></div>

<br>

<button onclick="enviar()">Enviar Pedido</button>
</div>

<script>
const WA="59172685867";
const diasCerrados=[0,6];
const HORARIO={apertura:16,cierre:22};

let pollosDisponibles=10;

const productos=[
{n:"Pollo Entero",p:100,img:"entero.jpg"},
{n:"Medio Pollo",p:50,img:"medio.jpg"},
{n:"Cuarto Pollo",p:25,img:"cuarto.jpg"}
];

let carrito=[];

function generarNumeroPedido(){
let hoy=new Date().toISOString().split("T")[0];
let data=JSON.parse(localStorage.getItem("pedido"))||{};
if(data.fecha!==hoy){data={fecha:hoy,num:1}}else{data.num++}
localStorage.setItem("pedido",JSON.stringify(data));
return String(data.num).padStart(3,"0");
}

function cargar(){
let c=document.getElementById("menu");
productos.forEach(p=>{
let d=document.createElement("div");
d.className="card";
d.innerHTML=`<img src="${p.img}"><h3>${p.n}</h3><p>Bs ${p.p}</p><button onclick="add('${p.n}',${p.p})">Agregar</button>`;
c.appendChild(d);
});
}

function add(n,p){
carrito.push({n,p});
if(n.includes("Pollo")) pollosDisponibles--;
render();
}

function render(){
let t=0,html="";
carrito.forEach((i,x)=>{t+=i.p;html+=`${i.n} Bs ${i.p}<button onclick="del(${x})">❌</button><br>`});
document.getElementById("carrito").innerHTML=html||"Vacío";
document.getElementById("total").innerHTML="Total Bs "+t;
}

function del(i){carrito.splice(i,1);render();}

function abierto(){
let d=new Date();
if(diasCerrados.includes(d.getDay())) return false;
let h=d.getHours();
return h>=HORARIO.apertura && h<=HORARIO.cierre;
}

function estado(){
document.getElementById("estado").innerHTML=abierto()?"🟢 Abierto":"🔴 Cerrado";
}

function marketing(){
let m=document.getElementById("marquesina");
if(diasCerrados.includes(new Date().getDay())){m.innerHTML="CERRADO SABADO Y DOMINGO";return;}
if(pollosDisponibles<=0){m.innerHTML="AGOTADO";return;}
m.innerHTML=abierto()?"PIDE YA TU POLLO A LA LEÑA":"Abrimos 16:00";
}

document.querySelectorAll("input[name='tipo']").forEach(r=>{
r.addEventListener("change",()=>{
let t=r.value;
let d=document.getElementById("extra");
if(t==="Delivery") d.innerHTML=`<input id="dir" placeholder="Dirección"><input id="tel" placeholder="Teléfono">`;
else if(t==="Mesa") d.innerHTML=`<input id="mesa" placeholder="Mesa">`;
else d.innerHTML="";
});
});

function enviar(){
if(!abierto()) return alert("Cerrado");
if(carrito.length===0) return alert("Agrega productos");

let num=generarNumeroPedido();
let tipo=document.querySelector("input[name='tipo']:checked").value;

let txt="Pedido #"+num+"\n\nTipo:"+tipo+"\n";

if(tipo==="Delivery"){
txt+="Dir:"+document.getElementById("dir").value+"\nTel:"+document.getElementById("tel").value+"\n";
}

if(tipo==="Mesa"){
txt+="Mesa:"+document.getElementById("mesa").value+"\n";
}

let total=0;
carrito.forEach(i=>{txt+=i.n+" "+i.p+"\n";total+=i.p});
txt+="Total "+total;

window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(txt));

carrito=[];
render();
}

cargar();
setInterval(()=>{estado();marketing();},3000);
</script>
