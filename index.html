<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:image" content="https://jwilsoncruz.github.io/gopollosrhosse/Preview.jpg">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <title>Pollos a la leña - Go Pollos Rhosse - Trinidad, Bolivia</title>
    <style>
        body{ font-family: Arial, sans-serif; margin:0; background:#610000; padding-bottom:240px; }
        header{ text-align:center; padding:40px 20px; background:#d50000; color:white; }
        .logo{ max-width:200px; display:block; margin:0 auto 15px auto; }
        .container{ padding:20px; }
        .categoria{ margin-top:35px; font-size:22px; color:#d50000; }
        .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:15px; }
        .card{ background:white; padding:15px; border-radius:14px; text-align:center; }
        .card img{ width:100%; height:120px; object-fit:cover; border-radius:10px; }
        .precio{ font-weight:bold; margin:8px 0; }
        .boton{ background:#25D366; color:white; padding:8px; border:none; border-radius:8px; cursor:pointer; font-weight:bold; }
        .carrito{ position:fixed; bottom:0; left:0; right:0; background:white; padding:15px; box-shadow:0 -3px 10px rgba(0,0,0,0.1); }
        .total{ font-weight:bold; font-size:18px; }
        .redes{ margin-top:40px; text-align:center; }
        .social-btn{ display:block; margin:10px auto; padding:12px; width:220px; border-radius:10px; text-decoration:none; color:white; }
        .facebook{ background:#1877F2; } .tiktok{ background:#000; } .youtube{ background:#c4302b; }
    </style>
</head>
<body>
<div id="app"></div>

<script>
const params = new URLSearchParams(window.location.search);
const modo = params.get("modo");
const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxXnNPSV2OTURsEO94cg3HwKjzFMIUJcytuyXyuWsKJ7VJOy80kSHneT6W9sGyEOpDRoQ/exec";

// CONFIG
const aperturaHora = 18, aperturaMin = 30, cierreHora = 22, cierreMin = 30;
let pollosDisponibles = 5, totalPollos = 8;
const diasCerrados =, cierreManual = false;

if(modo === "cocina"){
    document.getElementById("app").innerHTML = `
        <header><img src="logo.png" class="logo"><h1>🍗 PANTALLA COCINA</h1></header>
        <div style="text-align:center;padding:20px;"><button onclick="activarSonido()" style="padding:15px;background:#d50000;color:white;border:none;border-radius:10px;">🔔 Activar sonido</button></div>
        <div id="listaPedidos"></div>
        <audio id="alerta" preload="auto"><source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" type="audio/ogg"></audio>
    `;

    let sonidoActivado = false, ultimoPedidoDetectado = null;
    window.activarSonido = () => { sonidoActivado = true; alert("Sonido OK 🔔"); };

    window.cargarPedidos = () => {
        fetch(URL_SCRIPT).then(res => res.json()).then(pedidos => {
            if(!pedidos) return;
            let contenedor = document.getElementById("listaPedidos");
            contenedor.innerHTML = "";
            
            const reciente = pedidos[pedidos.length - 1];
            if(sonidoActivado && reciente && ultimoPedidoDetectado !== reciente.fecha){
                document.getElementById("alerta").play().catch(()=>{});
                ultimoPedidoDetectado = reciente.fecha;
            }

            pedidos.reverse().forEach(p => {
                if(p.estado === "Listo") return;
                let color = (p.tipo === "Delivery") ? "#ffe5e5" : (p.tipo === "Mesa" ? "#e5f0ff" : "#e5ffe5");
                contenedor.innerHTML += `
                    <div style="background:${color}; padding:15px; margin:10px; border-radius:8px; border-left:10px solid #d50000;">
                        <strong>${p.tipo} - Mesa: ${p.mesa}</strong><br>
                        <p>${p.detalle.replace(/\n/g, "<br>")}</p>
                        <button onclick="cambiarEstado('${p.fecha}','${p.detalle.replace(/'/g, "\\'")}')" style="background:#25D366; color:white; border:none; padding:10px; width:100%; border-radius:8px; cursor:pointer; font-weight:bold;">✅ MARCAR LISTO</button>
                    </div>`;
            });
        }).catch(e => console.error(e));
    };

    window.cambiarEstado = (fecha, detalle) => {
        fetch(URL_SCRIPT, { method: "POST", body: JSON.stringify({ actualizar: true, fecha: fecha, detalle: detalle }) })
        .then(() => cargarPedidos());
    };

    setInterval(cargarPedidos, 5000);
    cargarPedidos();

} else {
    // MODO CLIENTE
    document.getElementById("app").innerHTML = `
        <header>
            <img src="logo.png" class="logo">
            <h1>Go Pollos Rhosse</h1>
            <div id="estadoLocal"></div>
        </header>
        <div class="container">
            <div id="pollos" class="grid"></div>
            <h2 class="categoria">🥤 Bebidas</h2><div id="bebidas" class="grid"></div>
            <h2 class="categoria">🍔 Extras</h2><div id="extras" class="grid"></div>
        </div>
        <div class="carrito">
            <div id="resumen">Sin productos</div>
            <div class="total" id="total">Total: Bs 0</div>
            <div style="margin:5px 0;">
                <input type="radio" name="tipo" value="Mesa" checked> Mesa
                <input type="radio" name="tipo" value="Recoger"> Recoger
                <input type="radio" name="tipo" value="Delivery"> Delivery
            </div>
            <button class="boton" onclick="enviarPedido()" style="width:100%">Enviar Pedido</button>
        </div>
    `;

    const productos=[
        {categoria:"pollos", nombre:"Cuarto Pollo", precio:25, img:"medio.jpg"},
        {categoria:"pollos", nombre:"Pollo Entero", precio:100, img:"entero.jpg"},
        {categoria:"bebidas", nombre:"Gaseosa 2L", precio:12, img:"gaseosa2l.jpg"},
        {categoria:"extras", nombre:"Extra Papas", precio:5, img:"extra_papas.jpeg"}
    ];

    let carrito = [];
    window.agregar = (nombre, precio) => { carrito.push({nombre, precio}); actualizarCarrito(); };
    
    window.actualizarCarrito = () => {
        let resumen = "", total = 0;
        carrito.forEach((item, i) => { 
            resumen += `${item.nombre} <button onclick="carrito.splice(${i},1);actualizarCarrito()">x</button><br>`;
            total += item.precio;
        });
        document.getElementById("resumen").innerHTML = resumen || "Sin productos";
        document.getElementById("total").innerHTML = "Total: Bs " + total;
    };

    window.enviarPedido = () => {
        if(!carrito.length) return alert("Carrito vacío");
        let tipo = document.querySelector('input[name="tipo"]:checked').value;
        let detalle = carrito.map(i => i.nombre).join("\n");
        let total = carrito.reduce((a, b) => a + b.precio, 0);
        let fecha = new Date().toISOString();

        fetch(URL_SCRIPT, {
            method: "POST",
            body: JSON.stringify({ fecha, tipo, mesa: "Mesa", detalle, total })
        });

        window.open(`https://wa.me/59168972863?text=${encodeURIComponent("Pedido: "+tipo+"\n"+detalle+"\nTotal: "+total)}`);
        carrito = []; actualizarCarrito();
    };

    productos.forEach(p => {
        let d = document.createElement("div"); d.className="card";
        d.innerHTML = `<img src="${p.img}"><h3>${p.nombre}</h3><p>Bs ${p.precio}</p><button class="boton" onclick="agregar('${p.nombre}',${p.precio})">Agregar</button>`;
        document.getElementById(p.categoria).appendChild(d);
    });
}
</script>
</body>
</html>
