<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Pollos Rhosse</title>

<style>
body{
 font-family: Arial;
 margin:0;
 background:#610000;
 padding-bottom:200px;
}

header{
 position:sticky;
 top:0;
 background:#d50000;
 color:white;
 text-align:center;
 padding:25px;
 transition:0.3s;
}

header.compacto{
 padding:10px;
}

.logo{
 max-width:120px;
 transition:0.3s;
}

header.compacto .logo{
 max-width:70px;
}

.container{
 padding:20px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
 gap:15px;
}

.card{
 background:white;
 padding:15px;
 border-radius:12px;
 text-align:center;
}

.card img{
 width:100%;
 height:120px;
 object-fit:cover;
 border-radius:10px;
}

.boton{
 background:#25D366;
 color:white;
 border:none;
 padding:8px;
 border-radius:6px;
 cursor:pointer;
 font-weight:bold;
}

.carrito{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:white;
 padding:15px;
}
</style>
</head>

<body>

<header>
<img src="logo.png" class="logo">
<h2>🍗 Go Pollos Rhosse</h2>
</header>

<div class="container">
<h3>🍗 Pollos</h3>
<div id="pollos" class="grid"></div>

<h3>🥤 Bebidas</h3>
<div id="bebidas" class="grid"></div>

<h3>🍔 Extras</h3>
<div id="extras" class="grid"></div>
</div>

<div class="carrito">
<div id="resumen">Sin productos</div>
<div id="total">Total: Bs 0</div>
</div>

<script>

const productos=[
{categoria:"pollos", nombre:"Cuarto Pollo", precio:25, img:"menu.jpg"},
{categoria:"pollos", nombre:"Medio Pollo", precio:50, img:"medio.jpg"},
{categoria:"bebidas", nombre:"Gaseosa", precio:6, img:"gaseosa.jpg"},
{categoria:"extras", nombre:"Hamburguesa", precio:15, img:"hamburguesa.jpg"}
];

let carrito=[];

function crearProducto(p){
 const div=document.createElement("div");
 div.className="card";
 div.innerHTML=`
 <img src="${p.img}">
 <h4>${p.nombre}</h4>
 <p>Bs ${p.precio}</p>
 <button class="boton" onclick="agregar('${p.nombre}',${p.precio})">
 Agregar
 </button>
 `;
 return div;
}

function cargar(){
 productos.forEach(p=>{
  const cont=document.getElementById(p.categoria);
  cont.appendChild(crearProducto(p));
 });
}

function agregar(nombre,precio){
 carrito.push({nombre,precio});
 actualizar();
}

function actualizar(){
 let html="";
 let total=0;
 carrito.forEach(i=>{
  total+=i.precio;
  html+=i.nombre+" - Bs "+i.precio+"<br>";
 });
 document.getElementById("resumen").innerHTML=html || "Sin productos";
 document.getElementById("total").innerHTML="Total: Bs "+total;
}

cargar();

window.addEventListener("scroll", function(){
 const header=document.querySelector("header");
 if(window.scrollY>50){
  header.classList.add("compacto");
 }else{
  header.classList.remove("compacto");
 }
});

</script>

</body>
</html>
