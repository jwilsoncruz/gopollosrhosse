<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Pollos Rhosse - Trinidad</title>

<style>
body{margin:0;font-family:Arial;background:#610000;color:white}
header{background:#d50000;padding:30px;text-align:center}
.container{padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px}
.card{background:white;color:black;padding:15px;border-radius:10px;text-align:center}
.card img{width:100%;height:120px;object-fit:cover;border-radius:8px}
.boton{background:#25D366;color:white;border:none;padding:8px;border-radius:8px;cursor:pointer;font-weight:bold}
.carrito{position:fixed;bottom:0;left:0;right:0;background:white;color:black;padding:15px}
.cocina-card{background:white;color:black;margin:10px;padding:15px;border-radius:10px}
</style>
</head>

<body>
<div id="app"></div>

<script>
const WEBAPP="https://script.google.com/macros/s/AKfycbxXnNPSV2OTURsEO94cg3HwKjzFMIUJcytuyXyuWsKJ7VJOy80kSHneT6W9sGyEOpDRoQ/exec";
const modo=new URLSearchParams(window.location.search).get("modo");

if(modo==="cocina"){renderCocina()}else{renderCliente()}

// ================= CLIENTE =================

function renderCliente(){
document.getElementById("app").innerHTML=`
<header>
<h1>🍗 Go Pollos Rhosse</h1>
<p>Av. Moxos - Mercado Pompeya</p>
</header>

<div class="container">
<h2>🍗 Pollos</h2>
<div class="grid" id="productos"></div>

<h2 style="margin-top:40px;">📍 Ubicación</h2>
<div style="position:relative;padding-bottom:56.25%;height:0;">
<iframe src="https://www.google.com/maps/embed?pb=!1m18!..."
style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" loading="lazy"></iframe>
</div>
</div>

<div class="carrito">
<div id="resumen">Sin productos</div>
<div id="total">Total: Bs 0</div>
<button class="boton" onclick="enviarPedido()">Enviar pedido</button>
</div>
`;

const productos=[
{nombre:"Pollo Económico",precio:15,img:"menu.jpg"},
{nombre:"Cuarto Pollo",precio:25,img:"medio.jpg"},
{nombre:"Medio Pollo",precio:50,img:"cuarto.jpg"},
{nombre:"Pollo Entero",precio:100,img:"entero.jpg"},
{nombre:"Gaseosa 2L",precio:12,img:"gaseosa2l.jpg"},
{nombre:"Extra Papas",precio:5,img:"extra_papas.jpeg"}
];

let carrito=[];

productos.forEach(p=>{
document.getElementById("productos").innerHTML+=`
<div class="card">
<img src="${p.img}">
<h3>${p.nombre}</h3>
<p>Bs ${p.precio}</p>
<button class="boton" onclick='agregar("${p.nombre}",${p.precio})'>Agregar</button>
</div>
`
});

window.agregar=function(nombre,precio){
carrito.push({nombre,precio});
actualizar();
}

function actualizar(){
let html="";let total=0;
carrito.forEach(p=>{html+=p.nombre+" Bs "+p.precio+"<br>";total+=p.precio});
document.getElementById("resumen").innerHTML=html||"Sin productos";
document.getElementById("total").innerHTML="Total: Bs "+total;
}

window.enviarPedido=function(){
if(carrito.length===0){alert("Agrega algo");return}
let detalle="";let total=0;
carrito.forEach(p=>{detalle+=p.nombre+" Bs "+p.precio+"\n";total+=p.precio});

fetch(WEBAPP,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
tipo:"Web",
mesa:"No aplica",
detalle:detalle,
total:total
})
});

window.open("https://wa.me/59168972863?text="+encodeURIComponent(detalle)," _blank");
carrito=[];actualizar();
}
}

// ================= COCINA =================

function renderCocina(){
document.getElementById("app").innerHTML=`
<h1 style="text-align:center">PANTALLA COCINA</h1>
<div id="lista"></div>
`;

function cargar(){
fetch(WEBAPP)
.then(r=>r.json())
.then(data=>{
let html="";
data.reverse().forEach(p=>{
html+=`
<div style="background:white;color:black;margin:10px;padding:10px;border-radius:8px">
<b>${p.tipo}</b><br>
<pre>${p.detalle}</pre>
Total: Bs ${p.total}<br>
Estado: ${p.estado}
</div>
`;
});
document.getElementById("lista").innerHTML=html;
});
}

setInterval(cargar,3000);
cargar();
}

window.cambiar=function(fecha,detalle){
fetch(WEBAPP,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({actualizar:true,fecha:fecha,detalle:detalle})
}).then(()=>cargar());
}

setInterval(cargar,3000);
cargar();
}
</script>
</body>
</html>
