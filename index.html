function crearProducto(prod){
 const div=document.createElement("div");
 div.className="card";

 let botonHTML="";

 if(prod.promo){
   botonHTML=`<button class="boton" id="btnPromo"
   onclick="agregarPromo('${prod.nombre}',${prod.precio})">
   Agregar

 }
 else{
   botonHTML=`<button class="boton"
   onclick="agregar('${prod.nombre}',${prod.precio})">
   Agregar
   </button>`;
 }

 div.innerHTML=`
 <img src="${prod.img}">
 <h3>${prod.nombre}</h3>
 <div class="precio">Bs ${prod.precio}</div>
 ${botonHTML}
 `;
 return div;
}

function cargarProductos(){
 productos.forEach(p=>{

   .appendChild(crearProducto(p));
 });
}

function agregar(nombre,precio){
 carrito.push({nombre,precio});
 actualizarCarrito();
}

function agregarPromo(nombre,precio){
 if(pollosDisponibles<=0) return;
 carrito.push({nombre,precio});
 pollosDisponibles--;
 actualizarCarrito();
 actualizarEscasez();
}

function actualizarCarrito(){
  let resumenHTML="";
  let total=0;

  carrito.forEach((item,index)=>{
    total+=item.precio;
    resumenHTML+=`
      ${item.nombre} - Bs ${item.precio}
      <button onclick="eliminarProducto(${index})"
      style="background:red;color:white;border:none;border-radius:5px;padding:2px 6px;margin-left:5px;cursor:pointer;">
      ✖
      </button>
      <br>
    `;
  });

  document.getElementById("resumen").innerHTML=resumenHTML||"Sin productos";
  document.getElementById("total").innerHTML="Total: Bs "+total;
}

  let detalle="";
  let total=0;

  carrito.forEach(item=>{
    detalle += item.nombre + " - Bs " + item.precio + "\n";

// cambiar telefono whatsapp

function eliminarProducto(index){
  if(carrito[index].nombre.includes("Promo")){
    pollosDisponibles++;
    actualizarEscasez();
  }
  carrito.splice(index,1);
  actualizarCarrito();
}

function actualizarEscasez(){
 const barra=document.getElementById("barraPollos");
 const texto=document.getElementById("textoEscasez");
 const btn=document.getElementById("btnPromo");

 if(!barra || !texto) return; // 🔥 evita que rompa

 let porcentaje=(pollosDisponibles/totalPollos)*100;
 barra.style.width=porcentaje+"%";

 if(pollosDisponibles>2){
   texto.innerHTML="🔥 Disponibles: "+pollosDisponibles+" de "+totalPollos;
 }
 else if(pollosDisponibles>0){
   texto.innerHTML="⚠️ ¡ÚLTIMOS "+pollosDisponibles+" POLLOS!";
   barra.style.background="orange";
 }
 else{
   texto.innerHTML="❌ POLLOS AGOTADOS";
   barra.style.background="gray";
   if(btn){btn.disabled=true;btn.innerText="Agotado";}
 }
}

function actualizarEstado(){
 const estado=document.getElementById("estadoLocal");
 const banner=document.getElementById("bannerCerrado");
 if(!estado) return;

 const ahora=new Date();
 const dia=ahora.getDay();
 const hora=ahora.getHours();
 const min=ahora.getMinutes();

 // 🔴 CIERRE MANUAL
 if(cierreManual){
   estado.innerHTML="🔴 Hoy no estamos atendiendo";
   estado.style.color="red";

   if(banner){
     banner.style.display="block";
     banner.innerHTML="🚫 HOY NO HAY ATENCIÓN — Volvemos mañana desde 18:30 🍗";
   }

   return;
 }

 // 🔴 DÍA CERRADO
 if(diasCerrados.includes(dia)){
   estado.innerHTML="🔴 Hoy no hay atención";
   estado.style.color="red";

   if(banner){
     banner.style.display="block";
     banner.innerHTML="🚫 HOY NO ATENDEMOS — Te esperamos mañana desde 18:30 🔥";
   }

   return;
 }

 const abierto=
 ((hora>aperturaHora||(hora===aperturaHora&&min>=aperturaMin))&&
 (hora<cierreHora||(hora===cierreHora&&min<=cierreMin)));

 if(abierto){
   estado.innerHTML="🟢 Estamos ATENDIENDO hasta 10:30 PM";
   estado.style.color="green";

   if(banner){
     banner.style.display="none";
   }
 }
 else{
   estado.innerHTML="🔴 Cerrado — Atendemos de 18:30 a 22:30";
   estado.style.color="red";

   if(banner){
     banner.style.display="block";
     banner.innerHTML="⏰ Estamos cerrados ahora — Abrimos a las 18:30 🍗";
   }
 }
}
