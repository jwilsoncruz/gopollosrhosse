<body>

<div id="app"></div>

<script>
const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxXnNPSV2OTURsEO94cg3HwKjzFMIUJcytuyXyuWsKJ7VJOy80kSHneT6W9sGyEOpDRoQ/exec";
const params = new URLSearchParams(window.location.search);
const modo = params.get("modo");

// VARIABLES DE ESTADO
let carrito = [];
let pollosDisponibles = 5; 
let totalPollos = 8;
let sonidoActivado = false;
let ultimoPedidoId = null;

// ================== FUNCIONES COMPARTIDAS / GLOBALES ==================

// 1. ELIMINAR DEL CARRITO (ARREGLADO)
window.quitarDelCarrito = (index) => {
    if(carrito[index].nombre.includes("Promo")) {
        pollosDisponibles++;
        if(window.actualizarEscasez) window.actualizarEscasez();
    }
    carrito.splice(index, 1);
    window.renderCarrito();
};

// 2. ACTUALIZAR VISTA DEL CARRITO
window.renderCarrito = () => {
    const res = document.getElementById("resumen");
    const tot = document.getElementById("totalDisplay");
    if(!res) return;
    
    let html = "";
    let suma = 0;
    carrito.forEach((prod, i) => {
        suma += prod.precio;
        html += `<div>${prod.nombre} - Bs ${prod.precio} <button class="btn-eliminar" onclick="window.quitarDelCarrito(${i})">✖</button></div>`;
    });
    
    res.innerHTML = html || "Sin productos";
    if(tot) tot.innerHTML = "Total: Bs " + suma;
};

// 3. ENVIAR PEDIDO

    if(carrito.length === 0) return alert("El carrito está vacío");
