<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Pollos Rhosse</title>

<style>
body{font-family:Arial;margin:0;background:#2b0b00;color:white;}
header{text-align:center;padding:20px;}
.logo{max-width:150px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:10px;}
.card{background:white;color:black;padding:10px;border-radius:10px;text-align:center;}
.boton{background:#ff6f00;color:white;border:none;padding:8px;border-radius:8px;}
.boton:disabled{background:gray;}
.carrito{position:fixed;bottom:0;width:100%;background:#eee;color:black;padding:10px;}
.marquesina{background:#ffca28;color:black;padding:10px;text-align:center;font-weight:bold;}
</style>
</head>

<body>

<div class="marquesina" id="textoMarquesina">Cargando...</div>

<header>
<img src="logobo.png" class="logo">
<h2>🍗 Go Pollos Rhosse</h2>
<div id="estadoLocal"></div>
<div id="stock"></div>
</header>

<div class="grid" id="productos"></div>

<div class="carrito">
<div id="resumen">Vacío</div>
<div id="total">Bs 0</div>
<button onclick="enviarPedido()" class="boton">Enviar WhatsApp</button>
</div>

<script>

// ================= CONFIG =================
const API_CONFIG = "https://script.google.com/macros/s/AKfycbzhqgkwkpOllpKHJBf3YtOqYZZTT3briZyP3sj8NI4QpE-9a5hxvPAm9BmtU7WMtM3ghA/exec";

let pollosDisponibles = 0;
let abierto = true;
let carrito = [];

// ================= PRODUCTOS =================
const productos = [
{nombre:"Pollo Entero",precio:100},
{nombre:"Medio Pollo",precio:50},
{nombre:"Cuarto Pollo",precio:25}
];

// ================= UI =================
function renderProductos(){
const cont = document.getElementById("productos");
cont.innerHTML = "";
productos.forEach(p=>{
cont.innerHTML += `
<div class="card">
<h3>${p.nombre}</h3>
<p>Bs ${p.precio}</p>
<button class="boton" onclick="agregar('${p.nombre}',${p.precio})">Agregar</button>
</div>`;
});
}

function agregar(nombre,precio){
if(!abierto) return alert("Cerrado");
if(nombre.includes("Pollo") && pollosDisponibles<=0) return alert("Agotado");

carrito.push({nombre,precio});

if(nombre.includes("Pollo")){
pollosDisponibles--;
}

actualizarCarrito();
actualizarUI();
}

function actualizarCarrito(){
let total=0,html="";
carrito.forEach(p=>{
total+=p.precio;
html+=p.nombre+" Bs "+p.precio+"<br>";
});
document.getElementById("resumen").innerHTML = html||"Vacío";
document.getElementById("total").innerHTML = "Total Bs "+total;
}

// ================= GOOGLE SHEETS =================
async function cargarConfig(){
try{
const res = await fetch(API_CONFIG);
const data = await res.json();

// 🔧 mantenimiento
if(data.mantenimiento==="si"){
document.body.innerHTML = `<h1 style="text-align:center">🔧 Mantenimiento</h1><p style="text-align:center">${data.mensaje}</p>`;
return;
}

// estado
abierto = data.estado === "abierto";
document.getElementById("estadoLocal").innerHTML = abierto ? "🟢 Abierto" : "🔴 Cerrado";

// pollos
pollosDisponibles = parseInt(data.pollos)||0;

// mensaje
document.getElementById("textoMarquesina").innerHTML = data.mensaje || "";

// UI
actualizarUI();

}catch(e){
console.log("Error Sheets",e);
}
}

// ================= UI ESTADO =================
function actualizarUI(){
document.getElementById("stock").innerHTML = "🍗 Disponibles: "+pollosDisponibles;

document.querySelectorAll(".boton").forEach(b=>{
if(b.innerText==="Agregar"){
b.disabled = !abierto || pollosDisponibles<=0;
}
});
}

// ================= PEDIDO =================
function enviarPedido(){
if(carrito.length===0) return alert("Vacío");

let texto="🍗 Pedido:\n";
let total=0;

carrito.forEach(p=>{
texto+=p.nombre+" Bs "+p.precio+"\n";
total+=p.precio;
});

texto+="Total Bs "+total;

window.open("https://wa.me/59172685867?text="+encodeURIComponent(texto));

carrito=[];
actualizarCarrito();
}

// ================= INIT =================
renderProductos();
setInterval(cargarConfig,5000);
cargarConfig();

</script>

</body>
</html>
