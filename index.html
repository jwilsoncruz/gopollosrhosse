<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pollos a la leña - Go Pollos Rhosse - Trinidad, Beni, Bolivia</title>
<link rel="icon" href="favicon.ico">

<style>
body{
 font-family: Arial, sans-serif;
 margin:0;
 background:#610000;
 padding-bottom:240px;
}

header{
 text-align:center;
 padding:40px 20px;
 background:#d50000;
 color:white;
}

.logo{
 max-width:200px;
 display:block;
 margin:0 auto 15px auto;
}

.container{ padding:20px; }

.categoria{
 margin-top:35px;
 font-size:22px;
 color:#ffd401;
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
 gap:15px;
}

.card{
 background:white;
 padding:15px;
 border-radius:14px;
 box-shadow:0 6px 16px rgba(0,0,0,0.08);
 text-align:center;
}

.card img{
 width:100%;
 height:120px;
 object-fit:cover;
 border-radius:10px;
}

.precio{ font-weight:bold; margin:8px 0; }

.boton{
 background:#25D366;
 color:white;
 padding:8px;
 border:none;
 border-radius:8px;
 cursor:pointer;
 font-weight:bold;
}

.boton:disabled{
 background:gray;
 cursor:not-allowed;
}

.carrito{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:white;
 box-shadow:0 -3px 10px rgba(0,0,0,0.1);
 padding:15px;
}

.total{ font-weight:bold; font-size:18px; }

.cocina-card{
 background:white;
 margin:15px;
 padding:15px;
 border-left:6px solid #d50000;
 border-radius:10px;
 box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.estado-btn{
 margin-top:8px;
 background:#d50000;
 color:white;
 border:none;
 padding:6px 10px;
 border-radius:6px;
 cursor:pointer;
}
</style>
</head>

<body>

<div id="app"></div>

<script>

// ================= CONTROL LOCAL =================

let cerradoManual = localStorage.getItem("cerradoManual") === "true";
const diasCerrados = [1];

const params = new URLSearchParams(window.location.search);
const modo = params.get("modo");

const aperturaHora = 19;
const aperturaMin = 0;
const cierreHora = 22;
const cierreMin = 45;

const totalPollos = 24;
let pollosDisponibles = 22;


// ================= MODO COCINA =================

if(modo === "cocina"){

document.getElementById("app").innerHTML=`
<header>
<img src="logo.png" class="logo">
<h1>🍗 PANTALLA COCINA</h1>
</header>

<div id="listaPedidos"></div>

<audio id="alerta">
<source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg">
</audio>
`;

let ultimoTotal=0;

function cargarPedidos(){

let pedidos=JSON.parse(localStorage.getItem("pedidos"))||[];
let html="";

pedidos.forEach((p,i)=>{
 if(p.estado!=="Entregado"){
 html+=`
 <div class="cocina-card">
 <h3>Mesa ${p.mesa}</h3>
 <p>${p.detalle}</p>
 <strong>Total: Bs ${p.total}</strong><br>
 Estado: ${p.estado}<br>
 <button class="estado-btn" onclick="cambiarEstado(${i})">
 Cambiar Estado
 </button>
 </div>
 `;
 }
});

document.getElementById("listaPedidos").innerHTML=html;

}

function cambiarEstado(i){

let pedidos=JSON.parse(localStorage.getItem("pedidos"))||[];

let p=pedidos[i];

if(p.estado==="Nuevo") p.estado="En preparación";
else if(p.estado==="En preparación") p.estado="Listo";
else p.estado="Entregado";

pedidos[i]=p;

localStorage.setItem("pedidos",JSON.stringify(pedidos));

cargarPedidos();

}

setInterval(()=>{

let pedidos=JSON.parse(localStorage.getItem("pedidos"))||[];

if(pedidos.length>ultimoTotal){
document.getElementById("alerta").play();
ultimoTotal=pedidos.length;
}

cargarPedidos();

},1000);

}


// ================= MODO CLIENTE =================

else{

document.getElementById("app").innerHTML=`

<header>

<img src="logo.png" class="logo">

<h1>
Pollos a la Leña<br>
Go Pollos Rhosse<br>
Trinidad Beni Bolivia
</h1>

<div id="estadoLocal"></div>

<div id="estadoLenia">🔥 Preparando la leña</div>

<div id="tiempoApertura">00:00:00</div>

</header>

<div class="container">

<h2 class="categoria">🍗 Pollos</h2>
<div id="pollos" class="grid"></div>

<h2 class="categoria">🥤 Bebidas</h2>
<div id="bebidas" class="grid"></div>

<h2 class="categoria">🍟 Extras</h2>
<div id="extras" class="grid"></div>

</div>

<div class="carrito">

<div id="resumen">Sin productos</div>

<div class="total" id="total">
Total: Bs 0
</div>

<button class="boton" onclick="enviarPedido()">
Enviar pedido por WhatsApp
</button>

</div>
`;


// ================= PRODUCTOS =================

const productos=[

{categoria:"pollos",nombre:"Pollo Entero",precio:100,img:"entero.jpg"},
{categoria:"pollos",nombre:"Medio Pollo",precio:50,img:"medio.jpg"},
{categoria:"pollos",nombre:"Cuarto Pollo",precio:25,img:"cuarto.jpg"},

{categoria:"bebidas",nombre:"Gaseosa 2L",precio:13,img:"gaseosa2l.jpg"},
{categoria:"bebidas",nombre:"Gaseosa Personal",precio:6,img:"gaseosa.jpg"},

{categoria:"extras",nombre:"Extra Papas",precio:5,img:"extra_papas.jpeg"},
{categoria:"extras",nombre:"Extra Arroz",precio:5,img:"extra_arroz.jpg"}

];


let carrito=[];


// ================= CREAR PRODUCTOS =================

function crearProducto(prod){

const div=document.createElement("div");

div.className="card";

div.innerHTML=`

<img src="${prod.img}">

<h3>${prod.nombre}</h3>

<div class="precio">
Bs ${prod.precio}
</div>

<button class="boton"
onclick="agregar('${prod.nombre}',${prod.precio})">
Agregar
</button>

`;

return div;

}

function cargarProductos(){

productos.forEach(p=>{

document.getElementById(p.categoria)
.appendChild(crearProducto(p));

});

}


// ================= CARRITO =================

function agregar(nombre,precio){

carrito.push({nombre,precio});

actualizarCarrito();

}

function actualizarCarrito(){

let resumenHTML="";
let total=0;

carrito.forEach((item,index)=>{

total+=item.precio;

resumenHTML+=`
${item.nombre} - Bs ${item.precio}
<button onclick="eliminarProducto(${index})">✖</button>
<br>
`;

});

document.getElementById("resumen").innerHTML=resumenHTML||"Sin productos";

document.getElementById("total").innerHTML="Total: Bs "+total;

}

function eliminarProducto(i){

carrito.splice(i,1);

actualizarCarrito();

}


// ================= ESTADO LOCAL =================

function localAbierto(){

if(cerradoManual) return false;

const ahora=new Date();

const dia=ahora.getDay();

const hora=ahora.getHours();

const min=ahora.getMinutes();

if(diasCerrados.includes(dia)) return false;

return (

(hora>aperturaHora||(hora===aperturaHora&&min>=aperturaMin))
&&
(hora<cierreHora||(hora===cierreHora&&min<=cierreMin))

);

}


function actualizarEstado(){

const estado=document.getElementById("estadoLocal");

if(!estado) return;

if(localAbierto()){

estado.innerHTML="🟢 Estamos ABIERTOS";

estado.style.color="lime";

}
else{

estado.innerHTML="🔴 Restaurante cerrado";

estado.style.color="white";

}

document.querySelectorAll(".boton").forEach(b=>{

b.disabled=!localAbierto();

});

}


// ================= CONTADOR LEÑA =================

function contadorLenia(){

const estado=document.getElementById("estadoLenia");

const tiempo=document.getElementById("tiempoApertura");

if(!estado) return;

const ahora=new Date();

let prender=new Date();
prender.setHours(16,0,0);

let abrir=new Date();
abrir.setHours(19,0,0);

if(ahora>=abrir){

estado.innerHTML="🟢 Estamos atendiendo";

tiempo.innerHTML="🍗 Pollos saliendo de la leña";

return;

}

if(ahora>=prender){

estado.innerHTML="🔥 Leña encendida";

let diff=abrir-ahora;

let m=Math.floor(diff/60000);
let s=Math.floor((diff%60000)/1000);

tiempo.innerHTML=m+"m "+s+"s";

return;

}

let diff=prender-ahora;

let h=Math.floor(diff/3600000);
let m=Math.floor((diff%3600000)/60000);
let s=Math.floor((diff%60000)/1000);

tiempo.innerHTML=
String(h).padStart(2,"0")+":"+
String(m).padStart(2,"0")+":"+
String(s).padStart(2,"0");

}


// ================= ENVIAR PEDIDO =================

function enviarPedido(){

if(!localAbierto()){
alert("El restaurante está cerrado");
return;
}

if(carrito.length===0){
alert("Agrega productos");
return;
}

let mensaje="Pedido Go Pollos Rhosse\n\n";

let total=0;

carrito.forEach(item=>{
mensaje+=item.nombre+" - Bs "+item.precio+"\n";
total+=item.precio;
});

mensaje+="\nTotal Bs "+total;

window.open(

"https://wa.me/59172685867?text="+encodeURIComponent(mensaje),

"_blank"

);

carrito=[];
actualizarCarrito();

}


// ================= INICIAR =================

cargarProductos();

actualizarEstado();

contadorLenia();

setInterval(actualizarEstado,60000);

setInterval(contadorLenia,1000);

}

</script>

</body>
</html>
