<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:image" content="https://jwilsoncruz.github.io/gopollosrhosse/Preview.jpg">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<title>Pollos a la leña - Go Pollos Rhosse - Trinidad, Bolivia</title>
<link rel="icon" href="favicon.ico">

<style>
body{ font-family: Arial, sans-serif; margin:0; background:#610000; padding-bottom:240px; }
header{ text-align:center; padding:40px 20px; background:#d50000; color:white; }
.logo{ max-width:200px; display:block; margin:0 auto 15px auto; }
.container{ padding:20px; }
.categoria{ margin-top:35px; font-size:22px; color:#d50000; }
.grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:15px; }
.card{ background:white; padding:15px; border-radius:14px; box-shadow:0 6px 16px rgba(0,0,0,0.08); text-align:center; color: #333; }
.card img{ width:100%; height:120px; object-fit:cover; border-radius:10px; }
.precio{ font-weight:bold; margin:8px 0; }
.boton{ background:#25D366; color:white; padding:8px; border:none; border-radius:8px; cursor:pointer; font-weight:bold; width:100%; }
.boton:disabled{ background:gray; cursor:not-allowed; }
.carrito{ position:fixed; bottom:0; left:0; right:0; background:white; box-shadow:0 -3px 10px rgba(0,0,0,0.1); padding:15px; color: #333; z-index: 1000; }
.total{ font-weight:bold; font-size:18px; }
.redes{ margin-top:40px; text-align:center; }
.social-btn{ display:block; margin:10px auto; padding:12px; width:220px; border-radius:10px; text-decoration:none; color:white; font-size:18px; transition:0.3s; }
.facebook{ background:#1877F2; } .tiktok{ background:#000000; } .youtube{ background:#c4302b; }
.confetti{ position:fixed; width:8px; height:8px; top:-10px; animation:caer linear infinite; opacity:0.9; pointer-events:none; z-index:9999; }
@keyframes caer{ to{ transform:translateY(110vh) rotate(360deg); } }
</style>
</head>

<body>
<div id="app"></div>

<script>
const params = new URLSearchParams(window.location.search);
const modo = params.get("modo");
const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxXnNPSV2OTURsEO94cg3HwKjzFMIUJcytuyXyuWsKJ7VJOy80kSHneT6W9sGyEOpDRoQ/exec";

// CONFIGURACIÓN
const aperturaHora = 18, aperturaMin = 30, cierreHora = 22, cierreMin = 30;
const totalPollos = 8;
let pollosDisponibles = 5; 
const diasCerrados =, cierreManual = false;

// ================== MODO COCINA ==================
if(modo === "cocina"){
    document.getElementById("app").innerHTML = `
        <header><img src="logo.png" class="logo"><h1>🍗 PANTALLA COCINA</h1></header>
        <div style="text-align:center;padding:20px;">
            <button onclick="activarSonido()" style="padding:15px;background:#d50000;color:white;border:none;border-radius:10px;cursor:pointer;">🔔 Activar sonido cocina</button>
        </div>
        <div id="listaPedidos"></div>
        <audio id="alerta" preload="auto"><source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" type="audio/ogg"></audio>
    `;

    let sonidoActivado = false;
    let ultimoPedidoDetectado = null;

    window.activarSonido = () => { sonidoActivado = true; alert("Sonido activado 🔔"); };

    window.cargarPedidos = () => {
        fetch(URL_SCRIPT).then(res => res.json()).then(pedidos => {
            if(!pedidos) return;
            let contenedor = document.getElementById("listaPedidos");
            let html = "";
            const reciente = pedidos[pedidos.length - 1];

            if(sonidoActivado && reciente && ultimoPedidoDetectado !== reciente.fecha){
                document.getElementById("alerta").play().catch(()=>{});
                document.body.style.background = "#ff0000";
                setTimeout(()=> document.body.style.background = "#610000", 500);
                ultimoPedidoDetectado = reciente.fecha;
            }

            pedidos.reverse().forEach(p => {
                if(p.estado === "Listo") return; // AQUÍ SE BORRAN SOLOS
                let color = p.tipo === "Delivery" ? "#ffe5e5" : (p.tipo === "Mesa" ? "#e5f0ff" : "#e5ffe5");
                html += `
                    <div style="background:${color}; padding:15px; margin:15px; border-radius:10px; border-left:10px solid #d50000; color:#333;">
                        <div style="float:right; font-size:12px; color:#666;">${new Date(p.fecha).toLocaleTimeString()}</div>
                        <strong>📍 ${p.tipo.toUpperCase()}</strong><br>
                        <strong>🪑 Mesa:</strong> ${p.mesa}<br><br>
                        <div style="font-size:18px; background:rgba(255,255,255,0.5); padding:5px; border-radius:5px; white-space:pre-wrap;">${p.detalle}</div><br>
                        <strong>Total:</strong> Bs ${p.total}<br>
                        <button onclick="cambiarEstado('${p.fecha}','${p.detalle.replace(/'/g, "")}')" style="margin-top:10px; background:#25D366; color:white; border:none; padding:12px; width:100%; border-radius:8px; cursor:pointer; font-weight:bold;">✅ MARCAR COMO LISTO</button>
                    </div>`;
            });
            contenedor.innerHTML = html || "<h2 style='text-align:center;color:white;'>No hay pedidos pendientes 😴</h2>";
        });
    };

    window.cambiarEstado = (fecha, detalle) => {
        fetch(URL_SCRIPT, { method: "POST", body: JSON.stringify({ actualizar: true, fecha: fecha, detalle: detalle }) })
        .then(() => window.cargarPedidos());
    };

    setInterval(window.cargarPedidos, 5000);
    window.cargarPedidos();

} else {
    // ================== MODO CLIENTE (TODO TU DISEÑO ORIGINAL) ==================
    document.getElementById("app").innerHTML = `
        <header>
            <img src="logo.png" class="logo">
            <h1>Pollos a la Leña - Go Pollos Rhosse</h1>
            <div id="bannerCerrado" style="display:none;background:#8b0000;padding:12px;border-radius:10px;margin-top:10px;font-weight:bold;"></div>
            <p>Av. Moxos - Mercado Pompeya, Trinidad</p>
            <div style="background:white;padding:15px;border-radius:12px;margin-top:15px;text-align:center; color:#333;">
                <img src="promopadre.png" style="width:100%;border-radius:10px;">
                <h2 style="color:#d50000;">🔥 PROMO DEL MES</h2>
                <button class="boton" onclick="agregarPromo('🔥 Promo Pollo Entero + Soda 2L',120)">Agregar Promo</button>
            </div>
            <div style="background:white;padding:15px;border-radius:14px;margin-top:15px;color:#333;">
                <div id="estadoLocal" style="font-weight:bold;font-size:18px;margin-bottom:10px;"></div>
                <div style="background:#f5f5f5;border-radius:20px;height:20px;overflow:hidden;margin:10px 0;"><div id="barraPollos" style="height:100%;width:100%;background:linear-gradient(90deg,#ff4d4d,#b30000);transition:0.5s;"></div></div>
                <div id="textoEscasez" style="font-weight:bold;color:#b30000;"></div>
            </div>
        </header>
        <div class="container">
            <h2 class="categoria">🍗 Pollos a la leña</h2><div id="pollos" class="grid"></div>
            <h2 class="categoria">🥤 Bebidas</h2><div id="bebidas" class="grid"></div>
            <h2 class="categoria">🍔 Extras</h2><div id="extras" class="grid"></div>
            <div class="redes">
                <h2 style="color:#FFFF00;">Síguenos en Redes</h2>
                <a href="https://facebook.com/GoPollosRhosseTdd/" class="social-btn facebook"><i class="fab fa-facebook-f"></i> Facebook</a>
                <a href="https://tiktok.com/@go.rhosse.pollos.tdd" class="social-btn tiktok"><i class="fab fa-tiktok"></i> TikTok</a>
                <a href="https://youtube.com/@PollosalaLenaGoPollosRhosseTdd" class="social-btn youtube"><i class="fab fa-youtube"></i> YouTube</a>
            </div>
        </div>
        <div class="carrito">
            <div id="resumen">Sin productos</div><div class="total" id="total">Total: Bs 0</div>
            <div style="margin:10px 0;">
                <label><input type="radio" name="tipoPedido" value="Mesa" checked> 🍽 Mesa</label>
                <label><input type="radio" name="tipoPedido" value="Recoger"> 🛍 Recoger</label>
                <label><input type="radio" name="tipoPedido" value="Delivery"> 🚗 Delivery</label>
            </div>
            <button class="boton" onclick="enviarPedido()">Enviar por WhatsApp</button>
        </div>
    `;

    // LÓGICA CLIENTE
    const productos=[
        {categoria:"pollos", nombre:"Cuarto Pollo", precio:25, img:"medio.jpg"},
        {categoria:"pollos", nombre:"Pollo Entero", precio:100, img:"entero.jpg"},
        {categoria:"bebidas", nombre:"Gaseosa 2L", precio:12, img:"gaseosa2l.jpg"},
        {categoria:"extras", nombre:"Extra Papas", precio:5, img:"extra_papas.jpeg"}
    ];
    let carrito=[];

    window.add = (n,p) => { carrito.push({nombre:n, precio:p}); window.actualizarCarrito(); };
    window.agregarPromo = (n,p) => { if(pollosDisponibles>0){ carrito.push({nombre:n,precio:p}); pollosDisponibles--; window.actualizarCarrito(); window.actualizarEscasez(); } };
    
    window.actualizarCarrito = () => {
        let h="", t=0;
        carrito.forEach((x,i)=>{ t+=x.precio; h+=`${x.nombre} - Bs ${x.precio} <button onclick="carrito.splice(${i},1);window.actualizarCarrito()">✖</button><br>`; });
        document.getElementById("resumen").innerHTML=h||"Sin productos";
        document.getElementById("total").innerHTML="Total: Bs "+t;
    };

    window.enviarPedido = () => {
        if(!carrito.length) return alert("Vacio");
        let tipo = document.querySelector('input[name="tipoPedido"]:checked').value;
        let detalle = carrito.map(x=>x.nombre).join("\n");
        let total = carrito.reduce((a,b)=>a+b.precio, 0);
        let fecha = new Date().toISOString();
        fetch(URL_SCRIPT,{method:"POST",body:JSON.stringify({fecha,tipo,mesa:params.get("mesa")||"No especificada",detalle,total})});
        window.open(`https://wa.me/59168972863?text=${encodeURIComponent("Pedido: "+tipo+"\n"+detalle+"\nTotal: "+total)}`);
        carrito=[]; window.actualizarCarrito();
    };

    window.actualizarEscasez = () => {
        const b=document.getElementById("barraPollos"), t=document.getElementById("textoEscasez");
        let p=(pollosDisponibles/totalPollos)*100; b.style.width=p+"%";
        t.innerHTML=pollosDisponibles>0?`🔥 Disponibles: ${pollosDisponibles}`:"❌ AGOTADO";
    };

    productos.forEach(p=>{
        const d=document.createElement("div"); d.className="card";
        d.innerHTML=`<img src="${p.img}"><h3>${p.nombre}</h3><div class="precio">Bs ${p.precio}</div><button class="boton" onclick="add('${p.nombre}',${p.precio})">Agregar</button>`;
        document.getElementById(p.categoria).appendChild(d);
    });
    window.actualizarEscasez();
}

// Confetti
(function(){
    const colors=["#ffcc00","#ff3d00","#ffffff","#25D366"];
    for(let i=0;i<40;i++){
        const c=document.createElement("div"); c.className="confetti";
        c.style.left=Math.random()*100+"vw"; c.style.backgroundColor=colors[Math.floor(Math.random()*colors.length)];
        c.style.animationDuration=(Math.random()*3+4)+"s"; document.body.appendChild(c);
    }
})();
</script>
</body>
</html>
