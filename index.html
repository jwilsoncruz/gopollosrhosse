<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:image" content="https://jwilsoncruz.github.io/gopollosrhosse/Preview.jpg">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<title>Pollos a la leña - Go Pollos Rhosse - Trinidad, Beni, Bolivia</title>
<link rel="icon" href="favicon.ico">

<style>
body{ font-family: Arial, sans-serif; margin:0; background:#610000; padding-bottom:240px; }
header{ text-align:center; padding:40px 20px; background:#d50000; color:white; }
.logo{ max-width:200px; display:block; margin:0 auto 15px auto; }
.container{ padding:20px; }
.categoria{ margin-top:35px; font-size:22px; color:#FFFF00; }
.grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:15px; }
.card{ background:white; padding:15px; border-radius:14px; box-shadow:0 6px 16px rgba(0,0,0,0.08); text-align:center; }
.card img{ width:100%; height:120px; object-fit:cover; border-radius:10px; }
.precio{ font-weight:bold; margin:8px 0; }
.boton{ background:#25D366; color:white; padding:8px; border:none; border-radius:8px; cursor:pointer; font-weight:bold; }
.boton:disabled{ background:gray; cursor:not-allowed; }
.carrito{ position:fixed; bottom:0; left:0; right:0; background:white; box-shadow:0 -3px 10px rgba(0,0,0,0.1); padding:15px; z-index:1000; }
.total{ font-weight:bold; font-size:18px; color: #333; }
.redes{ margin-top:40px; text-align:center; }
.social-btn{ display:block; margin:10px auto; padding:12px; width:220px; border-radius:10px; text-decoration:none; color:white; font-size:18px; transition:0.3s; }
.facebook{ background:#1877F2; }
.tiktok{ background:#000000; }
.youtube{ background:#c4302b; }
.confetti{ position:fixed; width:8px; height:8px; top:-10px; animation:caer linear infinite; opacity:0.9; pointer-events:none; z-index:9999; }
@keyframes caer{ to{ transform:translateY(110vh) rotate(360deg); } }
</style>
</head>

<body>
<div id="app"></div>

<script>
const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxXnNPSV2OTURsEO94cg3HwKjzFMIUJcytuyXyuWsKJ7VJOy80kSHneT6W9sGyEOpDRoQ/exec";
const params = new URLSearchParams(window.location.search);
const modo = params.get("modo");

// Configuración Horario
const aperturaHora = 18, aperturaMin = 30, cierreHora = 22, cierreMin = 30;
const totalPollos = 4;
let pollosDisponibles = 3; 
const diasCerrados = [0]; 
const cierreManual = false;

// ================== MODO COCINA ==================
if(modo === "cocina"){
    document.getElementById("app").innerHTML = `
    <header><img src="logo.png" class="logo"><h1>🍗 PANTALLA COCINA</h1></header>
    <div style="text-align:center;padding:20px;">
        <button onclick="activarSonido()" style="padding:15px 25px;font-size:18px;background:#d50000;color:white;border:none;border-radius:10px;cursor:pointer;">🔔 Activar sonido cocina</button>
    </div>
    <div id="listaPedidos" class="container"></div>
    <audio id="alerta" preload="auto"><source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" type="audio/ogg"></audio>`;

    let sonidoActivado = false;
    let ultimoPedidoDetectado = null;

    window.activarSonido = function() { sonidoActivado = true; alert("Sonido activado 🔔"); };

    window.cargarPedidos = function(){
        fetch(URL_SCRIPT)
        .then(res => res.json())
        .then(pedidos => {
            if(!pedidos) return;
            const pendientes = pedidos.filter(p => p.estado !== "Listo");
            let contenedor = document.getElementById("listaPedidos");
            let html = "";
            
            if(pendientes.length > 0) {
                const reciente = pendientes[pendientes.length - 1];
                if(sonidoActivado && ultimoPedidoDetectado !== reciente.fecha){
                    document.getElementById("alerta").play().catch(()=>{});
                    document.body.style.background = "#ff0000";
                    setTimeout(()=> document.body.style.background = "#610000", 500);
                    ultimoPedidoDetectado = reciente.fecha;
                }
            }

            pendientes.reverse().forEach(p => {
                let color = p.tipo === "Delivery" ? "#ffe5e5" : (p.tipo === "Mesa" ? "#e5f0ff" : "#e5ffe5");
                html += `
                <div style="background:${color}; padding:15px; margin-bottom:15px; border-radius:8px; color:#333; border-left: 8px solid #d50000; text-align:left;">
                    <strong>${p.tipo} - Mesa: ${p.mesa}</strong><br>
                    <div style="font-size:1.1em; margin:10px 0; font-weight:bold;">${p.detalle.replace(/\n/g, "<br>")}</div>
                    Total: Bs ${p.total}<br>
                    <button onclick="cambiarEstado('${p.fecha}')" style="margin-top:8px;background:#28a745;color:white;border:none;padding:12px;border-radius:6px;cursor:pointer;width:100%;font-weight:bold;">✅ MARCAR ENTREGADO</button>
                </div>`;
            });
            contenedor.innerHTML = html || "<h2 style='text-align:center;color:white;'>No hay pedidos pendientes 😴</h2>";
        });
    };

    window.cambiarEstado = function(fecha){
        fetch(URL_SCRIPT, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify({ actualizar: true, fecha: fecha })
        });
        setTimeout(window.cargarPedidos, 500);
    };

    setInterval(window.cargarPedidos, 5000);
    window.cargarPedidos();

} 
// ================== MODO CLIENTE ==================
else {
    document.getElementById("app").innerHTML = `
    <header>
        <img src="logo.png" class="logo">
        <h1>Pollos a la Leña - Go Pollos Rhosse</h1>
        <div id="bannerCerrado" style="display:none;background:#8b0000;color:white;padding:12px;border-radius:10px;margin-top:10px;font-weight:bold;"></div>
        <p>Av. Moxos - Zona Mercado Pompeya</p>
        <div style="background:white;padding:15px;border-radius:12px;margin-top:15px;text-align:center;">
            <img src="promopadre.png" style="width:100%;border-radius:10px;">
            <h2 style="color:#d50000;">🔥 PROMO DEL MES</h2>
            <button class="boton" onclick="agregarPromo('🔥 Promo 1 Pollo + Soda 2L',120)">Agregar Promo</button>
        </div>
        <div style="background:white;padding:15px;border-radius:14px;margin-top:15px;color:#333;">
            <div id="estadoLocal" style="font-weight:bold;font-size:18px;"></div>
            <div style="background:#f5f5f5;border-radius:20px;height:20px;margin:10px 0;"><div id="barraPollos" style="height:100%;width:100%;background:linear-gradient(90deg,#ff4d4d,#b30000);transition:0.5s;"></div></div>
            <div id="textoEscasez" style="font-weight:bold;color:#b30000;"></div>
        </div>
    </header>
    <div class="container">
        <h2 class="categoria">🍗 Pollos a la leña</h2><div id="pollos" class="grid"></div>
        <h2 class="categoria">🥤 Bebidas</h2><div id="bebidas" class="grid"></div>
        <h2 class="categoria">🍔 Extras</h2><div id="extras" class="grid"></div>
        <div class="redes">
            <a href="https://www.facebook.com/GoPollosRhosseTdd/" class="social-btn facebook"><i class="fab fa-facebook-f"></i> Facebook</a>
            <a href="https://tiktok.com/@go.rhosse.pollos.tdd" class="social-btn tiktok"><i class="fab fa-tiktok"></i> TikTok</a>
        </div>
    </div>
    <div class="carrito">
        <div id="resumen" style="color:#333;margin-bottom:5px;">Sin productos</div>
        <div class="total" id="total">Total: Bs 0</div>
        <div style="margin:10px 0; color:#333;">
            <input type="radio" name="tipoPedido" value="Mesa" checked> Mesa
            <input type="radio" name="tipoPedido" value="Recoger"> Recoger
            <input type="radio" name="tipoPedido" value="Delivery"> Delivery
        </div>
        <button class="boton" onclick="enviarPedido()" style="width:100%;padding:15px;">🚀 ENVIAR PEDIDO</button>
    </div>`;

    const productos=[
        {categoria:"pollos", nombre:"Pollo Económico", precio:15, img:"menu.jpg"},
        {categoria:"pollos", nombre:"Cuarto Pollo", precio:25, img:"medio.jpg"},
        {categoria:"pollos", nombre:"Medio Pollo", precio:50, img:"cuarto.jpg"},
        {categoria:"pollos", nombre:"Pollo Entero", precio:100, img:"entero.jpg"},
        {categoria:"bebidas", nombre:"Gaseosa 2L", precio:13, img:"gaseosa2l.jpg"},
        {categoria:"bebidas", nombre:"Limonada Jarra", precio:10, img:"limonada_grande.jpg"},
        {categoria:"extras", nombre:"Extra Papas", precio:5, img:"extra_papas.jpeg"}
    ];

    let carrito = [];
    window.agregar = function(n, p) { carrito.push({nombre:n, precio:p}); actualizarCarrito(); };
    window.agregarPromo = function(n, p) { if(pollosDisponibles > 0) { carrito.push({nombre:n, precio:p}); pollosDisponibles--; actualizarCarrito(); actualizarEscasez(); } };
    
    window.eliminarProducto = function(i) { 
        if(carrito[i].nombre.includes("Promo")) pollosDisponibles++;
        carrito.splice(i,1); actualizarCarrito(); actualizarEscasez(); 
    };

    function actualizarCarrito(){
        let html = "", total = 0;
        carrito.forEach((item, i) => {
            total += item.precio;
            html += `${item.nombre} - Bs ${item.precio} <button onclick="eliminarProducto(${i})" style="color:red;border:none;background:none;cursor:pointer;">✖</button><br>`;
        });
        document.getElementById("resumen").innerHTML = html || "Sin productos";
        document.getElementById("total").innerHTML = "Total: Bs " + total;
    }

    window.enviarPedido = function(){
        if(carrito.length === 0) return alert("Agrega algo!");
        const tipo = document.querySelector('input[name="tipoPedido"]:checked').value;
        const mesa = new URLSearchParams(window.location.search).get("mesa") || "General";
        const detalle = carrito.map(i => i.nombre).join("\n");
        const total = carrito.reduce((s, i) => s + i.precio, 0);

        fetch(URL_SCRIPT, { method: "POST", mode: "no-cors", body: JSON.stringify({ tipo, mesa, detalle, total }) });
        
        const msg = `🍗 *PEDIDO GO POLLOS*\n*Tipo:* ${tipo}\n*Mesa:* ${mesa}\n\n${detalle}\n\n*Total:* Bs ${total}`;
        window.open("https://wa.me/59172685867?text=" + encodeURIComponent(msg), "_blank");
        carrito = []; actualizarCarrito();
    };

    function actualizarEscasez(){
        const barra = document.getElementById("barraPollos");
        const texto = document.getElementById("textoEscasez");
        let porc = (pollosDisponibles / totalPollos) * 100;
        barra.style.width = porc + "%";
        texto.innerHTML = pollosDisponibles > 0 ? `🔥 Disponibles: ${pollosDisponibles}` : "❌ AGOTADO";
    }

    // Cargar productos
    productos.forEach(p => {
        const div = document.createElement("div"); div.className="card";
        div.innerHTML = `<img src="${p.img}"><h3>${p.nombre}</h3><div class="precio">Bs ${p.precio}</div><button class="boton" onclick="agregar('${p.nombre}',${p.precio})">Agregar</button>`;
        document.getElementById(p.categoria).appendChild(div);
    });

    actualizarEscasez();
}

// Confeti
(function(){
    const colores=["#ffcc00","#ff3d00","#ffffff","#25D366"];
    for(let i=0;i<30;i++){
        const c=document.createElement("div"); c.className="confetti";
        c.style.left=Math.random()*100+"vw"; c.style.backgroundColor=colores[Math.floor(Math.random()*colores.length)];
        c.style.animationDuration=(Math.random()*3+4)+"s"; document.body.appendChild(c);
    }
})();
</script>
</body>
</html>
