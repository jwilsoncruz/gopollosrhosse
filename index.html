<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Pollos Rhosse</title>

<style>
body{
  font-family: Arial, sans-serif;
  margin:0;
  background:#610000;
  padding-bottom:240px;
}

header{
  text-align:center;
  padding:40px 20px;
  background:#d50000;
  color:white;
}

.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:15px;
}

.card{
  background:white;
  padding:15px;
  border-radius:14px;
  text-align:center;
}
</style>
</head>

<body>

<div id="app"></div>

<script>

document.getElementById("app").innerHTML = `
<header>
  <h1>🍗 Go Pollos Rhosse</h1>
  <p>Pedidos online</p>
</header>

<div style="padding:20px">
  <div class="grid">

    <div class="card">
      <h3>Pollo Entero</h3>
      <p>Bs 100</p>
      <button onclick="agregar('Pollo Entero',100)">
        Agregar
      </button>
    </div>

    <div class="card">
      <h3>Medio Pollo</h3>
      <p>Bs 50</p>
      <button onclick="agregar('Medio Pollo',50)">
        Agregar
      </button>
    </div>

  </div>
</div>

<div id="carrito" style="
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
padding:15px;
">
  <div id="resumen">Sin productos</div>
  <div id="total">Total: Bs 0</div>
</div>
`;

let carrito = [];

function agregar(nombre,precio){
  carrito.push({nombre,precio});
  actualizar();
}

function actualizar(){
  let total = 0;
  let html = "";

  carrito.forEach(item=>{
    total += item.precio;
    html += item.nombre + " - Bs " + item.precio + "<br>";
  });

  document.getElementById("resumen").innerHTML =
    html || "Sin productos";

  document.getElementById("total").innerHTML =
    "Total: Bs " + total;
}

</script>

</body>
</html>
