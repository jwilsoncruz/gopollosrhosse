<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Go Pollos Rhosse - Pollos a la leña</title>

<style>

body{
font-family:Arial;
margin:0;
background:#610000;
color:white;
}

header{
text-align:center;
background:#d50000;
padding:30px 20px;
}

.logo{
max-width:180px;
display:block;
margin:auto;
}

.marquesina{
background:#ffd401;
color:#610000;
overflow:hidden;
white-space:nowrap;
font-weight:bold;
padding:8px 0;
}

.marquesina span{
display:inline-block;
padding-left:100%;
animation:marquesina 15s linear infinite;
}

@keyframes marquesina{
0%{transform:translateX(0)}
100%{transform:translateX(-100%)}
}

.container{
padding:20px;
}

.categoria{
color:#ffd401;
font-size:22px;
margin-top:25px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:15px;
}

.card{
background:white;
color:black;
border-radius:12px;
padding:10px;
text-align:center;
}

.card img{
width:100%;
height:120px;
object-fit:cover;
border-radius:8px;
}

.precio{
font-weight:bold;
margin:6px;
}

.boton{
background:#25D366;
color:white;
border:none;
padding:8px;
border-radius:8px;
cursor:pointer;
}

.carrito{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
color:black;
padding:15px;
}

.social{
text-align:center;
background:white;
color:black;
padding:15px;
}

.mapa{
padding:20px;
background:white;
}

</style>
</head>

<body>

<div class="marquesina">
<span>🔥 Próximamente NUEVA UBICACIÓN para Go Pollos Rhosse 🍗 Estamos buscando un mejor lugar para atenderte 🔥</span>
</div>

<header>

<img src="logo.png" class="logo">

<h1>Pollos a la Leña<br>Go Pollos Rhosse</h1>

<div id="estado"></div>

<div id="contador"></div>

</header>

<div class="container">

<h2 class="categoria">🍗 Pollos</h2>
<div id="pollos" class="grid"></div>

<h2 class="categoria">🥤 Bebidas</h2>
<div id="bebidas" class="grid"></div>

<h2 class="categoria">🍟 Extras</h2>
<div id="extras" class="grid"></div>

</div>

<div class="carrito">

<div id="resumen">Sin productos</div>

<div id="total">Total Bs 0</div>

<button onclick="pedido()">Enviar pedido por WhatsApp</button>

</div>

<div class="social">

<h3>📱 Síguenos</h3>

<a href="https://wa.me/59168972863">WhatsApp</a> |
<a href="#">Facebook</a> |
<a href="#">TikTok</a>

</div>

<div class="mapa">

<h3 style="color:#d50000">📍 Ubicación</h3>

<iframe
src="https://maps.google.com/maps?q=mercado%20pompeya%20trinidad%20beni&t=&z=15&ie=UTF8&iwloc=&output=embed"
width="100%"
height="250"
style="border:0;border-radius:10px">
</iframe>

</div>

<script>

const productos=[

{categoria:"pollos",nombre:"Pollo Entero",precio:100,img:"entero.jpg"},
{categoria:"pollos",nombre:"Medio Pollo",precio:50,img:"medio.jpg"},
{categoria:"pollos",nombre:"Cuarto Pollo",precio:25,img:"cuarto.jpg"},

{categoria:"bebidas",nombre:"Gaseosa 2L",precio:13,img:"gaseosa2l.jpg"},
{categoria:"bebidas",nombre:"Gaseosa Personal",precio:6,img:"gaseosa.jpg"},

{categoria:"extras",nombre:"Extra Papas",precio:5,img:"extra_papas.jpg"},
{categoria:"extras",nombre:"Extra Arroz",precio:5,img:"extra_arroz.jpg"}

];

let carrito=[];

function crearProducto(p){

let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<img src="${p.img}">
<h3>${p.nombre}</h3>
<div class="precio">Bs ${p.precio}</div>
<button class="boton" onclick="agregar('${p.nombre}',${p.precio})">Agregar</button>
`;

return div;
}

function cargarProductos(){

productos.forEach(p=>{

let cont=document.getElementById(p.categoria);

if(cont) cont.appendChild(crearProducto(p));

});

}

function agregar(nombre,precio){

carrito.push({nombre,precio});

actualizar();

}

function actualizar(){

let total=0;

let html="";

carrito.forEach(p=>{

total+=p.precio;

html+=p.nombre+" Bs "+p.precio+"<br>";

});

document.getElementById("resumen").innerHTML=html||"Sin productos";

document.getElementById("total").innerHTML="Total Bs "+total;

}

function pedido(){

if(carrito.length==0){

alert("Agrega algo al pedido");

return;

}

let texto="🍗 Pedido Go Pollos Rhosse\n\n";

let total=0;

carrito.forEach(p=>{

texto+=p.nombre+" Bs "+p.precio+"\n";

total+=p.precio;

});

texto+="\nTotal Bs "+total;

window.open("https://wa.me/59168972863?text="+encodeURIComponent(texto));

}

function estado(){

let ahora=new Date();

let h=ahora.getHours();

let estado=document.getElementById("estado");

if(h>=19 && h<=22){

estado.innerHTML="🟢 Estamos atendiendo";

estado.style.color="lightgreen";

}

else{

estado.innerHTML="🔴 Cerrado - Abrimos 19:00";

estado.style.color="yellow";

}

}

function contador(){

let ahora=new Date();

let abrir=new Date();

abrir.setHours(19,0,0);

let diff=abrir-ahora;

if(diff<0){

document.getElementById("contador").innerHTML="🔥 Pollos saliendo de la leña";

return;

}

let h=Math.floor(diff/3600000);

let m=Math.floor((diff%3600000)/60000);

let s=Math.floor((diff%60000)/1000);

document.getElementById("contador").innerHTML=

"Abrimos en "+h+"h "+m+"m "+s+"s";

}

cargarProductos();

estado();

contador();

setInterval(contador,1000);

</script>

</body>
</html>
