function crearProducto(p){
  const div = document.createElement("div");
  div.className = "card";

  div.innerHTML = `
<img src="${p.img}" alt="${p.nombre}" loading="lazy">
<h3>${p.nombre}</h3>
<div class="precio">Bs ${p.precio}</div>
<button class="boton">Agregar</button>
`;

  div.querySelector("button").addEventListener("click", ()=>agregar(p.nombre, p.precio));
  return div;
}

function cargarProductos(){

    if(cont) cont.appendChild(crearProducto(p));
  });
}

// ================= CARRITO =================
function agregar(nombre, precio){
  carrito.push({nombre, precio});

  if(nombre.includes("Pollo")){
    pollosDisponibles = Math.max(0, pollosDisponibles - 1);
    actualizarPollos();
  }

  actualizarCarrito();
}

function eliminarProducto(i){
  const p = carrito[i];
  if(!p) return;

  carrito.splice(i, 1);

  // Si quitas un pollo del carrito, se devuelve al contador
  if(p.nombre.includes("Pollo")){
    pollosDisponibles = Math.min(totalPollos, pollosDisponibles + 1);
    actualizarPollos();
  }

  actualizarCarrito();
}

function actualizarCarrito(){
  let total = 0;
  let html = "";

  carrito.forEach((p, i)=>{
    total += p.precio;
    html += `
${p.nombre} Bs ${p.precio}
<button onclick="eliminarProducto(${i})">❌</button><br>
`;
  });

  document.getElementById("resumen").innerHTML = html || "🛒 Tu carrito está vacío";
  document.getElementById("total").innerHTML = "Total: Bs " + total;
}

// ================= POLLOS DISPONIBLES =================
function actualizarPollos(){
  const barra = document.getElementById("barraPollos");
  const texto = document.getElementById("textoEscasez");

  if(!barra || !texto) return;

  const porcentaje = Math.min(100, Math.max(0, (pollosDisponibles / totalPollos) * 100));
  barra.style.width = porcentaje + "%";

  if(pollosDisponibles <= 0){
    barra.style.background = "#00c853";
    texto.innerHTML = "🍗 POLLOS AGOTADOS POR HOY";
  }
  else if(pollosDisponibles == 1){
    barra.style.background = "#ffab00"; // amarillo
    texto.innerHTML = "⚠️ ¡Último pollo disponible!";
  }
  else if(pollosDisponibles <= 2){
    barra.style.background = "#d50000"; // crítico (rojo)
    texto.innerHTML = "🔥 ¡Quedan solo " + pollosDisponibles + " pollos!";
  }
  else{
    barra.style.background = "green";
    texto.innerHTML = "🔥 Quedan " + pollosDisponibles + " pollos a la leña";
  }

  actualizarMarquesina();
}

  const m = document.getElementById("textoMarquesina");
  if(m && m.textContent !== texto) m.textContent = texto;
}

function actualizarMarquesina(){

  if(remoto && remoto.mensaje){
    ponerMarquesina(remoto.mensaje);
    return;

  // 🔴 Día cerrado

    ponerMarquesina("🔴 Hoy el Restaurante está Cerrado Servicio de Mantenimiento — Nos vemos mañana >>>NUEVA UBICACION EN ZONA PEDRO IGNACIO MUIBA FINAL<<<< 🔥Pronto de  Almuerzo su pollito a la leña");
    return;

  // 🍗 Pollos agotados
  if(pollosDisponibles <= 0){
    ponerMarquesina("🍗 POLLOS AGOTADOS POR HOY — Gracias Trinidad por la preferencia - volvemos mañana🔥");
    return;
  }

  // ⚠️ Pocos pollos
  if(pollosDisponibles <= 2){
    ponerMarquesina("⚠️ ¡QUEDAN SOLO " + pollosDisponibles + " POLLOS A LA LEÑA! — Haz tu pedido 🍗");
    return;
  }

  // 🟢 Abierto
  if(localAbierto()){
    ponerMarquesina("🍗 RECIBIENDO RESERVAS/PEDIDOS >>> POLLOS A LA LEÑA SALIENDO 10:00AM — 🚚 Delivery solo 5 Bs — Haz tu pedido ahora 🔥");

}

    estado.style.color = "yellow";
    if(logo) logo.style.filter = "grayscale(100%)";
  }

  document.querySelectorAll(".boton").forEach(b=>{
    b.disabled = !abierto;
  });
}

// ================= CONTADOR DE LA LEÑA =================
function formatoCuenta(ms){
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  return String(h).padStart(2, "0") + ":" +
         String(m).padStart(2, "0") + ":" +
         String(s).padStart(2, "0");
}

function contadorLenia(){
  const estado = document.getElementById("estadoLenia");
  const tiempo = document.getElementById("tiempoApertura");

  if(!estado || !tiempo) return;

  const ahora = new Date();

  if(cerradoTodoElDia(ahora)){
    estado.innerHTML = "🔴 Hoy está cerrado";
    tiempo.innerHTML = "Abrimos mañana 🔥";
    return;
  }

  const prender = new Date();
  prender.setHours(9, 0, 0, 0);

  const abrir = new Date();
  abrir.setHours(11, 0, 0, 0);

  const cerrar = new Date();
  cerrar.setHours(22, 30, 0, 0);

  if(localAbierto()){
    estado.innerHTML = "🟢 Estamos atendiendo";
    tiempo.innerHTML = "🍗 Pollos saliendo de la leña";
    return;
  }

  if(ahora >= cerrar){
    estado.innerHTML = "🔴 Restaurante cerrado";

    // buscar el próximo día abierto
    const proximo = new Date();
    proximo.setDate(ahora.getDate() + 1);
    while(cerradoTodoElDia(proximo)){
      proximo.setDate(proximo.getDate() + 1);
    }

    const diaTexto = proximo.toLocaleDateString("es-ES", { weekday: "long" });
    tiempo.innerHTML = "Abrimos el " + diaTexto + " 🔥";
    return;
  }

  if(ahora < prender){
    estado.innerHTML = "⏳ Prendemos la leña en";
    tiempo.innerHTML = formatoCuenta(prender - ahora);
    return;
  }

  if(ahora >= prender && ahora < abrir){
    estado.innerHTML = "🔥 Leña encendida";
    tiempo.innerHTML = "Abrimos en " + formatoCuenta(abrir - ahora);
    return;
  }

  // Cerrado por el sistema (Google Sheets) en pleno horario
  estado.innerHTML = "🔴 Cerrado";
  tiempo.innerHTML = "Volvemos pronto 🔥";
}

// ================= MENÚ SEGÚN LA HORA =================
// OJO: como finAlmuerzo (22:30) es mayor que inicioCena (13:00),
// el menú de CENA nunca llega a mostrarse. Ajusta finAlmuerzo si quieres separarlos.
function actualizarMenuPorHora(){
  const ahora = new Date();
  const tiempo = ahora.getHours() * 60 + ahora.getMinutes();

  const inicioAlmuerzo = 9 * 60;
  const ventaAlmuerzo = 11 * 60;
  const finAlmuerzo = 22 * 60 + 30;

  const inicioCena = 13 * 60;
  const finCena = 22 * 60 + 30;

  const tituloAlmuerzo = document.getElementById("categoria-almuerzo");
  const almuerzo = document.getElementById("almuerzo");

  const tituloCena = document.getElementById("categoria-cena");
  const cena = document.getElementById("cena");

  const estado = document.getElementById("estadoLocal");

  function ocultarTodo(){
    if(tituloAlmuerzo) tituloAlmuerzo.style.display = "none";
    if(almuerzo) almuerzo.style.display = "none";
    if(tituloCena) tituloCena.style.display = "none";
    if(cena) cena.style.display = "none";
  }

  if(tiempo < inicioAlmuerzo){
    ocultarTodo();
    if(estado) estado.innerHTML = "🔴 Cerrado — Abrimos desde las 11:00 AM";
    return;
  }

  if(tiempo >= inicioAlmuerzo && tiempo < ventaAlmuerzo){
    ocultarTodo();
    if(tituloAlmuerzo) tituloAlmuerzo.style.display = "block";
    if(estado) estado.innerHTML = "⏳ Preparando almuerzo — pedidos desde las 11:00";
    return;
  }

  if(tiempo >= ventaAlmuerzo && tiempo <= finAlmuerzo){
    ocultarTodo();
    if(tituloAlmuerzo) tituloAlmuerzo.style.display = "block";
    if(almuerzo) almuerzo.style.display = "grid";
    if(estado) estado.innerHTML = "🍗 Menú de Almuerzo disponible";
    return;
  }

  if(tiempo > finAlmuerzo && tiempo < inicioCena){
    ocultarTodo();
    if(estado) estado.innerHTML = "⏸️ Pausa — volvemos a las 16:00 con cena";
    return;
  }

  if(tiempo >= inicioCena && tiempo <= finCena){
    ocultarTodo();
    if(tituloCena) tituloCena.style.display = "block";
    if(cena) cena.style.display = "grid";
    if(estado) estado.innerHTML = "🌙 Menú de Cena disponible";
    return;
  }

  if(tiempo > finCena){
    ocultarTodo();
    if(estado) estado.innerHTML = "🔴 Cerrado — volvemos mañana 🍗";
    return;
  }
}

// ================= CONTROL REMOTO (GOOGLE SHEETS) =================
async function cargarConfig(){
  try{
    const res = await fetch(API_CONFIG);
    const data = await res.json();
    if(!data || typeof data !== "object") return;

    remoto = data;

    // 🔧 MANTENIMIENTO (prioridad máxima)
    if(data.mantenimiento === "si"){
      enMantenimiento = true;
      document.getElementById("app").innerHTML =
        '<div style="padding:40px;text-align:center;color:white;">' +
        '<h1>🔧 En mantenimiento</h1><p id="mensajeMantenimiento"></p></div>';
      document.getElementById("mensajeMantenimiento").textContent = data.mensaje || "";
      return;
    }

    // Si estaba en mantenimiento y ya terminó, recargar la página completa
    if(enMantenimiento){
      location.reload();
      return;
    }

    // 🍗 POLLOS (solo si la hoja manda un número válido)
    const n = parseInt(data.pollos, 10);
    if(!isNaN(n)) pollosDisponibles = Math.max(0, n);

    actualizarPollos();
    actualizarEstado();
    actualizarMarquesina();
    contadorLenia();

  }catch(e){
    console.error("Error conectando con Google Sheets", e);
  }
}

// ================= ENVIAR PEDIDO =================
function enviarPedido(){

  if(enviando) return;

  if(!localAbierto()){
    alert("🔴 El restaurante está cerrado");
    return;
  }

  if(carrito.length === 0){
    alert("Agrega al menos un producto");
    return;
  }

  const tipoPedido = document.querySelector('input[name="tipoPedido"]:checked').value;

  let detalle = "";
  let total = 0;

  carrito.forEach(p=>{
    detalle += p.nombre + " Bs " + p.precio + "\n";
    total += p.precio;
  });

  const mesa = mesaQR ? "Mesa " + mesaQR : tipoPedido;

  enviando = true;

  fetch(API, {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body:
      "fecha=" + encodeURIComponent(new Date().toLocaleString()) +
      "&tipo=" + encodeURIComponent(tipoPedido) +
      "&mesa=" + encodeURIComponent(mesa) +
      "&detalle=" + encodeURIComponent(detalle) +
      "&total=" + total
  })
  .then(res=>res.json())
  .then(data=>{

    if(data.ok){

      let texto = "🍗 Pedido Go Pollos Rhosse\n\n";
      texto += "Tipo: " + tipoPedido + "\n\n" + detalle + "\nTotal Bs " + total;

      window.open("https://wa.me/59172685867?text=" + encodeURIComponent(texto));

      carrito = [];
      actualizarCarrito();

      alert("✅ Pedido enviado a cocina");

    }else{
      alert("❌ Error enviando pedido");
    }

  })
  .catch(err=>{
    console.error(err);
    alert("❌ Error enviando pedido");
  })
  .finally(()=>{
    enviando = false;
  });

}
