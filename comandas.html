<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Pollos Rhosse PRO</title>

<style>
body {
font-family: Arial;
background:#111;
color:#fff;
margin:0;
padding:10px;
text-align:center;
padding-top:90px;
padding-bottom:260px;
}

select, input {
width:48%;
padding:12px;
font-size:16px;
margin:5px 1%;
border-radius:8px;
border:none;
}

.grid {
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin:10px 0;
}

button {
padding:16px;
font-size:16px;
border-radius:10px;
border:none;
width:100%;
}

.entero { background:#e53935; }
.cuarto { background:#fb8c00; }
.economico { background:#43a047; }
.extra { background:#039be5; }

#topbar, #cambio {
position:fixed;
left:0;
width:100%;
background:#000;
padding:10px;
z-index:1000;
}

#topbar { top:0; font-size:22px; }
#cambio { top:50px; font-size:20px; }

#detalle {
background:#222;
padding:10px;
border-radius:10px;
margin:10px 0;
min-height:60px;
}

.total { font-size:28px; }

.floating {
position:fixed;
bottom:5px;
left:50%;
transform:translateX(-50%);
width:90%;
}

.enviar { background:#4caf50; }
.reset { background:#f44336; }
.caja { background:#ff9800; }

#qrBox {
display:none;
margin:10px;
padding:10px;
background:#222;
border-radius:10px;
}
</style>
</head>

<body>

<div id="topbar">💰 Total: <span id="totalTop">0 Bs</span></div>
<div id="cambio">💵 Cambio: 0 Bs</div>

<h2>🔥 GO POLLOS RHOSSE PRO 🔥</h2>

<select id="mesero">
<option>Dafne</option>
<option>Mauricio</option>
<option>Padme</option>
<option>Karen</option>
<option>Wilson</option>
<option>Raquel</option>
</select>

<select id="mesa">
<option>Mesa 1</option>
<option>Mesa 2</option>
<option>Para Llevar</option>
<option>Delivery</option>
</select>

<h3>🍗 Menú</h3>
<div class="grid">
<button class="entero" onclick="add('Pollo Entero',100)">Entero 100</button>
<button class="entero" onclick="add('Medio Pollo',50)">Medio 50</button>
<button class="cuarto" onclick="add('Pierna+Contra',25)">Pierna+Contra</button>
<button class="cuarto" onclick="add('Ala+Pecho',25)">Ala+Pecho</button>
<button class="economico" onclick="add('Pecho',15)">Pecho</button>
<button class="economico" onclick="add('Ala',15)">Ala</button>
<button class="extra" onclick="add('Arroz',5)">Arroz</button>
<button class="extra" onclick="add('Papas',5)">Papas</button>
</div>

<div id="detalle">Sin pedidos</div>
<div class="total" id="totalText">Total: 0 Bs</div>

<h3>💳 Pago</h3>

<select id="tipoPago" onchange="cambiarPago()">
<option value="Efectivo">Efectivo</option>
<option value="QR">QR</option>
</select>

<input type="number" id="montoManual" placeholder="Monto recibido">

<div class="grid">
<button onclick="pagar(20)">20</button>
<button onclick="pagar(50)">50</button>
<button onclick="pagar(100)">100</button>
<button onclick="pagar(200)">200</button>
</div>

<div id="qrBox">
<h3>📲 Escanear QR</h3>
<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=PagoGoPollos" width="200">
</div>

<div class="floating">
<button class="enviar" onclick="enviar()">📲 ENVIAR</button>
<button class="caja" onclick="verCaja()">📊 CAJA</button>
<button class="reset" onclick="resetear()">❌ LIMPIAR</button>
</div>

<script>

let pedido = [];
let total = 0;

function add(n,p){
pedido.push({n,p});
total += p;
render();
}

function render(){
let t="";
pedido.forEach(x=> t+= x.n+" - "+x.p+" Bs<br>");
if(!t) t="Sin pedidos";

document.getElementById("detalle").innerHTML=t;
document.getElementById("totalTop").innerText=total+" Bs";
document.getElementById("totalText").innerText="Total: "+total+" Bs";
}

function pagar(m){
if(document.getElementById("tipoPago").value==="QR"){
document.getElementById("cambio").innerText="📲 Pago QR confirmado";
return;
}

let monto = m || parseFloat(document.getElementById("montoManual").value || 0);
let c = monto-total;

document.getElementById("cambio").innerText =
c<0 ? "❌ Falta "+Math.abs(c)+" Bs" : "💵 Cambio "+c+" Bs";
}

function cambiarPago(){
let tipo = document.getElementById("tipoPago").value;
document.getElementById("qrBox").style.display = tipo==="QR" ? "block":"none";
document.getElementById("cambio").innerText="💵 Cambio: 0 Bs";
}

function enviar(){

if(pedido.length===0){
alert("Sin pedido");
return;
}

let txt="🔥 PEDIDO\n\n";
txt+="Mesa: "+document.getElementById("mesa").value+"\n";
txt+="Pago: "+document.getElementById("tipoPago").value+"\n\n";

pedido.forEach(x=>{
txt+="- "+x.n+"\n";
});

txt+="\nTOTAL: "+total+" Bs";

// guardar caja
let caja = JSON.parse(localStorage.getItem("caja")||"[]");
caja.push({total, tipo:document.getElementById("tipoPago").value});
localStorage.setItem("caja", JSON.stringify(caja));

window.open("https://wa.me/59172685867?text="+encodeURIComponent(txt));

resetear();
}

function verCaja(){
let caja = JSON.parse(localStorage.getItem("caja")||"[]");

let totalDia=0, ef=0, qr=0;

caja.forEach(v=>{
totalDia+=v.total;
if(v.tipo==="Efectivo") ef+=v.total;
else qr+=v.total;
});

alert("📊 CAJA\nTotal: "+totalDia+" Bs\nEfectivo: "+ef+"\nQR: "+qr);
}

function resetear(){
pedido=[];
total=0;
render();
document.getElementById("cambio").innerText="💵 Cambio: 0 Bs";
document.getElementById("montoManual").value="";
document.getElementById("tipoPago").value="Efectivo";
document.getElementById("qrBox").style.display="none";
}

</script>

</body>
</html>
