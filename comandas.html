<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Pollos Rhosse</title>

<style>
body {
font-family: Arial;
background:#111;
color:#fff;
margin:0;
padding:10px;
text-align:center;
padding-top:70px;
padding-bottom:120px;
}

h2 { margin:5px; }

select {
width:48%;
padding:12px;
font-size:16px;
margin:5px 1%;
border-radius:8px;
}

.grid {
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin:10px 0;
}

button {
padding:18px;
font-size:16px;
border-radius:12px;
border:none;
width:100%;
}

.entero { background:#e53935; }
.cuarto { background:#fb8c00; }
.economico { background:#43a047; }
.tiktok { background:#8e24aa; }
.extra { background:#039be5; }

#topbar {
position:fixed;
top:0;
left:0;
width:100%;
background:#000;
padding:12px;
font-size:22px;
font-weight:bold;
z-index:1000;
border-bottom:2px solid #4caf50;
}

#detalle {
background:#222;
padding:10px;
border-radius:10px;
margin:10px 0;
min-height:60px;
font-size:14px;
}

.total {
font-size:28px;
margin:10px;
}

#cambio {
font-size:22px;
margin:10px;
color:#00e676;
font-weight:bold;
}

.floating {
position:fixed;
bottom:10px;
left:50%;
transform:translateX(-50%);
width:90%;
z-index:1000;
}

.floating button {
width:100%;
padding:18px;
font-size:20px;
border-radius:12px;
border:none;
margin-top:5px;
}

.enviar { background:#4caf50; }
.reset { background:#f44336; }
</style>
</head>

<body>

<div id="topbar">
💰 Total: <span id="totalTop">0 Bs</span>
</div>

<h2>🔥 COMANDAS GO POLLOS RHOSSE 🔥</h2>

<select id="mesero">
<option>Dafne</option>
<option>Mauricio</option>
<option>Padme</option>
<option>Karen</option>
<option>Wilson</option>
<option>Raquel</option>
</select>

<select id="mesa">
<option>Mesa 1</option>
<option>Mesa 2</option>
<option>Mesa 3</option>
<option>Mesa 4</option>
<option>Mesa 5</option>
<option>Recoger</option>
<option>Delivery</option>
</select>

<h3>🍗 Principales</h3>
<div class="grid">
<button class="entero" onclick="add('Pollo Entero',100)">Entero 100</button>
<button class="entero" onclick="add('Medio Pollo',50)">Medio 50</button>
</div>

<h3>🍗 Cuartos</h3>
<div class="grid">
<button class="cuarto" onclick="add('Cuarto A (Pierna+Contra)',25)">Pierna+Contra 25</button>
<button class="cuarto" onclick="add('Cuarto B (Ala+Pecho)',25)">Ala+Pecho 25</button>
</div>

<h3>💰 Económicos</h3>
<div class="grid">
<button class="economico" onclick="add('Pecho',15)">Pecho 15</button>
<button class="economico" onclick="add('Ala',15)">Ala 15</button>
</div>

<h3>🔥 TikTok</h3>
<div class="grid">
<button class="tiktok" onclick="add('Pierna',13)">Pierna 13</button>
<button class="tiktok" onclick="add('Contra',13)">Contra 13</button>
</div>

<h3>🥤 Extras</h3>
<div class="grid">
<button class="extra" onclick="add('Arroz',5)">Arroz 5</button>
<button class="extra" onclick="add('Papas',5)">Papas 5</button>
<button class="extra" onclick="add('Plátano',5)">Plátano 5</button>
<button class="extra" onclick="add('Bebida',10)">Limonada 10</button>
</div>

<div id="detalle">Sin pedidos</div>
<div class="total" id="total">Total: 0 Bs</div>

<h3>💵 Pago</h3>
<div class="grid">
<button onclick="pagar(20)">20 Bs</button>
<button onclick="pagar(50)">50 Bs</button>
<button onclick="pagar(100)">100 Bs</button>
<button onclick="pagar(200)">200 Bs</button>
</div>

<div id="cambio">Cambio: 0 Bs</div>

<div class="floating">
<button class="enviar" onclick="enviar()">📲 ENVIAR PEDIDO</button>
<button class="enviar" onclick="listo()">✅ PEDIDO LISTO</button>
<button class="reset" onclick="resetear()">❌ LIMPIAR</button>
</div>

<script>

let pedido = [];
let total = 0;

function add(nombre, precio){
pedido.push({nombre, precio});
total += precio;
actualizarVista();
}

function actualizarVista(){
let texto = "";
pedido.forEach(p => {
texto += p.nombre + " - " + p.precio + " Bs<br>";
});
if(texto === "") texto = "Sin pedidos";

document.getElementById("detalle").innerHTML = texto;
document.getElementById("total").innerText = "Total: " + total + " Bs";
document.getElementById("totalTop").innerText = total + " Bs";
}

function pagar(monto){
let cambio = monto - total;

if(cambio < 0){
document.getElementById("cambio").innerText = "Falta: " + Math.abs(cambio) + " Bs";
document.getElementById("cambio").style.color = "#ff5252";
}else{
document.getElementById("cambio").innerText = "Cambio: " + cambio + " Bs";
document.getElementById("cambio").style.color = "#00e676";
}
}

function enviar(){
let mesero = document.getElementById("mesero").value;
let mesa = document.getElementById("mesa").value;

let resumen = {};
pedido.forEach(p => {
if(!resumen[p.nombre]){
resumen[p.nombre] = {cantidad:0, precio:p.precio};
}
resumen[p.nombre].cantidad++;
});

let texto = "🔥 PEDIDO NUEVO\n\n";
texto += "Mesero: " + mesero + "\n";
texto += "Mesa: " + mesa + "\n\n";

for(let item in resumen){
let p = resumen[item];
texto += "- " + p.cantidad + " " + item + " (" + (p.cantidad * p.precio) + " Bs)\n";
}

texto += "\nTOTAL: " + total + " Bs";

navigator.vibrate(200);

let audio = new Audio("https://www.soundjay.com/buttons/sounds/button-09.mp3");
audio.play();

window.open("https://wa.me/59172685867?text=" + encodeURIComponent(texto));

resetear();
}

function listo(){
let mesa = document.getElementById("mesa").value;
let texto = "✅ Pedido listo - " + mesa;

navigator.vibrate(200);

window.open("https://wa.me/59172685867?text=" + encodeURIComponent(texto));
}

function resetear(){
pedido = [];
total = 0;
actualizarVista();
document.getElementById("cambio").innerText = "Cambio: 0 Bs";
}

</script>

</body>
</html>
