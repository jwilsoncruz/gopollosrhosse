<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WiFi Go Pollos Rhosse</title>

<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;text-align:center;}
.container{padding:20px;}
h1{color:#ffcc00;}
.oferta{background:#ff0000;padding:12px;border-radius:10px;margin:15px 0;}
input{width:90%;padding:12px;margin:8px 0;border-radius:8px;border:none;}
button{width:95%;padding:15px;margin-top:10px;border:none;border-radius:10px;background:#00c853;color:#fff;font-size:18px;}
.hidden{display:none;}
.clave{font-size:28px;color:#ffcc00;}
#canvas{background:#999;margin:20px auto;display:block;border-radius:10px;}
</style>
</head>

<body>

<!-- REGISTRO -->
<div class="container" id="pantalla1">
<h1>🍗 WiFi Gratis</h1>
<div class="oferta">📶 Accede al WiFi GRATIS<br>🎁 Gana premios en compras desde Bs 15</div>

<input type="text" id="nombre" placeholder="Tu nombre">
<input type="tel" id="telefono" placeholder="Tu WhatsApp">
<input type="date" id="fecha">

<button id="btnContinuar">📲 CONTINUAR</button>
</div>

<!-- WIFI -->
<div class="container hidden" id="pantalla2">
<h1>✅ Conectado</h1>

<div class="oferta">
📶 TU CLAVE WIFI:
<div class="clave" id="clave"></div>
</div>

<button onclick="copiarClave()">📋 COPIAR CLAVE</button>
<button id="btnSeguir">👉 YA COPIÉ / CONTINUAR</button>
</div>

<!-- RASPA -->
<div class="container hidden" id="raspa">
<h1>🎁 Raspa y Gana</h1>

<canvas id="canvas" width="300" height="150"></canvas>

<div class="oferta hidden" id="premioBox">
🎉 PREMIO:
<div class="clave" id="premioTexto"></div>
<p style="color:#ffcc00;">⚠️ Válido en compras desde Bs 15</p>
</div>

<button id="btnPremio" class="hidden">🎁 USAR PREMIO</button>
<button id="segundaBtn" class="hidden">🎁 Segunda oportunidad</button>
</div>

<script>

// SELECTORES
const nombreInput = document.getElementById("nombre");
const telefonoInput = document.getElementById("telefono");
const fechaInput = document.getElementById("fecha");

const pantalla1 = document.getElementById("pantalla1");
const pantalla2 = document.getElementById("pantalla2");
const raspaDiv = document.getElementById("raspa");

const claveDiv = document.getElementById("clave");

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const premioBox = document.getElementById("premioBox");
const premioTexto = document.getElementById("premioTexto");

const btnPremio = document.getElementById("btnPremio");
const segundaBtn = document.getElementById("segundaBtn");
const btnContinuar = document.getElementById("btnContinuar");
const btnSeguir = document.getElementById("btnSeguir");

// VARIABLES
let premio = "";
let intento = 1;
let raspando = false;
let raspadoTotal = 0;
let yaRevelo = false;

// CLAVE WIFI DOMINGO
function generarClave(){
  let hoy = new Date();
  let domingo = new Date(hoy);
  domingo.setDate(hoy.getDate() - hoy.getDay());
  return "POLLOSRHOSSE" + domingo.getDate();
}

// EVENTOS
btnContinuar.addEventListener("click", continuar);
btnPremio.addEventListener("click", usarPremio);
segundaBtn.addEventListener("click", segundaOportunidad);
btnSeguir.addEventListener("click", pasarARaspa);

// REGISTRO
function continuar(){
  const nombre = nombreInput.value.trim();
  const telefono = telefonoInput.value.trim();
  const fecha = fechaInput.value;

  if(!nombre || !telefono || !fecha){
    alert("Completa todo");
    return;
  }

  localStorage.setItem("cliente_nombre", nombre);

  claveDiv.textContent = generarClave();

  pantalla1.classList.add("hidden");
  pantalla2.classList.remove("hidden");
}

// COPIAR CLAVE
function copiarClave(){
  navigator.clipboard.writeText(claveDiv.textContent);
  alert("Clave copiada ✅");
}

// IR A RASPA
function pasarARaspa(){
  intento = 1;
  pantalla2.classList.add("hidden");
  raspaDiv.classList.remove("hidden");
  iniciarRaspa();
}

// PREMIOS
function premioNormal(){
  let r=Math.random();
  if(r<0.5)return "❌ Sigue intentando";
  if(r<0.7)return "🥤 Soda GRATIS (compra mínima Bs 15)";
  if(r<0.85)return "🍟 Papas 50% OFF (compra mínima Bs 15)";
  if(r<0.95)return "🍗 1 Extra platano GRATIS (compra mínima Bs 15)";
  return "🎉 2x1 Complemento (si es tu cumple hoy)";
}

function premioSegunda(){
  let r=Math.random();
  if(r<0.3)return "❌ Sigue intentando";
  if(r<0.6)return "🥤 Soda GRATIS (compra mínima Bs 15)";
  if(r<0.85)return "🍟 Papas 50% OFF (compra mínima Bs 15)";
  return "🍗 1 Extra platano GRATIS (compra mínima Bs 15)";
}

// INICIAR RASPA
function iniciarRaspa(){
  raspadoTotal = 0;
  yaRevelo = false;

  premio = (intento === 1) ? premioNormal() : premioSegunda();

  premioBox.classList.add("hidden");
  btnPremio.classList.add("hidden");
  segundaBtn.classList.add("hidden");

  ctx.globalCompositeOperation="source-over";
  ctx.fillStyle="#999";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="#000";
  ctx.font="20px Arial";
  ctx.fillText("RASPA AQUÍ",90,80);

  ctx.globalCompositeOperation="destination-out";
}

// EVENTOS RASPA
canvas.addEventListener("mousedown",()=>raspando=true);
canvas.addEventListener("mouseup",()=>raspando=false);
canvas.addEventListener("mousemove",raspar);

canvas.addEventListener("touchstart",()=>raspando=true);
canvas.addEventListener("touchend",()=>raspando=false);
canvas.addEventListener("touchmove",rasparTouch);

// RASPAR
function raspar(e){
  if(!raspando || yaRevelo)return;

  ctx.beginPath();
  ctx.arc(e.offsetX,e.offsetY,15,0,Math.PI*2);
  ctx.fill();

  raspadoTotal++;
  if(raspadoTotal>40) mostrarPremio();
}

function rasparTouch(e){
  if(!raspando || yaRevelo)return;

  const rect=canvas.getBoundingClientRect();
  const x=e.touches[0].clientX-rect.left;
  const y=e.touches[0].clientY-rect.top;

  ctx.beginPath();
  ctx.arc(x,y,15,0,Math.PI*2);
  ctx.fill();

  raspadoTotal++;
  if(raspadoTotal>40) mostrarPremio();
}

// MOSTRAR PREMIO
function mostrarPremio(){

  yaRevelo = true;

  premioTexto.textContent = premio;
  premioBox.classList.remove("hidden");

  if(premio.includes("❌") && intento === 1){
    segundaBtn.classList.remove("hidden");
    return;
  }

  if(premio.includes("❌") && intento === 2){
    btnPremio.textContent = "🍗 VER MENÚ";
    btnPremio.classList.remove("hidden");
    return;
  }

  btnPremio.textContent = "🎁 USAR PREMIO";
  btnPremio.classList.remove("hidden");
}

// SEGUNDA OPORTUNIDAD
function segundaOportunidad(){
  intento = 2;
  iniciarRaspa();
}

// WHATSAPP
function usarPremio(){

  const nombre = localStorage.getItem("cliente_nombre");

  let msg = premio.includes("❌")
  ? `Hola 🍗
Soy ${nombre}

No gané premio 😅
👉 Quiero hacer un pedido`
  : `Hola 🍗
Soy ${nombre}

🎁 Me salió: ${premio}
👉 Voy a hacer un pedido (mínimo Bs 15)`;

  window.open(`https://wa.me/59168972863?text=${encodeURIComponent(msg)}`);
}

</script>

</body>
</html>
