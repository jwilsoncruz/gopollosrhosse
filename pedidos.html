<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estado de Pedidos - Go Pollos Rhosse</title>

<style>

body{
margin:0;
background:#0b0b0b;
color:white;
font-family:Arial;
text-align:center;
}

header{
background:#d50000;
padding:20px;
}

.logo{
max-width:180px;
display:block;
margin:auto;
}

h1{
margin-top:10px;
font-size:36px;
}

.panel{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
padding:30px;
}

.columna{
background:#1a1a1a;
border-radius:14px;
padding:20px;
}

.titulo{
font-size:28px;
margin-bottom:20px;
}

.preparando-titulo{
color:#ffd54f;
}

.listo-titulo{
color:#4caf50;
}

.lista{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;
}

.card{
padding:30px;
border-radius:12px;
font-size:36px;
font-weight:bold;
}

.preparando{
background:#ffd54f;
color:black;
}

.listo{
background:#4caf50;
animation:brillar 1s infinite alternate;
}

@keyframes brillar{
from{transform:scale(1)}
to{transform:scale(1.07)}
}

.vacio{
opacity:0.5;
font-size:22px;
margin-top:20px;
}

</style>

</head>

<body>

<header>

<img src="logo.png" class="logo">

<h1>🍗 Estado de Pedidos</h1>

</header>

<div class="panel">

<div class="columna">

<div class="titulo preparando-titulo">
👨‍🍳 PREPARANDO
</div>

<div id="preparando" class="lista"></div>

</div>

<div class="columna">

<div class="titulo listo-titulo">
✅ LISTO
</div>

<div id="listo" class="lista"></div>

</div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbzoZMkmQgnMSgavhk-w1RfvKfnLpp-YkAzEhcbmGyJAVp5YjKl91zAe-3T3F8bMiNdx/exec";

let pedidosAnunciados = [];

function hablar(texto){

const msg = new SpeechSynthesisUtterance(texto);
msg.lang = "es-ES";
msg.volume = 1;
msg.rate = 1;
msg.pitch = 1;

speechSynthesis.speak(msg);

}

function cargar(){

fetch(API+"?accion=obtener")

.then(r=>r.json())

.then(pedidos=>{

let preparandoHTML="";
let listoHTML="";

pedidos.forEach(p=>{

if(p.estado==="Nuevo" || p.estado==="En preparacion"){

preparandoHTML+=`
<div class="card preparando">
${p.fila}
</div>
`;

}

if(p.estado==="Listo"){

listoHTML+=`
<div class="card listo">
${p.fila}
</div>
`;

if(!pedidosAnunciados.includes(p.fila)){

hablar("Pedido número " + p.fila + " listo para recoger");

pedidosAnunciados.push(p.fila);

}

}

});

if(preparandoHTML===""){
preparandoHTML="<div class='vacio'>Sin pedidos</div>";
}

if(listoHTML===""){
listoHTML="<div class='vacio'>Esperando...</div>";
}

document.getElementById("preparando").innerHTML=preparandoHTML;
document.getElementById("listo").innerHTML=listoHTML;

})

.catch(()=>{

document.getElementById("preparando").innerHTML="<div class='vacio'>Error conexión</div>";
document.getElementById("listo").innerHTML="";

});

}

setInterval(cargar,3000);

cargar();

</script>

</body>
</html>
