<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mensajes en Vivo</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f6f4fb;color:#1d1633}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid #e4e0f0;border-radius:14px;padding:14px;margin-bottom:14px}
h1{font-size:1.3rem;margin:0 0 6px}
label{display:block;font-size:.8rem;color:#6b6585;margin:10px 0 4px}
input,textarea,select{width:100%;padding:11px;border-radius:10px;border:1px solid #e4e0f0;font:inherit;background:#fff;color:#1d1633}
input[type=checkbox]{width:auto;transform:scale(1.3)}
input[type=color]{height:42px;padding:2px}
input[type=range]{padding:0}
textarea{min-height:80px;resize:vertical}
button,a.btn{display:inline-block;border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:600;cursor:pointer;background:#7c3aed;color:#fff;text-decoration:none;margin:4px 4px 0 0}
button.pink{background:#ec4899}button.sec{background:#fff;color:#1d1633;border:1px solid #e4e0f0}
.msg{padding:10px 0;border-top:1px solid #e4e0f0}.msg:first-child{border-top:0}
.hint{font-size:.85rem;color:#6b6585}
.err{background:#fee2e2;color:#7f1d1d;padding:12px;border-radius:10px}
.ok{background:#dcfce7;color:#14532d;padding:12px;border-radius:10px;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 10px}
.sec{grid-column:1/-1;font-weight:700;margin-top:12px;padding-top:8px;border-top:1px solid #e4e0f0}
details>summary{cursor:pointer;font-weight:700;font-size:1.05rem}
/* invitados */
body.guest{background:linear-gradient(160deg,var(--c1),var(--c2));min-height:100vh}
.gc{text-align:center}
.gc textarea,.gc input{text-align:left}
.glg{max-height:60px;max-width:60%;object-fit:contain;display:block;margin:0 auto 10px}
.gph{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--c2);display:block;margin:0 auto 10px}
/* pantalla */
body.screen{overflow:hidden;height:100vh;background:#000}
#scr{position:fixed;inset:0;display:flex;flex-direction:column;padding:3vh 3vw;text-align:center;color:var(--tx);font-family:var(--ff);
 background-image:linear-gradient(rgba(0,0,0,var(--ov)),rgba(0,0,0,var(--ov))),var(--bgimg),radial-gradient(circle at 20% 20%,var(--c1),transparent 55%),radial-gradient(circle at 80% 80%,var(--c2),transparent 55%);
 background-color:var(--bg);background-size:cover;background-position:center}
#hdr{flex:none;display:flex;flex-direction:column;align-items:center;gap:.6vh}
#hph{height:13vh;width:13vh;border-radius:50%;object-fit:cover;border:.5vh solid var(--ac);box-shadow:0 0 3vh rgba(0,0,0,.4)}
#htt{font-size:clamp(.9rem,2vw,1.7rem);letter-spacing:.14em;text-transform:uppercase;opacity:.9}
#hn{font-size:clamp(1.6rem,4.6vw,3.8rem);font-weight:700;color:var(--ac);line-height:1.1}
#main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#bub{max-width:90vw;display:flex;gap:3vw;align-items:center;justify-content:center;padding:3.5vh 3.5vw;border-radius:3vh;background:color-mix(in srgb,var(--tx) 9%,transparent);border:1px solid color-mix(in srgb,var(--tx) 22%,transparent);backdrop-filter:blur(6px);transition:opacity .5s,transform .5s}
#bub.out{opacity:0}
#bub.a-zoom.out{transform:scale(.85)}
#bub.a-slide.out{transform:translateX(8vw)}
#bimg{max-height:38vh;max-width:30vw;border-radius:2vh;object-fit:cover}
#bt{font-size:calc(clamp(1.5rem,4.4vw,4.2rem)*var(--sc));line-height:1.2;font-weight:700;word-break:break-word}
#bf{margin-top:.7em;font-size:calc(clamp(1.1rem,2.8vw,2.6rem)*var(--sc));color:var(--ac)}
#lg{position:absolute;max-width:24vw;object-fit:contain}
#lg.p-tl{top:2.5vh;left:2.5vw}#lg.p-tr{top:2.5vh;right:2.5vw}#lg.p-bc{bottom:2vh;left:50%;transform:translateX(-50%)}
#qr{position:absolute;z-index:8;bottom:3vh;background:#fff;color:#1d1633;padding:10px;border-radius:14px;font-weight:700;font-size:clamp(.7rem,1.3vw,1.1rem)}
#qr.q-bl{left:2vw}#qr.q-br{right:2vw}
#qr div{margin:0 auto 6px;display:flex;justify-content:center}
#fs{position:absolute;right:1vw;bottom:1vh;opacity:.6;font-size:.8rem;padding:6px 10px;z-index:8;transition:opacity .4s}
#ann{position:absolute;inset:0;z-index:7;display:none;align-items:center;justify-content:center;padding:6vw;background:rgba(0,0,0,.74);backdrop-filter:blur(10px);font-size:calc(clamp(2rem,7vw,7rem)*var(--sc));font-weight:800;line-height:1.1;color:var(--tx);text-shadow:0 0 4vh var(--c2)}
#wall{display:none;flex:1;align-self:stretch;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:2vh 2vw;padding:1vh 0}
.wc{background:color-mix(in srgb,var(--tx) 9%,transparent);border:1px solid color-mix(in srgb,var(--tx) 22%,transparent);border-radius:2.5vh;padding:2.5vh 2vw;display:flex;flex-direction:column;justify-content:center;overflow:hidden;animation:pop .6s}
.wc .wt{font-size:calc(clamp(1rem,2vw,2rem)*var(--sc));font-weight:700;line-height:1.2;word-break:break-word}
.wc .wf{margin-top:.6em;color:var(--ac);font-size:calc(clamp(.9rem,1.5vw,1.5rem)*var(--sc))}
.wc img{max-height:14vh;border-radius:1.5vh;object-fit:cover;margin-bottom:1vh;align-self:center}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
#cdp{margin-top:.8vh;padding:.7vh 2vw;border-radius:99px;font-size:clamp(1rem,2.2vw,2rem);font-weight:700;font-variant-numeric:tabular-nums;color:var(--tx);background:color-mix(in srgb,var(--tx) 14%,transparent);border:1px solid var(--ac)}
#cdp.soon{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 3vh var(--c2)}}
#cdo{position:absolute;inset:0;z-index:7;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);color:var(--tx);text-align:center;font-family:var(--ff)}
#cdn{font-size:clamp(6rem,32vw,34rem);font-weight:800;line-height:1;text-shadow:0 0 5vh var(--c2)}
#cdl{font-size:clamp(1.8rem,6vw,6rem);font-weight:700;color:var(--ac)}
.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1;margin:0}
.opt{display:block;width:100%;margin:8px 0;text-align:left;font-size:1.05rem}
#kar{margin-top:.6vh;font-size:clamp(.9rem,1.8vw,1.6rem);opacity:.95}
#gm{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;justify-content:center;gap:1.4vh;padding:5vh 8vw;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);color:var(--tx);font-family:var(--ff);text-align:center}
#gq{font-size:calc(clamp(1.6rem,4.6vw,4.4rem)*var(--sc));font-weight:800;margin-bottom:1vh}
.go{position:relative;overflow:hidden;display:flex;justify-content:space-between;gap:2vw;padding:1.6vh 2vw;border-radius:2vh;border:2px solid color-mix(in srgb,var(--tx) 25%,transparent);font-size:clamp(1.1rem,2.6vw,2.4rem);font-weight:700;text-align:left}
.go .gb{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--c1),var(--c2));opacity:.55;transition:width .5s}
.go span{position:relative}
.go.ok{border-color:#22c55e;box-shadow:0 0 3vh #22c55e}
.gs{font-size:clamp(1rem,2vw,1.8rem);opacity:.85;margin-top:1vh}
#gtop{margin-top:2vh;font-size:clamp(1.1rem,2.4vw,2.2rem);line-height:1.5}
#sr{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);color:var(--tx);font-family:var(--ff);text-align:center}
#srt{font-size:clamp(1.4rem,4vw,3.6rem);letter-spacing:.1em;text-transform:uppercase}
#srn{font-size:clamp(2.4rem,10vw,10rem);font-weight:800;color:var(--ac);line-height:1.1;padding:0 4vw;word-break:break-word}
#srp{font-size:clamp(1.2rem,3vw,3rem)}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
</style>
</head>
<body>
<div id="app"></div>
<canvas id="cf"></canvas>
<script>
/* ===== CONFIGURACIÓN DE FIREBASE ===== */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyBd94u8f0grdciEAMy6OFwjQ_G9BFY5a7k",
  authDomain: "mensajes-fiesta.firebaseapp.com",
  databaseURL: "https://mensajes-fiesta-default-rtdb.firebaseio.com",
  projectId: "mensajes-fiesta",
  appId: "1:880537182959:web:11d03ff1c09178a92df11a"
};
/* ====================================== */
/* true = el panel pide correo y contraseña (recomendado). false = sin contraseña. */
var REQUIRE_LOGIN = true;

var $app=document.getElementById('app');
var q=new URLSearchParams(location.search);
var EV=(q.get('e')||'fiesta').replace(/[^a-z0-9_-]/gi,'').toLowerCase()||'fiesta';
var mode=location.hash.replace('#','')||'menu';
var BASE=location.href.split('#')[0].split('?')[0];

function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function ea(s){return esc(s).replace(/"/g,'&quot;')}
function fixImg(u){
  u=(u||'').trim();
  if(!/^https?:\/\//i.test(u))return '';
  var m=u.match(/drive\.google\.com\/file\/d\/([^\/?#]+)/)||u.match(/drive\.google\.com\/(?:open|uc)\?[^#]*id=([^&#]+)/);
  if(m)return 'https://drive.google.com/uc?export=view&id='+m[1];
  return u.replace(/(dropbox\.com\/[^?]*)\?dl=0/,'$1?raw=1');
}

var DEF={c1:'#6d28d9',c2:'#db2777',bg:'#12091f',tx:'#ffffff',ac:'#fbcfe8',bgImg:'',ov:40,logo:'',logoPos:'tr',logoH:11,photo:'',title:'Mensajes para',font:'sans',size:100,anim:'fade',layout:'single',countdown:true,cdBig:true,qr:true,qrPos:'bl',confetti:true};
var PRESETS={
  fiesta:{n:'🎉 Fiesta',c1:'#6d28d9',c2:'#db2777',bg:'#12091f',tx:'#ffffff',ac:'#fbcfe8'},
  dorado:{n:'✨ Elegante dorado',c1:'#b8860b',c2:'#f5d76e',bg:'#0b0b0b',tx:'#fff8e1',ac:'#f5d76e'},
  boda:{n:'💍 Boda',c1:'#f9a8d4',c2:'#fde68a',bg:'#fffaf5',tx:'#4a3b3b',ac:'#be185d'},
  quince:{n:'👑 Quinceañera',c1:'#c026d3',c2:'#f472b6',bg:'#1a0830',tx:'#ffffff',ac:'#f5d0fe'},
  corp:{n:'🏢 Corporativo',c1:'#0ea5e9',c2:'#1d4ed8',bg:'#06122b',tx:'#ffffff',ac:'#7dd3fc'},
  tropical:{n:'🌴 Tropical',c1:'#10b981',c2:'#f59e0b',bg:'#06231b',tx:'#ffffff',ac:'#fde68a'}
};
var PLANTILLAS={
  boda:{n:'💍 Boda',p:[['🎉 Inicio',0],['💃 Vals de los novios',45],['🥂 Brindis',75],['📸 Fotos',105],['🎂 Torta',150],['💐 Lanzamiento del ramo',180],['👋 Despedida',240],['🏁 Cierre',270]]},
  quince:{n:'👑 Quinceañera',p:[['🎉 Inicio',0],['👑 Presentación',30],['💃 Vals',60],['🥂 Brindis',90],['📸 Fotos',120],['🎂 Torta',150],['🔥 Baile sorpresa',180],['👋 Despedida',230],['🏁 Cierre',250]]},
  cumple:{n:'🎂 Cumpleaños',p:[['🎉 Inicio',0],['📸 Fotos',60],['🎂 Torta',90],['🥂 Brindis',100],['👋 Despedida',180],['🏁 Cierre',200]]},
  bautizo:{n:'👶 Bautizo',p:[['🎉 Inicio',0],['📸 Fotos',40],['🎂 Torta',70],['👋 Despedida',120],['🏁 Cierre',140]]}
};
var FONTS={sans:"system-ui,-apple-system,'Segoe UI',Roboto,sans-serif",serif:"Georgia,'Times New Roman',serif",script:"'Brush Script MT','Segoe Script','Lucida Handwriting',cursive",bold:"Impact,'Arial Black',sans-serif"};
function theme(c){return Object.assign({},DEF,(c&&c.theme)||{})}
function applyTheme(el,t){
  var s=el.style,u=fixImg(t.bgImg);
  s.setProperty('--c1',t.c1);s.setProperty('--c2',t.c2);s.setProperty('--bg',t.bg);
  s.setProperty('--tx',t.tx);s.setProperty('--ac',t.ac);
  s.setProperty('--ov',(u?t.ov:0)/100);
  s.setProperty('--sc',(t.size||100)/100);
  s.setProperty('--ff',FONTS[t.font]||FONTS.sans);
  s.setProperty('--bgimg',u?'url("'+u.replace(/"/g,'%22')+'")':'none');
}

if(!FIREBASE_CONFIG.databaseURL){
  $app.innerHTML='<div class="wrap"><div class="card"><h1>Falta conectar Firebase</h1><div class="err">Pega tu configuración de Firebase en el archivo.</div></div></div>';
}else{
  if(mode!=='enviar'){
    firebase.initializeApp(FIREBASE_CONFIG);
    var db=firebase.database();
    var R=db.ref('eventos/'+EV), RM=R.child('mensajes'), RC=R.child('config');
  }
  ({menu:menu,enviar:enviar,panel:gate,pantalla:pantalla}[mode]||menu)();
}

/* ---------- ACCESO DJ ---------- */
function gate(){
  if(!REQUIRE_LOGIN){panel();return}
  firebase.auth().onAuthStateChanged(function(u){if(u)panel();else loginView()});
}
function loginView(){
  $app.innerHTML='<div class="wrap"><div class="card"><h1>🔐 Acceso DJ</h1><p class="hint">Solo el DJ puede entrar al panel.</p>'
  +'<label>Correo</label><input id="em" type="email" autocomplete="username">'
  +'<label>Contraseña</label><input id="pw" type="password" autocomplete="current-password">'
  +'<button id="li" style="width:100%;margin-top:12px">Entrar</button><div id="lr"></div></div></div>';
  var go=function(){
    document.getElementById('lr').innerHTML='';
    firebase.auth().signInWithEmailAndPassword(document.getElementById('em').value.trim(),document.getElementById('pw').value).catch(function(e){
      var m=(e&&e.code==='auth/operation-not-allowed')?'Falta activar “Correo/contraseña” en Firebase → Authentication.':'Correo o contraseña incorrectos.';
      document.getElementById('lr').innerHTML='<div class="err" style="margin-top:10px">'+m+'</div>';
    });
  };
  document.getElementById('li').onclick=go;
  document.getElementById('pw').onkeydown=function(e){if(e.key==='Enter')go()};
}

/* ---------- MENÚ ---------- */
function menu(){
  var l=BASE+'?e='+EV;
  $app.innerHTML='<div class="wrap"><div class="card"><h1>🎉 Mensajes en vivo</h1><p class="hint">Evento: <b>'+esc(EV)+'</b> (cambia con <code>?e=nombre</code> en el enlace)</p>'
  +'<a class="btn" href="'+l+'#panel">🎛️ Panel DJ</a><a class="btn pink" href="'+l+'#pantalla">📺 Pantalla</a><a class="btn sec" href="'+l+'#enviar">✍️ Formulario invitados</a></div></div>';
}

/* ---------- INVITADOS (sin conexión permanente: usa pedidos cortos) ---------- */
function enviar(){
  var DBU=FIREBASE_CONFIG.databaseURL.replace(/\/$/,'')+'/eventos/'+EV;
  function rget(p){return fetch(DBU+'/'+p+'.json').then(function(r){return r.json()})}
  function rsend(m,p,d){return fetch(DBU+'/'+p+'.json',{method:m,body:JSON.stringify(d)}).then(function(r){if(!r.ok)throw new Error('x');return r.json()})}
  var gid=localStorage.getItem('mev_gid');
  if(!gid){gid='g'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);localStorage.setItem('mev_gid',gid)}
  var $=function(i){return document.getElementById(i)};
  rget('config').then(function(c){
    c=c||{};var t=theme(c);
    applyTheme(document.documentElement,t);document.body.className='guest';
    var lg=fixImg(t.logo),ph=fixImg(t.photo),saved=localStorage.getItem('mev_name')||'';
    var head=(lg?'<img class="glg" alt="" src="'+ea(lg)+'" onerror="this.remove()">':'')
      +(ph?'<img class="gph" alt="" src="'+ea(ph)+'" onerror="this.remove()">':'')
      +'<h1>💌 Felicita a '+esc(c.honoree||'nuestro invitado de honor')+'</h1>';
    var tabs=(c.kOn||c.gOn)?'<div class="tabs"><button data-tab="1">💌 Mensaje</button>'+(c.kOn?'<button class="sec" data-tab="2">🎤 Karaoke</button>':'')+(c.gOn?'<button class="sec" data-tab="3">🎮 Juego</button>':'')+'</div>':'';
    var p1=c.closed?'<p class="hint">🔒 Los mensajes ya cerraron. ¡Gracias por participar! 🎉</p>'
      :'<p class="hint">Tu mensaje saldrá en la pantalla grande.</p>'
      +'<label>Tu nombre</label><input id="n" maxlength="30" placeholder="Ej: Tía Rosa" value="'+ea(saved)+'">'
      +'<label>Tu mensaje</label><textarea id="t" maxlength="140" placeholder="¡Feliz cumpleaños!"></textarea>'
      +'<button id="b" class="pink" style="width:100%;margin-top:12px">Enviar 🚀</button><div id="r"></div>';
    var p2=c.kOn?'<div id="p2" style="display:none"><p class="hint">Anótate para cantar 🎤</p><label>Tu nombre</label><input id="kn2" maxlength="30" value="'+ea(saved)+'"><label>Canción (y artista)</label><input id="ks2" maxlength="60" placeholder="Ej: Hotel California – Eagles"><button id="kb" class="pink" style="width:100%;margin-top:12px">Anotarme 🎤</button><div id="kr"></div></div>':'';
    var p3=c.gOn?'<div id="p3" style="display:none"><label>Tu nombre (para el ranking)</label><input id="gn" maxlength="30" value="'+ea(saved)+'"><div id="jq"><p class="hint">Cargando…</p></div></div>':'';
    $app.innerHTML='<div class="wrap"><div class="card gc">'+head+tabs+'<div id="p1">'+p1+'</div>'+p2+p3+'</div></div>';

    if($('b'))$('b').onclick=function(){
      var n=$('n').value.trim(),tx=$('t').value.trim();
      var last=+localStorage.getItem('mev_last')||0;
      if(!tx)return;
      if(Date.now()-last<15000){$('r').innerHTML='<div class="err">Espera unos segundos antes de enviar otro 🙂</div>';return}
      localStorage.setItem('mev_name',n);
      rget('config/closed').then(function(cl){
        if(cl)throw new Error('closed');
        return rsend('POST','mensajes',{name:(n||'Un invitado').slice(0,30),text:tx.slice(0,140),ts:Date.now(),status:'pendiente'});
      }).then(function(){
        localStorage.setItem('mev_last',Date.now());$('t').value='';
        $('r').innerHTML='<div class="ok">¡Mensaje enviado! 🎉 Pronto saldrá en pantalla.</div>';
      }).catch(function(){$('r').innerHTML='<div class="err">No se pudo enviar. Intenta otra vez.</div>'});
    };

    if($('kb'))$('kb').onclick=function(){
      var n=$('kn2').value.trim(),sg=$('ks2').value.trim();
      if(!n||!sg){$('kr').innerHTML='<div class="err">Escribe tu nombre y la canción</div>';return}
      var last=+localStorage.getItem('mev_klast')||0;
      if(Date.now()-last<30000){$('kr').innerHTML='<div class="err">Espera un momento antes de pedir otra 🙂</div>';return}
      localStorage.setItem('mev_name',n);
      rsend('POST','karaoke',{n:n.slice(0,30),song:sg.slice(0,60),estado:'espera',ts:Date.now()}).then(function(){
        localStorage.setItem('mev_klast',Date.now());$('ks2').value='';
        $('kr').innerHTML='<div class="ok">¡Anotado en la fila! 🎤</div>';
      }).catch(function(){$('kr').innerHTML='<div class="err">No se pudo anotar. Intenta otra vez.</div>'});
    };

    var pollT=null;
    function renderJ(j){
      var box=$('jq');if(!box)return;
      if(!j||!j.q){box.innerHTML='<p class="hint">Esperando la siguiente pregunta… 👀</p>';return}
      var opts=Array.isArray(j.opts)?j.opts:Object.keys(j.opts||{}).map(function(k){return j.opts[k]});
      var mine=localStorage.getItem('mev_ans_'+j.id);
      var h='<h2 style="margin:10px 0">'+esc(j.q)+'</h2>';
      if(j.estado==='abierta'&&mine===null){
        h+=opts.map(function(o,i){return '<button class="opt" data-o="'+i+'">'+esc(o)+'</button>'}).join('');
      }else{
        h+='<p class="hint">';
        if(mine!==null)h+='Tu respuesta: <b>'+esc(opts[+mine]||'')+'</b><br>';
        if(j.estado==='abierta')h+='¡Enviada! Mira la pantalla 📺';
        else if(j.estado==='cerrada')h+='Respuestas cerradas ⏱';
        else if(j.estado==='revelada'&&j.correct>=0)h+=(mine!==null&&+mine===j.correct)?'🎉 ¡Correcto! +1 punto':'La correcta era: <b>'+esc(opts[j.correct]||'')+'</b>';
        else h+='Mira los resultados en la pantalla 📺';
        h+='</p>';
      }
      box.innerHTML=h;
    }

        +'<div class="np"><button onclick="window.print()" style="padding:12px 18px;font-size:1rem;cursor:pointer">🖨️ Imprimir / Guardar como PDF</button></div>'

        +'<p>Libro de recuerdos</p><h1>'+esc(c.honoree||'Nuestro evento')+'</h1><p>'+a.length+' mensajes de cariño</p></div>'
        +a.map(function(m){var im=fixImg(m.img);return '<div class="m">'+(im?'<img alt="" src="'+ea(im)+'">':'')+'<div class="t">“'+esc(m.text)+'”</div><div class="f">— '+esc(m.name)+'</div></div>'}).join('')
        +'</body></html>';
        w.document.open();w.document.write(h);w.document.close();
      });
    });
  };
  $('pa').onchange=function(){RC.child('pause').set(this.checked)};
  $('cl').onchange=function(){RC.child('closed').set(this.checked)};
  $('bw').onchange=function(){RC.child('bad').set(this.value)};
  $('x').onclick=function(){if(confirm('¿Borrar todos los mensajes?')){RM.remove();RC.child('now').remove()}};
  $('cp').onclick=function(){
    var i=$('lk');
    if(navigator.clipboard)navigator.clipboard.writeText(i.value);else{i.select();document.execCommand('copy')}
    this.textContent='¡Copiado! ✓';var b=this;setTimeout(function(){b.textContent='Copiar enlace'},1500);
  };

  var RT=RC.child('theme'),tmr={};
  function fill(t){FLD.forEach(function(f){
    if(f[0]==='sec')return;var el=$('f_'+f[0]);
    if(f[1]==='check')el.checked=!!t[f[0]];else el.value=t[f[0]];
  })}
  FLD.forEach(function(f){
    if(f[0]==='sec')return;
    var k=f[0],ty=f[1],el=$('f_'+k);
    el.addEventListener(ty==='range'?'input':'change',function(){
      var v=ty==='check'?el.checked:(ty==='range'?+el.value:el.value.trim());
      clearTimeout(tmr[k]);
      tmr[k]=setTimeout(function(){var o={};o[k]=v;RT.update(o)},ty==='range'?250:0);
    });
  });

  $('mb').onclick=function(){
    var t=$('mt').value.trim();if(!t)return;
    var o={name:$('mn').value.trim()||'Un invitado',text:t,ts:Date.now(),status:'aprobado'};
    var im=fixImg($('mp').value);if(im)o.img=im;
    var r=RM.push(o);
    RC.update({now:r.key,nowTs:Date.now()});
    $('mt').value='';$('mn').value='';$('mp').value='';
  };

  var prevP=null;
  RM.on('value',function(s){
    var p='',o='',pc=0,oc=0,all=[];
    s.forEach(function(c){var v=c.val();v.id=c.key;all.push(v)});
    all.reverse().forEach(function(m){
      var h='<div class="msg"><b>'+(m.img?'📷 ':'')+esc(m.name)+'</b><br>'+esc(m.text)+'<br>';
      if(m.status==='pendiente'){pc++;
        p+=h+'<button data-a="ok" data-id="'+m.id+'">Aprobar</button><button class="pink" data-a="now" data-id="'+m.id+'">Mostrar ahora</button><button class="sec" data-a="no" data-id="'+m.id+'">Rechazar</button></div>';
      }else if(m.status==='aprobado'){oc++;
        o+=h+'<button class="pink" data-a="now" data-id="'+m.id+'">Mostrar ahora</button><button class="sec" data-a="no" data-id="'+m.id+'">Quitar</button></div>';
      }
    });
    $('p').innerHTML=p||'<p class="hint">Nada pendiente.</p>';
    $('ok').innerHTML=o||'<p class="hint">Aún no hay aprobados.</p>';
    $('pc').textContent=pc;$('oc').textContent=oc;
    document.title=(pc?'('+pc+') ':'')+'Panel DJ';
    if($('a').checked)all.forEach(function(m){
      if(m.status==='pendiente'&&!autoDone[m.id]){
        autoDone[m.id]=1;
        var low=(m.name+' '+m.text).toLowerCase();
        var bad=$('bw').value.toLowerCase().split(',').map(function(w){return w.trim()}).filter(Boolean).some(function(w){return low.indexOf(w)>=0});
        if(!bad)RM.child(m.id).update({status:'aprobado'});
      }
    });
    if(prevP!==null&&pc>prevP&&!$('a').checked)beep();
    prevP=pc;
  });

  $app.onclick=function(e){
    var kc=e.target.getAttribute('data-kc');if(kc){karCantar(kc);return}
    var kd=e.target.getAttribute('data-kd');if(kd){R.child('karaoke/'+kd+'/estado').set('hecho');return}
    var kx=e.target.getAttribute('data-kx');if(kx){R.child('karaoke/'+kx).remove();return}
    var tp=e.target.getAttribute('data-t');if(tp){loadTpl(tp);return}
    var sh=e.target.getAttribute('data-s');if(sh){shiftProg(+sh);return}
    var nm=e.target.getAttribute('data-n');if(nm){$('pn').value=nm;$('pn').focus();return}
    var pg=e.target.getAttribute('data-g');if(pg){RC.child('prog/'+pg+'/at').set(Date.now());return}
    var pd=e.target.getAttribute('data-d');if(pd){RC.child('prog/'+pd).remove();return}
    var pr=e.target.getAttribute('data-p');
    if(pr){RT.update({c1:PRESETS[pr].c1,c2:PRESETS[pr].c2,bg:PRESETS[pr].bg,tx:PRESETS[pr].tx,ac:PRESETS[pr].ac}).then(function(){return RC.once('value')}).then(function(s){fill(theme(s.val()))});return}
    var a=e.target.getAttribute('data-a'),id=e.target.getAttribute('data-id');if(!a)return;
    if(a==='all'){RM.once('value').then(function(s){s.forEach(function(c){if(c.val().status==='pendiente')RM.child(c.key).update({status:'aprobado'})})});return}
    if(a==='ok')RM.child(id).update({status:'aprobado'});
    if(a==='no')RM.child(id).update({status:'rechazado'});
    if(a==='now'){RM.child(id).update({status:'aprobado'});RC.update({now:id,nowTs:Date.now()})}
  };
}

/* ---------- PANTALLA ---------- */
function confetti(t){
  var c=document.getElementById('cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  var cols=[t.c1,t.c2,t.ac,'#ffffff','#fde047'],P=[],i;
  for(i=0;i<140;i++)P.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*6,vx:-1.5+Math.random()*3,vy:2+Math.random()*4,rot:Math.random()*6,vr:-.2+Math.random()*.4,col:cols[i%cols.length]});
  var st=Date.now();
  (function f(){
    x.clearRect(0,0,c.width,c.height);
    P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle=p.col;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});
    if(Date.now()-st<3500)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);
  })();
}

function pantalla(){
  document.body.className='screen';
  var $=function(i){return document.getElementById(i)};
  var link=BASE+'?e='+EV+'#enviar';
  $app.innerHTML='<div id="scr"><img id="lg" alt="" style="display:none">'
  +'<div id="hdr"><img id="hph" alt="" style="display:none"><div id="htt"></div><div id="hn"></div><div id="cdp" style="display:none"></div><div id="kar" style="display:none"></div></div>'
  +'<div id="main"><div id="bub" class="a-fade"><div><div id="bt">Escanea el QR y envía tu mensaje 💬</div></div></div><div id="wall"></div></div>'
  +'<div id="ann"></div><div id="gm" style="display:none"></div><div id="sr"><div id="srt"></div><div id="srn"></div><div id="srp"></div></div><div id="cdo"><div id="cdn"></div><div id="cdl"></div></div><div id="qr" class="q-bl"><div id="qc"></div>Escanea y felicita 🎉</div>'
  +'<button id="fs" class="sec">⛶ Pantalla completa</button></div>';
  new QRCode($('qc'),{text:link,width:160,height:160});
  $('fs').onclick=function(){var d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d)};
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(function(){})}catch(e){}
  var hideT;
  function wake(){document.body.style.cursor='';$('fs').style.opacity=.6;clearTimeout(hideT);hideT=setTimeout(function(){document.body.style.cursor='none';$('fs').style.opacity=0},3000)}
  document.onmousemove=wake;wake();

  var msgs=[],cfg={},idx=-1,timer=null,seen=null,lastNow=null,lastAnn=null,lastLy=null,wallPage=0;
  function renderWall(first){
    var list=msgs.slice().reverse();
    if(first){list=list.filter(function(m){return m.id!==first.id});list.unshift(first)}
    var pages=Math.max(1,Math.ceil(list.length/6));wallPage=wallPage%pages;
    var sl=list.slice(wallPage*6,wallPage*6+6);
    $('wall').innerHTML=sl.length?sl.map(function(m){
      var im=fixImg(m.img);
      return '<div class="wc">'+(im?'<img alt="" src="'+ea(im)+'" onerror="this.remove()">':'')+'<div class="wt">“'+esc(m.text)+'”</div><div class="wf">— '+esc(m.name)+'</div></div>';
    }).join(''):'<div class="wc" style="grid-column:1/-1;grid-row:1/-1"><div class="wt">Escanea el QR y envía tu mensaje 💬</div></div>';
  }

  function paint(){
    var t=theme(cfg);
    applyTheme($('scr'),t);
    $('htt').textContent=t.title;
    $('hn').textContent=cfg.honoree||'🎉';
    var ph=fixImg(t.photo),hp=$('hph');
    if(ph){if(hp.getAttribute('src')!==ph)hp.src=ph;hp.style.display=''}else hp.style.display='none';
    hp.onerror=function(){this.style.display='none'};
    var lg=fixImg(t.logo),l=$('lg');
    if(lg){if(l.getAttribute('src')!==lg)l.src=lg;l.style.display='';l.style.height=t.logoH+'vh';l.className='p-'+t.logoPos}else l.style.display='none';
    l.onerror=function(){this.style.display='none'};
    var qr=$('qr');qr.style.display=t.qr?'':'none';qr.className='q-'+t.qrPos;
    var ly=(t.layout==='wall');
    $('bub').style.display=ly?'none':'';$('wall').style.display=ly?'grid':'none';
    if(ly!==lastLy){lastLy=ly;if(ly)renderWall();else if(msgs[idx])show(msgs[idx],false)}
  }
  function show(m,isNew){
    var t=theme(cfg),b=$('bub');
    if(t.layout==='wall'){wallPage=0;renderWall(m);if(isNew&&t.confetti)confetti(t);clearTimeout(timer);timer=setTimeout(next,(cfg.secs||12)*1000);return}
    b.className='a-'+t.anim+' out';
    setTimeout(function(){
      var im=fixImg(m.img);
      b.innerHTML=(im?'<img id="bimg" alt="" src="'+ea(im)+'" onerror="this.remove()">':'')
        +'<div><div id="bt">“'+esc(m.text)+'”</div><div id="bf">— '+esc(m.name)+' 💜</div></div>';
      b.className='a-'+t.anim;
    },450);
    if(isNew&&t.confetti)confetti(t);
    clearTimeout(timer);timer=setTimeout(next,(cfg.secs||12)*1000);
  }
  function next(){
    if(cfg.pause||!msgs.length){timer=setTimeout(next,2500);return}
    if(theme(cfg).layout==='wall'){wallPage++;renderWall();timer=setTimeout(next,(cfg.secs||12)*1000);return}
    idx=(idx+1)%msgs.length;show(msgs[idx],false);
  }
  var lastSort=null,sorTimer=null;
  R.child('sorteo').on('value',function(s){
    var d=s.val(),o=$('sr');
    if(lastSort===null){lastSort=d?d.ts:0;return}
    if(!d){o.style.display='none';clearTimeout(sorTimer);return}
    if(d.ts===lastSort)return;
    lastSort=d.ts;clearTimeout(sorTimer);
    o.style.display='flex';$('srt').textContent='🎰 Sorteo';$('srp').textContent=d.premio||'';
    var names=(d.nombres&&d.nombres.length)?d.nombres:[d.ganador],i=0;
    (function spin(){
      if(i<28){$('srn').textContent=names[i%names.length];i++;sorTimer=setTimeout(spin,60+i*i*0.5)}
      else{
        $('srn').textContent='🏆 '+d.ganador;$('srt').textContent='¡Tenemos ganador!';
        if(theme(cfg).confetti)confetti(theme(cfg));
        sorTimer=setTimeout(function(){o.style.display='none'},20000);
      }
    })();
  });
  R.child('karaoke').on('value',function(s){
    var a=[];s.forEach(function(c){var v=c.val();v.id=c.key;a.push(v)});
    a.sort(function(x,y){return x.ts-y.ts});
    var now=a.filter(function(k){return k.estado==='cantando'})[0],nx=a.filter(function(k){return k.estado==='espera'})[0],k=$('kar');
    if(!now&&!nx){k.style.display='none';return}
    k.style.display='';
    k.innerHTML=(now?'🎤 Ahora: <b>'+esc(now.n)+'</b> · '+esc(now.song):'')+(now&&nx?' &nbsp;|&nbsp; ':'')+(nx?'⏭ Sigue: <b>'+esc(nx.n)+'</b> · '+esc(nx.song):'');
  });
  var curJ=null,rOff=null,rData={},pData={};
  function drawJ(){
    var j=curJ,g=$('gm');
    if(!j||(!j.q&&j.estado!=='ranking')){g.style.display='none';return}
    var cnt=[0,0,0,0],tot=0;
    Object.keys(rData).forEach(function(k){var o=rData[k].o;if(o>=0&&o<4){cnt[o]++;tot++}});
    var top=Object.keys(pData).map(function(k){return pData[k]}).sort(function(a,b){return b.p-a.p}).slice(0,5);
    var topH=top.length?'<div id="gtop"><b>🏅 Ranking</b>'+top.map(function(t,i){return '<div>'+(i+1)+'. '+esc(t.n)+' — '+t.p+'</div>'}).join('')+'</div>':'';
    var h='';
    if(j.estado==='ranking')h='<div id="gq">🏅 Ranking de la trivia</div>'+(topH||'<div class="gs">Aún no hay puntajes</div>');
    else{
      var opts=Array.isArray(j.opts)?j.opts:Object.keys(j.opts||{}).map(function(k){return j.opts[k]});
      h='<div id="gq">'+esc(j.q)+'</div>'+opts.map(function(op,i){
        var pc=tot?Math.round(cnt[i]*100/tot):0,ok=(j.estado==='revelada'&&j.correct===i);
        return '<div class="go'+(ok?' ok':'')+'"><div class="gb" style="width:'+pc+'%"></div><span>'+esc(op)+'</span><span>'+cnt[i]+' · '+pc+'%</span></div>';
      }).join('')
      +(j.estado==='abierta'?'<div class="gs">📱 Responde desde tu celular con el QR · '+tot+' respuestas</div>':(j.estado==='cerrada'?'<div class="gs">⏱ Respuestas cerradas</div>':''))
      +((j.estado==='revelada'&&j.correct>=0)?topH:'');
    }
    g.innerHTML=h;g.style.display='flex';
  }
  R.child('juego').on('value',function(s){
    var j=s.val();
    if(rOff){rOff();rOff=null}
    rData={};curJ=j;
    if(j&&j.id){var ref=R.child('respuestas/'+j.id);var cb=ref.on('value',function(rs){rData=rs.val()||{};drawJ()});rOff=function(){ref.off('value',cb)}}
    drawJ();
  });
  R.child('puntos').on('value',function(s){pData=s.val()||{};drawJ()});
  var celebrated={},firstTick=true;
  function fmt(ms){var s=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=function(n){return n<10?'0'+n:''+n};return (h?h+':':'')+p(m)+':'+p(x)}
  function tick(){
    var t=theme(cfg),now=Date.now(),P=cfg.prog||{};
    var items=Object.keys(P).map(function(k){return {id:k,name:P[k].name,at:P[k].at}}).sort(function(a,b){return a.at-b.at});
    var cel=null,nxt=null;
    items.forEach(function(it){if(it.at<=now&&now-it.at<20000)cel=it;if(!nxt&&it.at>now)nxt=it});
    var pill=$('cdp'),o=$('cdo'),n=$('cdn');
    if(t.countdown&&nxt){pill.style.display='';pill.textContent=nxt.name+' en '+fmt(nxt.at-now);pill.className=(nxt.at-now<=60000)?'soon':''}else pill.style.display='none';
    if(cel){
      n.style.fontSize='clamp(3rem,13vw,13rem)';n.textContent='¡AHORA!';$('cdl').textContent=cel.name;o.style.display='flex';
      if(!celebrated[cel.id]){celebrated[cel.id]=1;if(!firstTick&&t.confetti)confetti(t)}
    }else if(t.cdBig&&nxt&&nxt.at-now<=10000){
      n.style.fontSize='';n.textContent=Math.ceil((nxt.at-now)/1000);$('cdl').textContent=nxt.name;o.style.display='flex';
    }else o.style.display='none';
    firstTick=false;
  }
  setInterval(tick,250);
  RC.on('value',function(s){
    var first=(lastNow===null);
    cfg=s.val()||{};paint();
    var an=cfg.ann,ae=$('ann');
    if(an&&an.text){
      ae.textContent=an.text;ae.style.display='flex';
      if(an.ts!==lastAnn){lastAnn=an.ts;if(!first&&theme(cfg).confetti)confetti(theme(cfg))}
    }else{ae.style.display='none';lastAnn=null}
    if(first){lastNow=cfg.nowTs||0;return}
    if(cfg.now&&cfg.nowTs&&cfg.nowTs!==lastNow){
      lastNow=cfg.nowTs;
      var i=msgs.findIndex(function(m){return m.id===cfg.now});
      if(i>=0){idx=i;show(msgs[i],true)}
    }
  });
  RM.on('value',function(s){
    msgs=[];s.forEach(function(c){var v=c.val();v.id=c.key;if(v.status==='aprobado')msgs.push(v)});
    msgs.sort(function(a,b){return a.ts-b.ts});
    if(seen===null){seen={};msgs.forEach(function(m){seen[m.id]=1});if(msgs.length){idx=msgs.length-1;show(msgs[idx],false)}return}
    var fresh=msgs.filter(function(m){return !seen[m.id]});
    msgs.forEach(function(m){seen[m.id]=1});
    if(fresh.length){var m=fresh[fresh.length-1];idx=msgs.findIndex(function(x){return x.id===m.id});show(m,true)}
  });
}
