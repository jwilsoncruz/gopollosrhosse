<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Georgia,'Times New Roman',serif;background:#eeece8;color:#26231f;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid #dcd8d0;border-radius:6px;padding:16px;margin-bottom:14px}
h1{font-size:1.4rem;margin:0 0 8px;font-weight:600}
label{display:block;font-size:.85rem;color:#6a645a;margin:10px 0 4px}
input,textarea,select{width:100%;padding:11px;border-radius:5px;border:1px solid #cfcac0;font:inherit;background:#fff;color:#26231f}
input[type=checkbox]{width:auto;transform:scale(1.3)}
input[type=color]{height:42px;padding:2px}
input[type=range]{padding:0}
textarea{min-height:90px;resize:vertical}
button,a.btn{display:inline-block;border:0;border-radius:5px;padding:11px 15px;font:inherit;font-weight:600;cursor:pointer;background:#3b4a5c;color:#fff;text-decoration:none;margin:4px 4px 0 0}
button.gold{background:#8a6a2f}button.sec{background:#fff;color:#26231f;border:1px solid #cfcac0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #8a6a2f;outline-offset:1px}
.msg{padding:10px 0;border-top:1px solid #e6e2da}.msg:first-child{border-top:0}
.hint{font-size:.88rem;color:#6a645a}
.err{background:#f6dcd8;color:#6b1d12;padding:12px;border-radius:5px;margin-top:10px}
.ok{background:#e1ecd9;color:#25431a;padding:12px;border-radius:5px;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 10px}
.sec{grid-column:1/-1;font-weight:700;margin-top:12px;padding-top:8px;border-top:1px solid #e6e2da}
details>summary{cursor:pointer;font-weight:700;font-size:1.05rem}
/* invitados */
body.guest{background:linear-gradient(170deg,var(--c1),var(--c2));min-height:100vh}
.gc{text-align:center}
.gc textarea,.gc input{text-align:left}
.glg{max-height:56px;max-width:60%;object-fit:contain;display:block;margin:0 auto 12px}
.gph{width:110px;height:136px;border-radius:55px 55px 6px 6px;object-fit:cover;border:2px solid var(--ac);display:block;margin:0 auto 12px}
.gd{color:#6a645a;margin:-4px 0 10px}
.glive{margin:6px 0 14px}.glive iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:6px;background:#000}
/* pantalla */
body.screen{overflow:hidden;height:100vh;background:#000}
#scr{position:fixed;inset:0;display:flex;flex-direction:column;padding:3vh 3vw;text-align:center;color:var(--tx);font-family:var(--ff);
 background-image:linear-gradient(rgba(0,0,0,var(--ov)),rgba(0,0,0,var(--ov))),var(--bgimg),radial-gradient(circle at 50% 0%,var(--c2),transparent 65%),radial-gradient(circle at 50% 110%,var(--c1),transparent 60%);
 background-color:var(--bg);background-size:cover;background-position:center}
#hdr{flex:none;display:flex;flex-direction:column;align-items:center;gap:.5vh}
#hph{height:20vh;aspect-ratio:4/5;border-radius:10vh 10vh 1vh 1vh;object-fit:cover;border:.35vh solid var(--ac);box-shadow:0 0 4vh rgba(0,0,0,.45)}
#htt{font-size:clamp(.9rem,1.8vw,1.5rem);letter-spacing:.12em;opacity:.85;font-style:italic}
#hn{font-size:clamp(1.8rem,4.6vw,4rem);font-weight:600;color:var(--ac);line-height:1.1}
#hd{font-size:clamp(1rem,2vw,1.7rem);opacity:.9}
#hq{font-size:clamp(.9rem,1.7vw,1.4rem);font-style:italic;opacity:.8;max-width:70vw}
#vel{font-size:clamp(.9rem,1.6vw,1.4rem);opacity:.9}
#main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#bub{max-width:88vw;display:flex;gap:3vw;align-items:center;justify-content:center;padding:3.5vh 4vw;border-radius:1vh;background:color-mix(in srgb,var(--tx) 8%,transparent);border-left:.5vh solid var(--ac);transition:opacity .9s,transform .9s}
#bub.out{opacity:0}
#bub.a-rise.out{transform:translateY(3vh)}
#bimg{max-height:36vh;max-width:30vw;border-radius:1vh;object-fit:cover}
#bt{font-size:calc(clamp(1.4rem,3.8vw,3.6rem)*var(--sc));line-height:1.3;font-style:italic;word-break:break-word}
#bf{margin-top:.7em;font-size:calc(clamp(1.1rem,2.5vw,2.3rem)*var(--sc));color:var(--ac)}
#lg{position:absolute;max-width:24vw;object-fit:contain}
#lg.p-tl{top:2.5vh;left:2.5vw}#lg.p-tr{top:2.5vh;right:2.5vw}#lg.p-bc{bottom:2vh;left:50%;transform:translateX(-50%)}
#qr{position:absolute;z-index:8;bottom:3vh;background:#fff;color:#26231f;padding:10px;border-radius:8px;font-size:clamp(.7rem,1.2vw,1rem)}
#qr.q-bl{left:2vw}#qr.q-br{right:2vw}
#qr div{margin:0 auto 6px;display:flex;justify-content:center}
#fs{position:absolute;right:1vw;bottom:1vh;opacity:.6;font-size:.8rem;padding:6px 10px;z-index:8;transition:opacity .4s}
#ann{position:absolute;inset:0;z-index:7;display:none;align-items:center;justify-content:center;padding:6vw;background:rgba(0,0,0,.8);font-size:calc(clamp(1.8rem,6vw,5.5rem)*var(--sc));line-height:1.2;color:var(--tx)}
#wall{display:none;flex:1;align-self:stretch;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:2vh 2vw;padding:1vh 0}
.wc{background:color-mix(in srgb,var(--tx) 8%,transparent);border-left:.4vh solid var(--ac);border-radius:.8vh;padding:2.5vh 2vw;display:flex;flex-direction:column;justify-content:center;overflow:hidden;animation:fin 1s}
.wc .wt{font-size:calc(clamp(1rem,1.9vw,1.9rem)*var(--sc));font-style:italic;line-height:1.25;word-break:break-word}
.wc .wf{margin-top:.6em;color:var(--ac);font-size:calc(clamp(.9rem,1.4vw,1.4rem)*var(--sc))}
.wc img{max-height:14vh;border-radius:.8vh;object-fit:cover;margin-bottom:1vh;align-self:center}
@keyframes fin{from{opacity:0}to{opacity:1}}
#cdp{margin-top:.6vh;padding:.7vh 2vw;border-radius:99px;font-size:clamp(1rem,2vw,1.8rem);font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--tx) 12%,transparent);border:1px solid var(--ac)}
#cdo{position:absolute;inset:0;z-index:7;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.85);color:var(--tx);font-family:var(--ff);padding:4vw}
#cdn{font-size:clamp(2rem,7vw,7rem);font-style:italic}
#cdl{font-size:clamp(2.2rem,9vw,9rem);font-weight:600;color:var(--ac);line-height:1.1}
.tabs{display:flex;gap:6px;margin:12px 0}
#main{position:relative}
#lv{display:none;width:100%;height:100%;align-items:center;justify-content:center}
#lv iframe{height:100%;max-width:100%;aspect-ratio:16/9;border:0;border-radius:1vh;background:#000}
#scr.live #lv{display:flex}
#scr.live #wall{display:none!important}
#scr.live #hph{height:9vh}
#scr.live #hq{display:none}
#scr.live #bub{position:absolute;left:0;right:0;bottom:1.5vh;margin:0 auto;width:max-content;max-width:70vw;padding:1.5vh 2vw;background:rgba(0,0,0,.72)}
#scr.live #bimg{display:none}
#scr.live #bt{font-size:calc(clamp(1rem,2.2vw,2.2rem)*var(--sc))}
#scr.live #bf{font-size:calc(clamp(.9rem,1.5vw,1.5rem)*var(--sc))}
</style>

<script>

var $app=document.getElementById('app');
var q=new URLSearchParams(location.search);
var EV=(q.get('e')||'servicio').replace(/[^a-z0-9_-]/gi,'').toLowerCase()||'servicio';
var mode=location.hash.replace('#','')||'menu';

function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function ea(s){return esc(s).replace(/"/g,'&quot;')}
function fixImg(u){
  u=(u||'').trim();
  if(!/^https?:\/\//i.test(u))return '';
  var m=u.match(/drive\.google\.com\/file\/d\/([^\/?#]+)/)||u.match(/drive\.google\.com\/(?:open|uc)\?[^#]*id=([^&#]+)/);
  if(m)return 'https://drive.google.com/uc?export=view&id='+m[1];
  return u.replace(/(dropbox\.com\/[^?]*)\?dl=0/,'$1?raw=1');
}

function liveEmbed(u,screen){
  u=(u||'').trim();
  var fr=u.match(/<iframe[^>]*\ssrc=["']([^"']+)["']/i);if(fr)u=fr[1];
  if(/^\/\//.test(u))u='https:'+u;
  u=u.replace(/^http:\/\//i,'https://');
  if(!/^https:\/\//i.test(u)&&/^[\w.-]+\.[a-z]{2,}\//i.test(u))u='https://'+u;
  if(!/^https:\/\//i.test(u))return '';
  var m=u.match(/(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|live\/|embed\/|shorts\/|video\/)|youtu\.be\/)([\w-]{6,})/);
  if(m)return 'https://www.youtube.com/embed/'+m[1]+'?rel=0&playsinline=1'+(screen?'&autoplay=1&mute=1':'');
  m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if(m)return 'https://player.vimeo.com/video/'+m[1]+(screen?'?autoplay=1&muted=1':'');
  if(/facebook\.com|fb\.watch/i.test(u))return 'https://www.facebook.com/plugins/video.php?show_text=false&href='+encodeURIComponent(u)+(screen?'&autoplay=true&mute=true':'');
  return '';
}
var DEF={c1:'#243447',c2:'#4a5568',bg:'#0f1722',tx:'#f5f1e8',ac:'#e3c78a',bgImg:'',ov:45,logo:'',logoPos:'tr',logoH:10,photo:'',title:'En memoria de',font:'serif',size:100,anim:'fade',layout:'single',countdown:true,cdBig:true,qr:true,qrPos:'bl',candles:true};
var PRESETS={
  sobrio:{n:'🕊️ Sobrio',c1:'#243447',c2:'#4a5568',bg:'#0f1722',tx:'#f5f1e8',ac:'#e3c78a'},
  blanco:{n:'🤍 Blanco y paz',c1:'#e8eef4',c2:'#cbd5e1',bg:'#f8f6f1',tx:'#2b2f36',ac:'#6b5a2e'},
  vino:{n:'🍷 Vino',c1:'#4a1626',c2:'#7a2a3c',bg:'#1c0a10',tx:'#f7ece6',ac:'#e8c4a0'},
  bosque:{n:'🌿 Bosque',c1:'#1f3a2e',c2:'#3d5a47',bg:'#0c1a14',tx:'#eef3ea',ac:'#c9d9a8'},
  noche:{n:'🌙 Azul noche',c1:'#0f2a4a',c2:'#26456e',bg:'#050d1a',tx:'#eaf1fa',ac:'#9fc3ee'},
  sepia:{n:'📜 Sepia',c1:'#5a4630',c2:'#8a6f4d',bg:'#241a10',tx:'#f6ecd9',ac:'#e7c98f'}
};
var PLANTILLAS={
  velorio:{n:'🕯️ Velatorio y sepelio',p:[['🕯️ Inicio del velatorio',0],['📿 Oración / Rosario',120],['⛪ Misa de cuerpo presente',240],['🚗 Salida del cortejo',300],['🌹 Sepelio',360]]},
  cremacion:{n:'🕊️ Cremación',p:[['🕯️ Inicio de la despedida',0],['🎙️ Palabras de la familia',60],['📿 Responso',90],['🕊️ Cremación',120]]},
  misa:{n:'⛪ Misa / Responso',p:[['🕯️ Recepción',0],['⛪ Misa',30],['🎙️ Palabras de despedida',90],['🤝 Condolencias',110]]},
  aniversario:{n:'🌹 Misa de recuerdo',p:[['🕯️ Recepción',0],['⛪ Misa en su memoria',30],['🎙️ Palabras de la familia',90],['🍽️ Compartir',110]]}
};
var FONTS={serif:"Georgia,'Times New Roman',serif",sans:"system-ui,-apple-system,'Segoe UI',Roboto,sans-serif",script:"'Brush Script MT','Segoe Script','Lucida Handwriting',cursive",classic:"'Palatino Linotype',Palatino,'Book Antiqua',serif"};
function theme(c){return Object.assign({},DEF,(c&&c.theme)||{})}
function applyTheme(el,t){
  var s=el.style,u=fixImg(t.bgImg);
  s.setProperty('--c1',t.c1);s.setProperty('--c2',t.c2);s.setProperty('--bg',t.bg);
  s.setProperty('--tx',t.tx);s.setProperty('--ac',t.ac);
  s.setProperty('--ov',(u?t.ov:0)/100);
  s.setProperty('--sc',(t.size||100)/100);
  s.setProperty('--ff',FONTS[t.font]||FONTS.serif);
  s.setProperty('--bgimg',u?'url("'+u.replace(/"/g,'%22')+'")':'none');
}

if(!FIREBASE_CONFIG.databaseURL){
  $app.innerHTML='<div class="wrap"><div class="card"><h1>Falta conectar Firebase</h1><div class="err">Pega tu configuración de Firebase en el archivo.</div></div></div>';
}else{
  if(mode!=='enviar'){
    firebase.initializeApp(FIREBASE_CONFIG);
    var db=firebase.database();
    var R=db.ref(ROOT+'/'+EV), RM=R.child('mensajes'), RC=R.child('config'), RV=R.child('velas');
  }
  ({menu:menu,enviar:enviar,panel:gate,pantalla:pantalla}[mode]||menu)();
}

/* ---------- ACCESO ---------- */
function gate(){
  if(!REQUIRE_LOGIN){panel();return}
  firebase.auth().onAuthStateChanged(function(u){if(u)panel();else loginView()});
}
function loginView(){
  $app.innerHTML='<div class="wrap"><div class="card"><h1>🔐 Acceso al panel</h1><p class="hint">Solo la funeraria o la familia pueden entrar.</p>'
  +'<label>Correo</label><input id="em" type="email" autocomplete="username">'
  +'<label>Contraseña</label><input id="pw" type="password" autocomplete="current-password">'
  +'<button id="li" style="width:100%;margin-top:12px">Entrar</button><div id="lr"></div></div></div>';
  var go=function(){
    document.getElementById('lr').innerHTML='';
    firebase.auth().signInWithEmailAndPassword(document.getElementById('em').value.trim(),document.getElementById('pw').value).catch(function(e){
      var m=(e&&e.code==='auth/operation-not-allowed')?'Falta activar “Correo/contraseña” en Firebase → Authentication.':'Correo o contraseña incorrectos.';
      document.getElementById('lr').innerHTML='<div class="err">'+m+'</div>';
    });
  };
  document.getElementById('li').onclick=go;
  document.getElementById('pw').onkeydown=function(e){if(e.key==='Enter')go()};
}

/* ---------- MENÚ ---------- */
function menu(){
  var l=BASE+'?e='+EV;
  $app.innerHTML='<div class="wrap"><div class="card"><h1>🕊️ Homenaje en vida</h1><p class="hint">Servicio: <b>'+esc(EV)+'</b> (cambia con <code>?e=nombre</code> en el enlace)</p>'
  +'<a class="btn" href="'+l+'#panel">🎛️ Panel</a><a class="btn gold" href="'+l+'#pantalla">📺 Pantalla</a><a class="btn sec" href="'+l+'#enviar">✍️ Formulario para asistentes</a></div></div>';
}

/* ---------- ASISTENTES (pedidos cortos, sin conexión permanente) ---------- */
function enviar(){
  var DBU=FIREBASE_CONFIG.databaseURL.replace(/\/$/,'')+'/'+ROOT+'/'+EV;
  function rget(p){return fetch(DBU+'/'+p+'.json').then(function(r){return r.json()})}
  function rsend(m,p,d){return fetch(DBU+'/'+p+'.json',{method:m,body:JSON.stringify(d)}).then(function(r){if(!r.ok)throw new Error('x');return r.json()})}
  var $=function(i){return document.getElementById(i)};
  rget('config').then(function(c){
    c=c||{};var t=theme(c);
    applyTheme(document.documentElement,t);document.body.className='guest';
    var lg=fixImg(t.logo),ph=fixImg(t.photo),saved=localStorage.getItem('mev_name')||'';
    var head=(lg?'<img class="glg" alt="" src="'+ea(lg)+'" onerror="this.remove()">':'')
      +(ph?'<img class="gph" alt="" src="'+ea(ph)+'" onerror="this.remove()">':'')
      +'<h1>Palabras para '+esc(c.honoree||'nuestro ser querido')+'</h1>'
      +(c.dates?'<p class="gd">'+esc(c.dates)+'</p>':'');
    var body=c.closed?'<p class="hint">Los mensajes ya cerraron. Gracias por acompañarnos.</p>'
      :'<p class="hint">Tu mensaje de condolencia o recuerdo se mostrará en la pantalla.</p>'
      +'<label>Tu nombre</label><input id="n" maxlength="30" placeholder="Ej: Familia Pérez" value="'+ea(saved)+'">'
      +'<label>Tu mensaje</label><textarea id="t" maxlength="200" placeholder="Siempre te recordaremos…"></textarea>'
      +'<button id="b" class="gold" style="width:100%;margin-top:12px">Enviar mensaje</button><div id="r"></div>'
      +(t.candles?'<hr style="border:0;border-top:1px solid #e6e2da;margin:18px 0"><p class="hint">Enciende una vela en su memoria</p><button id="v" class="sec" style="width:100%">🕯️ Encender una vela</button><div id="vr"></div>':'');
    $app.innerHTML='<div class="wrap"><div class="card gc">'+head+'<div id="glv" class="glive"></div>'+body+'</div></div>';
    var lastLive='';
    function drawLive(cc){
      var b=$('glv');if(!b)return;
      var src=(cc.liveOn&&cc.liveG!==false)?liveEmbed(cc.live,false):'';
      if(src===lastLive)return;lastLive=src;
      b.innerHTML=src?'<p class="hint">Transmisión en vivo</p><iframe src="'+ea(src)+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>':'';
    }
    drawLive(c);
    setInterval(function(){if(document.hidden)return;rget('config').then(function(cc){if(cc)drawLive(cc)}).catch(function(){})},20000);

    if($('b'))$('b').onclick=function(){
      var n=$('n').value.trim(),tx=$('t').value.trim();
      var last=+localStorage.getItem('mev_last')||0;
      if(!tx)return;
      if(Date.now()-last<15000){$('r').innerHTML='<div class="err">Espera unos segundos antes de enviar otro.</div>';return}
      localStorage.setItem('mev_name',n);
      rget('config/closed').then(function(cl){
        if(cl)throw new Error('closed');
        return rsend('POST','mensajes',{name:(n||'Un familiar o amigo').slice(0,30),text:tx.slice(0,200),ts:Date.now(),status:'pendiente'});
      }).then(function(){
        localStorage.setItem('mev_last',Date.now());$('t').value='';
        $('r').innerHTML='<div class="ok">Mensaje enviado. Gracias por acompañarnos.</div>';
      }).catch(function(){$('r').innerHTML='<div class="err">No se pudo enviar. Intenta otra vez.</div>'});
    };
    if($('v'))$('v').onclick=function(){
      if(localStorage.getItem('mev_vela_'+EV)){$('vr').innerHTML='<div class="ok">Ya encendiste tu vela. 🕯️</div>';return}
      var n=($('n')&&$('n').value.trim())||'';
      rsend('POST','velas',{n:n.slice(0,30),ts:Date.now()}).then(function(){
        localStorage.setItem('mev_vela_'+EV,'1');
        $('vr').innerHTML='<div class="ok">Tu vela está encendida. 🕯️</div>';
      }).catch(function(){$('vr').innerHTML='<div class="err">No se pudo encender. Intenta otra vez.</div>'});
    };
  }).catch(function(){$app.innerHTML='<div class="wrap"><div class="card"><div class="err">No se pudo cargar. Revisa tu conexión e intenta otra vez.</div></div></div>'});
}

  var msgs=[],cfg={},idx=-1,timer=null,seen=null,lastNow=null,lastLy=null,wallPage=0,nVel=0,lastLv='';
  function isLive(){return !!(cfg.liveOn&&cfg.liveS!==false&&liveEmbed(cfg.live,true))}
  function fitLive(){var m=$('main'),f=$('lv').firstChild;if(!f||!f.style)return;var W=Math.min(m.clientWidth,m.clientHeight*16/9);f.style.width=W+'px';f.style.height=(W*9/16)+'px'}
  window.addEventListener('resize',fitLive);
  function renderWall(first){
    var list=msgs.slice().reverse();
    if(first){list=list.filter(function(m){return m.id!==first.id});list.unshift(first)}
    var pages=Math.max(1,Math.ceil(list.length/6));wallPage=wallPage%pages;
    var sl=list.slice(wallPage*6,wallPage*6+6);
    $('wall').innerHTML=sl.length?sl.map(function(m){
      var im=fixImg(m.img);
      return '<div class="wc">'+(im?'<img alt="" src="'+ea(im)+'" onerror="this.remove()">':'')+'<div class="wt">“'+esc(m.text)+'”</div><div class="wf">— '+esc(m.name)+'</div></div>';
    }).join(''):'<div class="wc" style="grid-column:1/-1;grid-row:1/-1"><div class="wt">Escanea el código QR para dejar unas palabras en su memoria</div></div>';
  }
  function drawVel(){
    var t=theme(cfg),v=$('vel');
    if(t.candles&&nVel>0){v.style.display='';v.textContent='🕯️ '+nVel+(nVel===1?' vela encendida':' velas encendidas')}else v.style.display='none';
  }
  function paint(){
    var t=theme(cfg);
    applyTheme($('scr'),t);
    $('htt').textContent=t.title;
    $('hn').textContent=cfg.honoree||'🕊️';
    $('hd').textContent=cfg.dates||'';$('hq').textContent=cfg.quote?'“'+cfg.quote+'”':'';
    var ph=fixImg(t.photo),hp=$('hph');
    if(ph){if(hp.getAttribute('src')!==ph)hp.src=ph;hp.style.display=''}else hp.style.display='none';
    hp.onerror=function(){this.style.display='none'};
    var lg=fixImg(t.logo),l=$('lg');
    if(lg){if(l.getAttribute('src')!==lg)l.src=lg;l.style.display='';l.style.height=t.logoH+'vh';l.className='p-'+t.logoPos}else l.style.display='none';
    l.onerror=function(){this.style.display='none'};
    var qr=$('qr');qr.style.display=t.qr?'':'none';qr.className='q-'+t.qrPos;
    var ly=(t.layout==='wall')&&!isLive();
    $('bub').style.display=ly?'none':'';$('wall').style.display=ly?'grid':'none';
    if(ly!==lastLy){lastLy=ly;if(ly)renderWall();else if(msgs[idx])show(msgs[idx])}
    var lvs=isLive()?liveEmbed(cfg.live,true):'';
    $('scr').classList.toggle('live',!!lvs);
    if(lvs!==lastLv){lastLv=lvs;$('lv').innerHTML=lvs?'<iframe src="'+ea(lvs)+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>':'';fitLive();setTimeout(fitLive,400)}
    drawVel();
  }
  function show(m){
    var t=theme(cfg),b=$('bub');
    if(t.layout==='wall'&&!isLive()){wallPage=0;renderWall(m);clearTimeout(timer);timer=setTimeout(next,(cfg.secs||12)*1000);return}
    b.className='a-'+t.anim+' out';
    setTimeout(function(){
      var im=fixImg(m.img);
      b.innerHTML=(im?'<img id="bimg" alt="" src="'+ea(im)+'" onerror="this.remove()">':'')
        +'<div><div id="bt">“'+esc(m.text)+'”</div><div id="bf">— '+esc(m.name)+'</div></div>';
      b.className='a-'+t.anim;
    },900);
    clearTimeout(timer);timer=setTimeout(next,(cfg.secs||12)*1000);
  }
  function next(){
    if(cfg.pause||!msgs.length){timer=setTimeout(next,2500);return}
    if(theme(cfg).layout==='wall'&&!isLive()){wallPage++;renderWall();timer=setTimeout(next,(cfg.secs||12)*1000);return}
    idx=(idx+1)%msgs.length;show(msgs[idx]);
  }
  RV.on('value',function(s){nVel=s.numChildren();drawVel()});
  function fmt(ms){var s=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=function(n){return n<10?'0'+n:''+n};return (h?h+':':'')+p(m)+':'+p(x)}
  function tick(){
    var t=theme(cfg),now=Date.now(),P=cfg.prog||{};
    var items=Object.keys(P).map(function(k){return {id:k,name:P[k].name,at:P[k].at}}).sort(function(a,b){return a.at-b.at});
    var cel=null,nxt=null;
    items.forEach(function(it){if(it.at<=now&&now-it.at<30000)cel=it;if(!nxt&&it.at>now)nxt=it});
    var pill=$('cdp'),o=$('cdo');
    if(t.countdown&&nxt){pill.style.display='';pill.textContent=nxt.name+' en '+fmt(nxt.at-now)}else pill.style.display='none';
    if(cel&&t.cdBig){$('cdn').textContent='Es la hora';$('cdl').textContent=cel.name;o.style.display='flex'}
    else o.style.display='none';
  }
  setInterval(tick,500);
  RC.on('value',function(s){
    var first=(lastNow===null);
    cfg=s.val()||{};paint();
    var an=cfg.ann,ae=$('ann');
    if(an&&an.text){ae.textContent=an.text;ae.style.display='flex'}else ae.style.display='none';
    if(first){lastNow=cfg.nowTs||0;return}
    if(cfg.now&&cfg.nowTs&&cfg.nowTs!==lastNow){
      lastNow=cfg.nowTs;
      var i=msgs.findIndex(function(m){return m.id===cfg.now});
      if(i>=0){idx=i;show(msgs[i])}
    }
  });
  RM.on('value',function(s){
    msgs=[];s.forEach(function(c){var v=c.val();v.id=c.key;if(v.status==='aprobado')msgs.push(v)});
    msgs.sort(function(a,b){return a.ts-b.ts});
    if(seen===null){seen={};msgs.forEach(function(m){seen[m.id]=1});if(msgs.length){idx=msgs.length-1;show(msgs[idx])}return}
    var fresh=msgs.filter(function(m){return !seen[m.id]});
    msgs.forEach(function(m){seen[m.id]=1});
    if(fresh.length){var m=fresh[fresh.length-1];idx=msgs.findIndex(function(x){return x.id===m.id});show(m)}
  });
}
</script>
</body>
