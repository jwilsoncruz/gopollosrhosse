<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WiFi Go Pollos Rhosse</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#111;
  color:#fff;
  text-align:center;
}

.container {
  padding:20px;
}

.logo {
  width:120px;
  margin:10px auto;
}

h1 {
  color:#ffcc00;
}

.oferta {
  background:#ff0000;
  padding:12px;
  border-radius:10px;
  margin:15px 0;
  font-weight:bold;
}

input {
  width:90%;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
  border:none;
  font-size:16px;
}

button {
  width:95%;
  padding:15px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#00c853;
  color:white;
  font-size:18px;
  font-weight:bold;
}

.hidden {
  display:none;
}

.clave {
  font-size:32px;
  color:#ffcc00;
  margin:10px 0;
}
</style>
</head>

<body>

<!-- PANTALLA 1 -->
<div class="container" id="pantalla1">

  <img src="https://jwilsoncruz.github.io/gopollosrhosse/logobo.png" class="logo">

  <h1>🍗 WiFi Gratis</h1>

  <div class="oferta">
    🔥 SOLO HOY 🔥<br>
    10% DESCUENTO en tu pedido
  </div>

  <p>Accede al WiFi + promociones exclusivas</p>

  <input type="text" id="nombre" placeholder="Tu nombre">
  <input type="tel" id="telefono" placeholder="Tu WhatsApp">
  <input type="date" id="fecha">

  <button onclick="continuar()">📲 OBTENER WIFI + DESCUENTO</button>

</div>

<!-- PANTALLA 2 -->
<div class="container hidden" id="pantalla2">

  <h1>✅ ¡Conectado!</h1>

  <div class="oferta">
    📶 TU CLAVE WIFI
    <div class="clave" id="clave"></div>
  </div>

  <div class="oferta">
    🎁 Muestra este mensaje y recibe tu descuento
  </div>

  <button onclick="enviarWhatsApp()">📲 Pedir promoción por WhatsApp</button>

</div>

<script>

// 🔐 Generar clave automática diaria PolloAQUIEL DIA ACTUAL
function generarClave(){
  let hoy = new Date();
  let dia = hoy.getDate();
  return "POLLO" + dia;
}

// 🚀 Función principal
function continuar(){

  let nombre = document.getElementById("nombre").value;
  let telefono = document.getElementById("telefono").value;
  let fecha = document.getElementById("fecha").value;

  if(nombre === "" || telefono === "" || fecha === ""){
    alert("Completa todos los campos");
    return;
  }

  // Guardar en Google Sheets
  fetch("https://script.google.com/macros/s/AKfycbx-C5jEDv-krY4NMp1Kbw0MVzQeM7IyhP_1-MzhgwffMXz6kkwAAMJwVeJy4nKpTOwvEA/exec", {
    method: "POST",
    body: JSON.stringify({
      nombre: nombre,
      telefono: telefono,
      fecha: fecha
    })
  });

  // Guardar local
  localStorage.setItem("cliente_nombre", nombre);
  localStorage.setItem("cliente_tel", telefono);
  localStorage.setItem("cliente_fecha", fecha);

  // Generar clave
  let clave = generarClave();
  document.getElementById("clave").innerText = clave;

  // Cambiar pantalla
  document.getElementById("pantalla1").classList.add("hidden");
  document.getElementById("pantalla2").classList.remove("hidden");
}

// 📲 WhatsApp
function enviarWhatsApp(){
  let nombre = localStorage.getItem("cliente_nombre");
  let clave = generarClave();

  let mensaje = `Hola, soy ${nombre}. Ya me registré al WiFi. Mi clave es ${clave}. Quiero mi promoción`;

  let url = `https://wa.me/59168972863?text=${encodeURIComponent(mensaje)}`;

  window.open(url, "_blank");
}

</script>

</body>
</html>
