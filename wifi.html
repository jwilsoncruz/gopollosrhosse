<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WiFi Go Pollos Rhosse</title>
<link rel="icon" href="favicon.ico">

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#111;
  color:#fff;
  text-align:center;
}

.container {
  padding:20px;
}

.logo {
  width:120px;
  margin:10px auto;
}

h1 {
  color:#ffcc00;
}

.oferta {
  background:#ff0000;
  padding:12px;
  border-radius:10px;
  margin:15px 0;
  font-weight:bold;
}

input {
  width:90%;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
  border:none;
  font-size:16px;
}

button {
  width:95%;
  padding:15px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#00c853;
  color:white;
  font-size:18px;
  font-weight:bold;
}

.btn2 {
  background:#ff9800;
}

.hidden {
  display:none;
}
</style>
</head>

<body>

<!-- PANTALLA 1 -->
<div class="container" id="pantalla1">

  <img src="https://jwilsoncruz.github.io/gopollosrhosse/logobo.png" class="logo">

  <h1>🍗 WiFi Gratis</h1>

  <div class="oferta">
    📶 Accede al WiFi GRATIS<br>
    🎁 Beneficios exclusivos en tu compra
  </div>

  <p>Regístrate para continuar</p>

  <input type="text" id="nombre" placeholder="Tu nombre">
  <input type="tel" id="telefono" placeholder="Tu WhatsApp">
  <input type="date" id="fecha">

  <button onclick="continuar()">📲 CONTINUAR</button>

</div>

<!-- PANTALLA 2 -->
<div class="container hidden" id="pantalla2">

  <h1>✅ ¡Listo!</h1>

  <div class="oferta">
    🥤 SODA MINI GRATIS<br>
    👉 En compras desde Bs 20
  </div>

  <p>📲 Muestra este mensaje en caja para reclamar</p>

  <p style="color:#ffcc00;">
    🔥 Promoción válida solo hoy
  </p>

  <a href="https://jwilsoncruz.github.io/gopollosrhosse/" target="_blank">
    <button>🍗 PEDIR AHORA</button>
  </a>

  <button class="btn2" onclick="enviarWhatsApp()">📲 Pedir por WhatsApp</button>

</div>

<script>

function continuar(){

  let nombre = document.getElementById("nombre").value;
  let telefono = document.getElementById("telefono").value;
  let fecha = document.getElementById("fecha").value;

  if(nombre === "" || telefono === "" || fecha === ""){
    alert("Completa todos los campos");
    return;
  }

  fetch("https://script.google.com/macros/s/AKfycbx-C5jEDv-krY4NMp1Kbw0MVzQeM7IyhP_1-MzhgwffMXz6kkwAAMJwVeJy4nKpTOwvEA/exec", {
    method: "POST",
    body: JSON.stringify({
      nombre: nombre,
      telefono: telefono,
      fecha: fecha
    })
  });

  localStorage.setItem("cliente_nombre", nombre);

  document.getElementById("pantalla1").classList.add("hidden");
  document.getElementById("pantalla2").classList.remove("hidden");
}

function enviarWhatsApp(){
  let nombre = localStorage.getItem("cliente_nombre");

  let mensaje = `Hola, soy ${nombre} 🍗  
Ya me registré al WiFi  

👉 Quiero hacer un pedido y aprovechar la promo de la soda mini 🥤  

https://jwilsoncruz.github.io/gopollosrhosse/`;

  let url = `https://wa.me/59168972863?text=${encodeURIComponent(mensaje)}`;

  window.open(url, "_blank");
}

</script>

</body>
</html>
