<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WiFi Go Pollos Rhosse</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#111;
  color:#fff;
  text-align:center;
}

.container {
  padding:20px;
}

.logo {
  width:120px;
  margin:10px auto;
}

h1 {
  color:#ffcc00;
  font-size:22px;
}

.oferta {
  background:#ff0000;
  padding:10px;
  border-radius:10px;
  margin:15px 0;
  font-weight:bold;
}

input {
  width:90%;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
  border:none;
  font-size:16px;
}

button {
  width:95%;
  padding:15px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#00c853;
  color:white;
  font-size:18px;
  font-weight:bold;
}

button:hover {
  background:#00e676;
}

.hidden {
  display:none;
}

.small {
  font-size:12px;
  color:#ccc;
}
</style>
</head>

<body>

<div class="container" id="pantalla1">

  <img src="https://jwilsoncruz.github.io/gopollosrhosse/logobo.png" class="logo">

  <h1>🍗 WiFi Gratis Go Pollos Rhosse</h1>

  <div class="oferta">
    🔥 SOLO HOY 🔥<br>
    10% DESCUENTO en tu pedido<br>
    📲 Muestra este mensaje en caja
  </div>

  <p>Accede al WiFi + promociones exclusivas</p>

  <input type="text" id="nombre" placeholder="Tu nombre">
  <input type="tel" id="telefono" placeholder="Tu WhatsApp">
  <input type="date" id="fecha">

  <button onclick="continuar()">📲 OBTENER WIFI + DESCUENTO</button>

  <p class="small">+100 clientes ya conectados hoy</p>

</div>

<div class="container hidden" id="pantalla2">

  <h1>✅ ¡Registro exitoso!</h1>

  <div class="oferta">
    🎁 MUESTRA ESTE MENSAJE<br>
    y recibe tu descuento HOY
  </div>

  <p>Haz clic abajo para obtener tu clave WiFi</p>

  <button onclick="enviarWhatsApp()">📲 OBTENER CLAVE AHORA</button>

</div>

<script>
function continuar(){
  let nombre = document.getElementById("nombre").value;
  let telefono = document.getElementById("telefono").value;
  let fecha = document.getElementById("fecha").value;

  if(nombre === "" || telefono === "" || fecha === ""){
    alert("Completa todos los campos");
    return;
  }

  // ENVIAR A GOOGLE SHEETS 🔥
  fetch("https://script.google.com/macros/s/AKfycbx-C5jEDv-krY4NMp1Kbw0MVzQeM7IyhP_1-MzhgwffMXz6kkwAAMJwVeJy4nKpTOwvEA/exec", {
    method: "POST",
    body: JSON.stringify({
      nombre: nombre,
      telefono: telefono,
      fecha: fecha
    })
  })
  .then(res => console.log("Guardado OK"))
  .catch(err => console.log("Error", err));

  // GUARDAR LOCAL
  localStorage.setItem("cliente_nombre", nombre);
  localStorage.setItem("cliente_tel", telefono);
  localStorage.setItem("cliente_fecha", fecha);

  // CAMBIO DE PANTALLA
  document.getElementById("pantalla1").classList.add("hidden");
  document.getElementById("pantalla2").classList.remove("hidden");
}
</script>

</body>
</html>
