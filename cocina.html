<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocina PRO - Go Pollos Rhosse</title>
<link rel="icon" href="cocina.ico">
<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#4b0000;
color:white;
}

header{
background:#d50000;
padding:20px;
text-align:center;
}

h1{ margin:10px 0; }

#estadoConexion{
font-size:13px;
opacity:0.85;
margin-top:4px;
}

#listaPedidos{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:20px;
padding:20px;
}

#sinPedidos{
text-align:center;
padding:60px 20px;
font-size:20px;
opacity:0.8;
}

.card{
border-radius:12px;
padding:20px;
box-shadow:0 6px 14px rgba(0,0,0,0.4);
color:black;
font-size:18px;
}

.nuevo{
background:#ffb3b3;
border-left:10px solid red;
animation:blink 1s infinite;
}

.preparacion{
background:#fff3b0;
border-left:10px solid orange;
}

.listo{
background:#b9f6ca;
border-left:10px solid green;
}

@keyframes blink{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

.detalle{
margin:15px 0;
line-height:1.4;
}

.total{
font-size:22px;
font-weight:bold;
}

.botones{
margin-top:15px;
}

button{
background:#d50000;
border:none;
color:white;
padding:10px 14px;
border-radius:6px;
cursor:pointer;
font-size:15px;
margin:5px;
}

button:hover{ opacity:0.85; }

.activar{
background:white;
color:#d50000;
font-weight:bold;
}

.modo-tv header{ display:none; }
.modo-tv .botones{ display:none; }

#avisoTV{
display:none;
position:fixed;
bottom:10px;
right:10px;
background:rgba(0,0,0,0.6);
color:white;
padding:8px 12px;
border-radius:8px;
font-size:13px;
z-index:999;
}
.modo-tv #avisoTV{ display:block; }

</style>
</head>

<body>

<header>
<h1>🍗 Pantalla Cocina PRO</h1>
<button class="activar" id="btnSonido" onclick="activarSonido()">🔔 Activar sonido</button>
<button class="activar" onclick="pantallaCompleta()">📺 Pantalla completa</button>
<button class="activar" onclick="modoTV()">🖥 Modo TV</button>
<div id="estadoConexion">Conectando...</div>
</header>

<div id="listaPedidos"></div>
<div id="sinPedidos" style="display:none;">✅ No hay pedidos pendientes</div>
<div id="avisoTV">Doble clic en cualquier parte, o tecla Esc, para salir del Modo TV</div>

<audio id="alerta" preload="auto">
<source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg">
</audio>

<script>

const API = "https://script.google.com/macros/s/AKfycbw2m9_YSX_-11iMZCmMT24GwESuGub15Z943HcXBceA1Ez_md6eYKfINeL4wz2PDigO/exec";

let sonido = false;
let idsPrevios = new Set();
let primerCarga = true;
let pedidosActuales = [];   // última lista de pedidos conocida (para actualizar la pantalla al instante)

// ================= UTILIDAD: evitar HTML inyectado =================
function escapar(texto){
  const div = document.createElement("div");
  div.textContent = String(texto ?? "");
  return div.innerHTML;
}

// ================= NÚMERO DE PEDIDO A MOSTRAR =================
// p.numero es el contador que se reinicia cada día (columna 7 de la hoja).
// p.fila es la fila real en la hoja de cálculo, que nunca se reinicia.
// Usamos p.numero siempre que exista; p.fila queda solo como respaldo
// para pedidos guardados antes de que existiera la columna "numero".
function numeroVisible(p){
  return (p.numero !== null && p.numero !== undefined && p.numero !== "")
    ? p.numero
    : p.fila;
}

// ================= SONIDO =================
function activarSonido(){
  sonido = true;
  const btn = document.getElementById("btnSonido");
  if(btn) btn.textContent = "🔔 Sonido activado";
  // Desbloquea el audio en el navegador aprovechando el clic del usuario
  const audio = document.getElementById("alerta");
  audio.play().then(()=>{ audio.pause(); audio.currentTime = 0; }).catch(()=>{});
}

function playSound(){
  const audio = document.getElementById("alerta");
  audio.currentTime = 0;
  audio.play().catch(()=>{});
  setTimeout(()=>{ audio.currentTime = 0; audio.play().catch(()=>{}); }, 300);
}

// ================= DETECTAR PEDIDOS NUEVOS =================
function detectarNuevos(pedidos){
  const nuevos = pedidos.filter(p => !idsPrevios.has(p.fila));

  // En la primera carga no suena (evita alarmas con pedidos que ya estaban ahí)
  if(nuevos.length > 0 && sonido && !primerCarga){
    playSound();
  }

  idsPrevios = new Set(pedidos.map(p => p.fila));
  primerCarga = false;
}

// ================= PANTALLA COMPLETA =================
function pantallaCompleta(){
  document.documentElement.requestFullscreen().catch(()=>{});
}

// ================= MODO TV (con salida garantizada) =================
function modoTV(){
  document.body.classList.toggle("modo-tv");
}

document.addEventListener("dblclick", ()=>{
  if(document.body.classList.contains("modo-tv")){
    document.body.classList.remove("modo-tv");
  }
});

document.addEventListener("keydown", (e)=>{
  if(e.key === "Escape" && document.body.classList.contains("modo-tv")){
    document.body.classList.remove("modo-tv");
  }
});

// ================= DIBUJAR TARJETAS =================
// Recibe la lista de pedidos ya filtrada (sin "Entregado") y la pinta.
// Separado de cargarPedidos() para poder redibujar al instante cuando
// se toca un botón, sin tener que esperar otra vuelta a Google Sheets.
function renderPedidos(activos){

  if(activos.length === 0){
    document.getElementById("listaPedidos").innerHTML = "";
    document.getElementById("sinPedidos").style.display = "block";
    return;
  }
  document.getElementById("sinPedidos").style.display = "none";

  let html = "";

  activos.forEach(p=>{

    // 🧠 limpiar y contar los items del pedido
    const items = String(p.detalle || "")
      .split("\n")
      .map(x => x.replace(/^-+/, "").trim())
      .filter(x => x !== "");

    const contador = {};
    items.forEach(i=>{
      contador[i] = (contador[i] || 0) + 1;
    });

    let resumen = "";
    for(const k in contador){
      resumen += `🍗 ${contador[k]}x ${escapar(k)}<br>`;
    }

    let clase = "nuevo";
    if(p.estado === "En preparacion") clase = "preparacion";
    if(p.estado === "Listo") clase = "listo";

    const fila = encodeURIComponent(p.fila);

    html += `
<div class="card ${clase}">

<h2>Pedido ${escapar(numeroVisible(p))}</h2>

<div><b>Mesa:</b> ${escapar(p.mesa)}</div>

<div style="font-size:22px;font-weight:bold;">
${resumen}
</div>

<div class="detalle">
${items.map(i => "• " + escapar(i)).join("<br>")}
</div>

<div class="total">Total Bs ${escapar(p.total)}</div>

<div><b>Estado:</b> ${escapar(p.estado)}</div>

<div class="botones">

${p.estado === "Nuevo"
  ? `<button onclick="cambiarEstado('${fila}','En preparacion')">Preparar</button>`
  : `<button disabled style="opacity:0.4">Preparar</button>`}

${p.estado === "En preparacion"
  ? `<button onclick="cambiarEstado('${fila}','Listo')" style="background:orange">Listo</button>`
  : `<button disabled style="opacity:0.4">Listo</button>`}

${p.estado === "Listo"
  ? `<button onclick="cambiarEstado('${fila}','Entregado')" style="background:green">Entregado</button>`
  : `<button disabled style="opacity:0.4">Entregado</button>`}

</div>

</div>
`;

  });

  document.getElementById("listaPedidos").innerHTML = html;
}

// ================= PROCESAR LISTA RECIBIDA DE LA HOJA =================
function procesarYRenderizar(pedidos){

  // 🔥 ORDEN: Nuevo -> En preparacion -> Listo -> (Entregado al final)
  const orden = {"Nuevo":1, "En preparacion":2, "Listo":3, "Entregado":4};
  pedidos.sort((a,b)=> (orden[a.estado] || 99) - (orden[b.estado] || 99));

  // 🔔 detectar pedidos nuevos (usando todos los que llegan, no solo los visibles)
  detectarNuevos(pedidos.filter(p => p.estado !== "Entregado"));

  pedidosActuales = pedidos;

  renderPedidos(pedidos.filter(p => p.estado !== "Entregado"));
}

// ================= CARGAR PEDIDOS =================
function cargarPedidos(){

  fetch(API + "?accion=obtener")
  .then(r=>r.json())
  .then(pedidosRecibidos=>{

    const pedidos = Array.isArray(pedidosRecibidos) ? pedidosRecibidos : [];
    document.getElementById("estadoConexion").textContent = "🟢 Conectado";

    procesarYRenderizar(pedidos);

  })
  .catch(err=>{
    console.error(err);
    document.getElementById("estadoConexion").textContent = "🔴 Sin conexión — reintentando...";
  });

}

// ================= CAMBIAR ESTADO =================
function cambiarEstado(fila, estado){

  // 1) Actualiza la pantalla AL INSTANTE con lo que ya sabemos en el navegador,
  //    sin esperar la respuesta de Google Sheets. Así no hay delay perceptible.
  const pedido = pedidosActuales.find(p => String(p.fila) === String(fila));
  const estadoAnterior = pedido ? pedido.estado : null;

  if(pedido){
    pedido.estado = estado;
    renderPedidos(pedidosActuales.filter(p => p.estado !== "Entregado"));
  }

  // 2) Guarda el cambio real en la hoja, en segundo plano.
  fetch(API, {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body: "accion=actualizar&fila=" + encodeURIComponent(fila) + "&estado=" + encodeURIComponent(estado)
  })
  .then(r=>r.json())
  .then(d=>{
    if(!d.ok){
      // No se pudo guardar: revertir el cambio visual y avisar
      if(pedido){
        pedido.estado = estadoAnterior;
        renderPedidos(pedidosActuales.filter(p => p.estado !== "Entregado"));
      }
      alert("❌ No se pudo actualizar el pedido");
    }
    // Si sí se guardó, no hace falta recargar nada: la pantalla ya está
    // al día, y el sondeo automático cada 3s mantiene todo sincronizado.
  })
  .catch(err=>{
    console.error(err);
    if(pedido){
      pedido.estado = estadoAnterior;
      renderPedidos(pedidosActuales.filter(p => p.estado !== "Entregado"));
    }
    alert("❌ Error de conexión al actualizar el pedido");
  });

}

// ================= ARRANQUE =================
cargarPedidos();
setInterval(cargarPedidos, 3000);

</script>

</body>
</html>
