<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocina PRO - Go Pollos Rhosse</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#4b0000;
color:white;
}

header{
background:#d50000;
padding:20px;
text-align:center;
}

.logo{
max-width:160px;
display:block;
margin:auto;
}

h1{
margin:10px 0;
}

#listaPedidos{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:20px;
padding:20px;
}

.card{
border-radius:12px;
padding:20px;
box-shadow:0 6px 14px rgba(0,0,0,0.4);
color:black;
font-size:18px;
}

.nuevo{
background:#ffb3b3;
border-left:10px solid red;
}

.preparacion{
background:#fff3b0;
border-left:10px solid orange;
}

.listo{
background:#b9f6ca;
border-left:10px solid green;
}

.detalle{
margin:15px 0;
line-height:1.4;
}

.total{
font-size:22px;
font-weight:bold;
}

.botones{
margin-top:15px;
}

button{
background:#d50000;
border:none;
color:white;
padding:10px 14px;
border-radius:6px;
cursor:pointer;
font-size:15px;
margin-right:5px;
}

button:hover{
opacity:0.85;
}

.activar{
margin-top:10px;
background:white;
color:#d50000;
font-weight:bold;
}

</style>
</head>

<body>

<header>

<img src="logo.png" class="logo">

<h1>🍗 Pantalla Cocina PRO</h1>

<button class="activar" onclick="activarSonido()">🔔 Activar sonido</button>

</header>

<div id="listaPedidos"></div>

<audio id="alerta">
<source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg">
</audio>

<script>

const API="https://script.google.com/macros/s/AKfycbzoZMkmQgnMSgavhk-w1RfvKfnLpp-YkAzEhcbmGyJAVp5YjKl91zAe-3T3F8bMiNdx/exec";

let sonido=false;
let ultimoConteo=0;

function activarSonido(){
sonido=true;
alert("🔔 Sonido activado");
}

function cargarPedidos(){

fetch(API+"?accion=obtener")
.then(r=>r.json())
.then(pedidos=>{

let html="";

pedidos.forEach(p=>{

if(p.estado==="Entregado") return;

let clase="nuevo";

if(p.estado==="En preparacion") clase="preparacion";
if(p.estado==="Listo") clase="listo";

html+=`

<div class="card ${clase}">

<h2>Pedido ${p.fila}</h2>

<div><b>Mesa:</b> ${p.mesa}</div>

<div class="detalle">${p.detalle.replace(/\n/g,"<br>")}</div>

<div class="total">Total Bs ${p.total}</div>

<div><b>Estado:</b> ${p.estado}</div>

<div class="botones">

${p.estado==="Nuevo"
? `<button onclick="cambiarEstado(${p.fila},'En preparacion')">Preparar</button>`
: `<button disabled style="opacity:0.4">Preparar</button>`}

${p.estado==="En preparación"
? `<button onclick="cambiarEstado(${p.fila},'Listo')" style="background:orange">Listo</button>`
: `<button disabled style="opacity:0.4">Listo</button>`}

${p.estado==="Listo"
? `<button onclick="cambiarEstado(${p.fila},'Entregado')" style="background:green">Entregado</button>`
: `<button disabled style="opacity:0.4">Entregado</button>`}

</div>

</div>

`;

});

document.getElementById("listaPedidos").innerHTML=html;

if(pedidos.length>ultimoConteo){
if(sonido){
document.getElementById("alerta").play();
}
ultimoConteo=pedidos.length;
}

});

}

function cambiarEstado(fila,estado){

fetch(API,{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:`accion=actualizar&fila=${fila}&estado=${estado}`
})
.then(r=>r.json())
.then(d=>{
if(d.ok){
cargarPedidos();
}
});

}

setInterval(cargarPedidos,1000);

cargarPedidos();

</script>
</body>
</html>
